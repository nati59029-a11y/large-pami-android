<!doctype html>
<html dir="rtl" lang="he">
<head><meta charset="utf-8"><title>כספית (דמה לבדיקות)</title></head>
<body>
<!-- כספית מדומה לבדיקות התוסף בלבד, במבנה של המשרד האחורי האמיתי (/bo, דוח היכרות 18.11): קטלוג – 4 כפתורי יצוא ומשימה (job) → get_job_result;
     דוח מכירות – לוח שנה בסגנון vuejs-datepicker (שדה לקריאה בלבד, כפתורי חודש הפוכים ב-RTL) + "צור קובץ"; ייבוא – vue-multiselect #job_type, ושדה הקובץ מופיע רק אחרי הבחירה.
     נתיבי # כמו בכספית, הורדות דרך XHR/fetch + blob + a.download, וסודות "שתולים" לבדיקת הניקוי -->
<header id="hdr" hidden>
  <span id="mnu" role="button">ממשקים</span>
  <div id="sub" hidden><a href="#/sales-items-reports">דוח מכירות לפריטים</a></div>
  <span id="empm" role="button">עובדים</span><div id="empsub"></div>
  <span class="contact">owner@example.co.il · 052-1234567</span>
</header>
<main id="app"></main>
<script>
'use strict';
const TOK = 'Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTYifQ.sflKxwRJSMeKKF2QT4fwpM';
const V = () => localStorage.getItem('variant') || '';
const authed = () => localStorage.getItem('auth') === '1';
document.cookie = 'ASP.NET_SessionId=SESSIONabc123def456; path=/';
window.ev = [];
function dl(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); ev.push('dl:' + name); }
document.getElementById('mnu').onclick = () => { document.getElementById('sub').hidden = false; };
// תפריט "עובדים": תת-התפריט נוצר רק במעבר עכבר (כמו תפריט נפתח); לחיצה נרשמת (אסור שהתוסף ילחץ)
document.getElementById('empm').addEventListener('mouseover', () => { document.getElementById('empsub').innerHTML = '<a href="#/employees">רשימת עובדים</a> <a href="#/attendance-report">דוח נוכחות</a> <a href="#/hours-reports">דוח שעות מרוכז</a>'; });
const hit = (k) => { ev.push(k); localStorage.setItem('attHits', (localStorage.getItem('attHits') || '') + k + ';'); };
document.getElementById('empm').addEventListener('click', () => hit('emp-click'));
const HE_M = ['ינו', 'פבר', 'מרץ', 'אפר', 'מאי', 'יונ', 'יול', 'אוג', 'ספט', 'אוק', 'נוב', 'דצמ']; // כמו בכספית: "נוב 2026"
const pad = (n) => String(n).padStart(2, '0');
// משימה של כספית: POST (run-as-job) → { job_id } ואחר כך הקובץ מ-get_job_result
function job(url, body, filename) {
  fetch(url + '?token=Zx9kQ2mP7vL4nR8sT1wY6bC3', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: TOK, 'run-as-job': 'true', 'channel-name': 'c1' }, body: JSON.stringify(body || {}) })
    .then((r) => r.json()).then(() => setTimeout(() => {
      const x = new XMLHttpRequest();
      x.open('GET', '/bo/files/get_job_result?filename=' + encodeURIComponent(filename));
      x.setRequestHeader('Authorization', TOK);
      x.responseType = 'blob';
      x.onload = () => dl(x.response, filename);
      x.send();
    }, 400));
}
// לוח שנה בסגנון vuejs-datepicker: input לקריאה בלבד; .prev מקדם חודש ו-.next מחזיר (כמו ב-RTL)
function datePicker(host, init) {
  host.innerHTML = '<div class="vdp-datepicker rtl"><div><input class="form-control vue-field-undisable" type="text" readonly></div><div class="vdp-datepicker__calendar" style="display:none"></div></div>';
  const inp = host.querySelector('input'), cal = host.querySelector('.vdp-datepicker__calendar');
  let v = init, view = new Date(init.getFullYear(), init.getMonth(), 1);
  const show = () => { inp.value = pad(v.getDate()) + '/' + pad(v.getMonth() + 1) + '/' + v.getFullYear(); };
  const draw = () => {
    const y = view.getFullYear(), m = view.getMonth(), n = new Date(y, m + 1, 0).getDate(), off = new Date(y, m, 1).getDay();
    cal.innerHTML = '<header><span class="prev">&lt;</span><span class="day__month_btn up">' + HE_M[m] + ' ' + y + '</span><span class="next">&gt;</span></header><div>'
      + '<span class="cell day-header">א</span><span class="cell day-header">ב</span><span class="cell day-header">ג</span><span class="cell day-header">ד</span><span class="cell day-header">ה</span><span class="cell day-header">ו</span><span class="cell day-header">ש</span>'
      + Array.from({ length: off }, () => '<span class="cell day blank"></span>').join('') + Array.from({ length: n }, (_, k) => { const wd = (off + k) % 7, cur = new Date(y, m, k + 1); return '<span class="cell day' + (wd >= 5 ? ' weekend' : '') + (+cur === +new Date(v.getFullYear(), v.getMonth(), v.getDate()) ? ' selected' : '') + '">' + (k + 1) + '</span>'; }).join('') + '</div>';
    cal.querySelector('.prev').onclick = (e) => { e.stopPropagation(); view = new Date(y, m + 1, 1); draw(); };
    cal.querySelector('.next').onclick = (e) => { e.stopPropagation(); view = new Date(y, m - 1, 1); draw(); };
    cal.querySelectorAll('.cell.day:not(.blank)').forEach((c) => { c.onclick = (e) => { e.stopPropagation(); v = new Date(y, m, +c.textContent); show(); cal.style.display = 'none'; }; });
  };
  inp.onclick = (e) => { e.stopPropagation(); draw(); cal.style.display = 'block'; };
  document.addEventListener('click', () => { cal.style.display = 'none'; });
  show();
  return () => v;
}
function render() {
  const h = location.hash || '#/';
  // מדמה את כספית האמיתית: מסך מסוים (redir) / כל טעינה (redirLoad) מעבירים אל מחוץ למשרד האחורי (/bo) – לקופה
  if (localStorage.getItem('redirLoad') === '1' || (localStorage.getItem('redir') && h.startsWith(localStorage.getItem('redir')))) { location.href = '/' + h.slice(2).split('/')[0] + h; return; }
  const app = document.getElementById('app');
  document.getElementById('hdr').hidden = !authed();
  document.getElementById('sub').hidden = true;
  if (!authed()) {
    app.innerHTML = '<h1>כניסה למערכת</h1><input name="user" id="u" placeholder="שם משתמש"><input type="password" id="p" placeholder="סיסמה"><button id="login">כניסה</button>';
    if (h !== '#/login') location.hash = '#/login';
    return;
  }
  fetch('/api/me?token=Zx9kQ2mP7vL4nR8sT1wY6bC3', { headers: { Authorization: TOK } }).then((r) => r.json()).then((j) => { window.me = j; });
  if (h.startsWith('#/catalogs')) {
    const B = ['יצוא לאקסל', 'יצוא לספירת מלאי', V() === 'new' ? 'שמירת קובץ' : 'יצוא כולל ברקודים', 'יצוא לשרת משקלים'];
    app.innerHTML = '<div id="catalog-index"><header class="row catalog-index-header"><div class="col-xs-12 col-sm-9">' + B.map((b, k) => '<button class="btn btn-success" data-k="' + k + '">' + b + '</button>').join('') + '</div></header><table><tr><td>כרטיס 4580123412341234</td></tr></table></div>';
    app.querySelectorAll('#catalog-index button').forEach((b) => { b.onclick = () => { ev.push('cat:' + b.dataset.k); if (b.dataset.k === '0') job('/bo/merkaz/items/report.xlsx', {}, 'catalogs.xlsx'); if (b.dataset.k === '2') job('/bo/merkaz/items/full_report.xlsx', { include_store_price: false }, 'catalogs_with_barcodes.xlsx'); }; });
  } else if (h.startsWith('#/sales-items-reports')) {
    app.innerHTML = '<div class="panel panel-default"><div class="panel-body"><div class="form-group row"><form class="form-inline col-sm-5"><div class="form-group title-on-top"><label>מתאריך</label><div class="vue-field-value" id="dfrom"></div></div><div class="form-group title-on-top"><label>עד תאריך</label><div class="vue-field-value" id="dto"></div></div></form><div class="col-sm-7 align-center"><button type="button" class="btn btn-success" id="mk">צור קובץ</button></div></div></div></div>';
    const now = new Date(), f = datePicker(document.getElementById('dfrom'), now), t = datePicker(document.getElementById('dto'), now);
    document.getElementById('mk').onclick = () => { const a = f(), b = t(); const k = (d) => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); ev.push('mk:' + k(a) + '-' + k(b)); job('/bo/merkaz/reports/sales_items', { from: k(a), to: k(b) }, 'sales_items_' + k(a) + '_' + k(b) + '.csv'); };
  } else if (h.startsWith('#/csv-imports')) {
    fetch('/bo/merkaz/upload_csv_index', { headers: { Authorization: TOK } });
    const O = [['new', 'טעינת פריטים חדשים'], ['club', 'טעינת מועדון לקוחות'], ['cust', 'טעינת לקוחות הקפה'], ['price', 'עדכון מחיר לצרכן ו/או מחיר עלות לפריטים'], ['sprice', 'עדכון מחיר בחנות'], ['upd', 'עדכון פריטים'], ['newnp', 'טעינת פריטים חדשים מנטפוס']];
    app.innerHTML = '<div class="csv-import-form app-page"><p>טעינה עבור חברה: עסק בדיקה חנות: עסק בדיקה-סניף א</p><div class="form-group title-on-top"><label>בחר סוג קובץ טעינה</label><div class="multiselect"><div class="multiselect__tags"><input id="job_type" type="text" class="multiselect__input" placeholder="בחר"></div><div class="multiselect__content-wrapper" style="display:none"><ul class="multiselect__content">'
      + O.map(([v, t]) => '<li class="multiselect__element"><span class="multiselect__option" data-v="' + v + '"><span>\u00a0' + t + ' </span></span></li>').join('') + '</ul></div></div></div><div id="more"></div><div id="queue"></div><button type="button" class="btn btn-primary" id="run">העלה קבצים והרץ טעינה</button><div id="hist"></div>'
      + '<label>סיסמת מנהל <input type="password" id="mp" value="hunter2pass"></label><input id="note" value="owner-secret-value"><div class="result" role="alert"></div></div>';
    const wrap = app.querySelector('.multiselect__content-wrapper'), jt = document.getElementById('job_type');
    let t = '';
    jt.addEventListener('focus', () => { wrap.style.display = 'block'; });
    jt.addEventListener('keydown', (e) => { if (e.key === 'Escape') wrap.style.display = 'none'; });
    app.querySelectorAll('.multiselect__option').forEach((o) => { o.onclick = (e) => { e.stopPropagation(); t = o.dataset.v; jt.value = o.textContent; wrap.style.display = 'none'; ev.push('type:' + t);
      // כמו בכספית האמיתית (היכרות 3 + צילום מסך): "בחר קובץ" (#positive-file-uploader) ו"הורד קובץ דוגמה"; בחירת קובץ לא מעלה –
      // מוסיפה שורה לטבלה "ממתין לטעינה" (שם | סוג קובץ | פעולות: הסר). "העלה קבצים והרץ טעינה" מעלה את כל השורות.
      document.getElementById('more').innerHTML = '<label for="positive-file-uploader">בחר קובץ</label> <input type="file" id="positive-file-uploader"> <button type="button" class="btn btn-default" id="sample">הורד קובץ דוגמה</button>';
      document.getElementById('sample').onclick = () => ev.push('sample');
      // upmode (בדיקות 0.1.6 – התקלה של 19.11): '' רגיל; drop – בחירה רגילה לא עובדת, רק גרירה לאזור; xls – רק קובץ שסומן application/vnd.ms-excel;
      // none – שום דבר לא נכנס לתור, ומוצגת הודעת שגיאה (לבדיקת האבחון)
      const um = localStorage.getItem('upmode') || '';
      const addF = (f) => { if (!f) return; if (um === 'xls' && f.type !== 'application/vnd.ms-excel') { ev.push('reject:' + f.type); return; } Q.push({ f, t, tn: jt.value.trim() }); drawQ(); ev.push('add:' + f.type); };
      document.getElementById('positive-file-uploader').onchange = (e) => { if (um !== 'drop' && um !== 'none') addF(e.target.files[0]); else ev.push('change-ignored'); if (um === 'none') { e.target.setAttribute('accept', '.csv,.xls,.xlsx,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); document.querySelector('.result').textContent = 'הקובץ לא נקלט 0521234567 – יש לבחור קובץ מסוג CSV או Excel בפורמט שמתאים לסוג הטעינה שנבחר ברשימה'; } e.target.value = ''; };
      document.getElementById('more').addEventListener('dragover', (e) => e.preventDefault());
      document.getElementById('more').addEventListener('drop', (e) => { e.preventDefault(); ev.push('drop'); if (um === 'drop') addF(e.dataTransfer.files[0]); });
    }; });
    const Q = [];
    // קובץ שמישהו כבר הוסיף ולא העלה (בדיקת "התור לא ריק")
    if (localStorage.getItem('preq')) Q.push({ f: new File(['x'], localStorage.getItem('preq')), t: 'upd', tn: 'עדכון פריטים' });
    const drawQ = () => {
      document.getElementById('queue').innerHTML = Q.length ? '<h4>ממתין לטעינה</h4><table class="table"><thead><tr><th>שם</th><th>סוג קובץ</th><th>פעולות</th></tr></thead><tbody>'
        + Q.map((q, k) => '<tr><td>' + q.f.name + '</td><td>' + q.tn + '</td><td><button class="btn btn-danger" data-rm="' + k + '">הסר</button></td></tr>').join('') + '</tbody></table>' : '';
      document.querySelectorAll('[data-rm]').forEach((b) => { b.onclick = () => { ev.push('rm'); Q.splice(+b.dataset.rm, 1); drawQ(); }; });
    };
    drawQ();
    // "טעינות קודמות" (כמו בכספית): מזהה | שם (קישור) | סוג קובץ | סטטוס | שם משתמש | שגויים/סה"כ שורות | קובץ שגויים | ביטול טעינה... – נשמר בין טעינות הדף
    const HK = 'hist', H = () => JSON.parse(localStorage.getItem(HK) || '[{"id":25519,"name":"ישן.csv","tn":"עדכון פריטים","st":"בוצע","c":"שגויים: 0, נטענו: 3"},{"id":25520,"name":"עדכון מחיר (1).csv","tn":"עדכון מחיר לצרכן ו/או מחיר עלות לפריטים","st":"בוצע","c":"שגויים: 0, נטענו: 1"}]');
    const drawH = () => {
      const L = H().slice().sort((a, b) => b.id - a.id);
      document.getElementById('hist').innerHTML = '<h4>טעינות קודמות</h4><table class="table"><thead><tr><th>מזהה</th><th>שם</th><th>סוג קובץ</th><th>סטטוס</th><th>שם משתמש שביצע טעינה</th><th>שגויים/סה"כ שורות</th><th>קובץ שגויים</th><th>סטטוס ביטול טעינה</th><th>שם משתמש שביצע ביטול טעינה</th><th>פרטים ביטול טעינה</th></tr></thead><tbody>'
        + L.map((x) => '<tr><td>' + x.id + '</td><td><a href="#/csv-imports" class="hl">' + x.name + '</a></td><td>' + x.tn + '</td><td>' + x.st + '</td><td>בעל העסק</td><td>' + (x.c || '') + '</td><td></td><td><button class="btn btn-warning cx">בטל טעינה</button></td><td></td><td></td></tr>').join('') + '</tbody></table>';
      document.querySelectorAll('#hist .cx').forEach((b) => { b.onclick = () => ev.push('cancel'); });
      document.querySelectorAll('#hist .hl').forEach((b) => { b.onclick = (e) => { e.preventDefault(); ev.push('histlink'); }; });
    };
    // histlate: הטבלה מופיעה באיחור (3 שניות); histnone: הטבלה לא מופיעה בכלל
    if (localStorage.getItem('histlate')) setTimeout(drawH, 3000); else if (!localStorage.getItem('histnone')) drawH();
    document.getElementById('run').onclick = async () => {
      ev.push('run');
      if (!Q.length) { document.querySelector('.result').textContent = 'שגיאה: אין קבצים'; return; }
      for (const q of Q.splice(0)) {
        const text = await q.f.text();
        const r = await fetch('/bo/merkaz/upload_csv', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: TOK }, body: JSON.stringify({ type: q.t, name: q.f.name, text }) });
        const n = (await r.json()).n, L = H(), id = Math.max(...L.map((x) => x.id)) + 1;
        L.push({ id, name: q.f.name, tn: q.tn, st: 'בתהליך', c: '' });
        localStorage.setItem(HK, JSON.stringify(L));
        setTimeout(() => { if (localStorage.getItem('imphang')) return; const M = H(), x = M.find((y) => y.id === id); const e = +(localStorage.getItem('imperr') || 0); x.st = 'בוצע'; x.c = 'שגויים: ' + e + ', נטענו: ' + (n - e); localStorage.setItem(HK, JSON.stringify(M)); drawH(); }, 1500);
      }
      drawQ(); drawH();
    };
    document.addEventListener('click', (e) => { if (e.target !== jt) wrap.style.display = 'none'; });
  } else if (h.startsWith('#/attendance-report') || h.startsWith('#/hours-reports') || h.startsWith('#/report-active-employee-on-stores')) {
    // מסך נוכחות מדומה: טבלה עם שמות ושעות (אסור שיגיעו לדוח), וכפתורי פעולה (אסור ללחוץ)
    // גם מחוץ לטבלה: מסנן "עובד" עם שמות, וכרטיסי עובדים (קישור, תווית, כפתור עם שם) – אסור שהשמות יגיעו לדוח
    app.innerHTML = '<div class="attendance"><h2>דוח נוכחות</h2><button class="btn btn-primary" id="attIn">החתמת כניסה</button><button class="btn" id="attX">ייצוא לאקסל</button>'
      + '<label for="empSel">עובד</label><select id="empSel"><option>כל העובדים</option><option>יוסי מזרחיאן</option><option>רותם בלומנפלד</option></select>'
      + '<div class="cards"><div class="card"><a href="#/employee/7">שירה אבוטבולי</a><label>נועם קרליבך</label><button class="btn" aria-label="פרטי אלמוג זילברשטיין">אלמוג זילברשטיין</button></div></div>'
      + '<table class="table"><thead><tr><th>שם עובד</th><th>תאריך</th><th>שעת כניסה</th><th>שעת יציאה</th><th>סה"כ שעות</th></tr></thead><tbody><tr><td>דנה כהנוביץ</td><td>17/11/2026</td><td>08:02</td><td>16:30</td><td>8:28</td></tr></tbody></table></div>';
    document.getElementById('attIn').onclick = () => hit('att-in');
    document.getElementById('attX').onclick = () => hit('att-x');
  } else {
    app.innerHTML = '<h1>ראשי</h1>';
  }
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
