name: Firebase tests (emulator)
# 6ה: הבדיקות של החוקים והפונקציות מול האמולטור (בלי שום פרויקט אמיתי). לא מפרסם דבר.
on:
  push:
    branches: ["feature/**"]
    paths: ["firebase/**", "app-source/**", "large-pami-android-project.zip", ".github/workflows/firebase-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci || npm install
      - run: npm test
      - run: npm run test:multibiz
      - run: npm run test:migrate
