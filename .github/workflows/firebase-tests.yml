name: Firebase tests (emulator)
# 6ה: הבדיקות של החוקים והפונקציות מול האמולטור (בלי שום פרויקט אמיתי). לא מפרסם דבר.
on:
  push:
    branches: ["feature/**"]
    paths: ["firebase/**", "app-source/**", "large-pami-android-project.zip", ".github/workflows/firebase-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci || npm install
      - run: npm test
      # ייבוא ברקע (11.11.2026): היומן המלא (כולל יומני הפונקציות באמולטור) נבדק שאין בו מספרי כרטיס מהקבצים המדומים ואין CVV
      - run: |
          set -o pipefail
          npm run test:multibiz 2>&1 | tee "$RUNNER_TEMP/multibiz.log"
          node scripts/scan-log-for-cards.js "$RUNNER_TEMP/multibiz.log"
      - run: npm run test:migrate
  # 7: בדיקות הדפדפן (ui-*, b-emulator, extra, scenario+compare) מול האמולטור, ב-Chromium. לא מפרסם דבר.
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    env:
      FUNCTIONS_EMULATOR_HOST: 127.0.0.1:5001
      EX: npx firebase emulators:exec --only auth,firestore,storage,functions --project demo-largpeami
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci || npm install
      - run: node scripts/ensure-emulator-secrets.js
      - name: Playwright (global) + Chrome
        run: |
          npm install -g playwright@1.48.2 pdf-lib@1.17.1
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          test -x /usr/bin/google-chrome
      - name: Short TMPDIR (Chromium socket path)
        run: mkdir -p /tmp/t && echo "TMPDIR=/tmp/t" >> "$GITHUB_ENV" && mkdir -p ../out
      - name: b-emulator
        run: $EX "node tests/app-multibiz/b-emulator.js ../app-source/www ../out/b-emulator.json"
      - name: ui-admin
        if: always()
        run: $EX "node tests/app-multibiz/ui-admin.js ../app-source/www ../out/ui-admin.json ../out/shots-admin"
      - name: ui-brand
        if: always()
        run: $EX "node tests/app-multibiz/ui-brand.js ../app-source/www ../out/ui-brand.json ../out/shots-brand"
      - name: ui-bio
        if: always()
        run: $EX "node tests/app-multibiz/ui-bio.js ../app-source/www ../out/ui-bio.json ../out/shots-bio"
      - name: ui-e2e
        if: always()
        run: $EX "node tests/app-multibiz/ui-e2e.js ../app-source/www ../out/ui-e2e.json ../out/shots-e2e"
      - name: ui-7 (mocked network)
        if: always()
        run: node tests/app-multibiz/ui-7.js ../app-source/www ../out/ui-7.json ../out/shots-7
      - name: ui-us3 + ui-us4 + ui-us5 + ui-us6 + ui-us7 + ui-br1 + ui-cf1 + ui-cf2 + ui-rec1 + ui-rec2 + ui-c3 + no-dup (unified scan, mocked network)
        if: always()
        run: node tests/app-multibiz/no-dup-functions.js ../app-source/www/index.html && node tests/app-multibiz/ui-ds-tokens.js ../app-source/www ../out/ui-ds-tokens.json ../out/shots-ds && node tests/app-multibiz/ui-ds-shell.js ../app-source/www ../out/ui-ds-shell.json ../out/shots-ds-shell && node tests/app-multibiz/ui-ds-scan.js ../app-source/www ../out/ui-ds-scan.json ../out/shots-ds-scan && node tests/app-multibiz/ui-ord-1.js ../app-source/www ../out/ui-ord-1.json ../out/shots-ord-1 && node tests/app-multibiz/ui-ord-legacy.js ../app-source/www && node tests/app-multibiz/ui-ord-cat.js ../app-source/www ../out/ui-ord-cat.json ../out/shots-ord-cat && node tests/app-multibiz/ui-ord-cust.js ../app-source/www ../out/ui-ord-cust.json ../out/shots-ord-cust && (MUTATE=card node tests/app-multibiz/ui-ord-cust.js ../app-source/www > ../out/ui-ord-cust-mutate.txt 2>&1; test $? -ne 0) && node tests/app-multibiz/ui-ord-lines.js ../app-source/www ../out/ui-ord-lines.json ../out/shots-ord-lines && CELL=off node tests/app-multibiz/ui-ord-lines.js ../app-source/www && (MUTATE=nohit node tests/app-multibiz/ui-ord-lines.js ../app-source/www > ../out/ui-ord-lines-mutate.txt 2>&1; test $? -ne 0) && node tests/app-multibiz/ui-ds-multi.js ../app-source/www ../out/ui-ds-multi.json ../out/shots-ds-multi && (MUTATE=bal node tests/app-multibiz/ui-ds-multi.js ../app-source/www > ../out/ui-ds-multi-mutate.txt 2>&1; test $? -ne 0) && node tests/app-multibiz/ui-us3.js ../app-source/www && node tests/app-multibiz/ui-us4.js ../app-source/www && node tests/app-multibiz/ui-us5.js ../app-source/www && node tests/app-multibiz/ui-us6.js ../app-source/www && node tests/app-multibiz/ui-us7.js ../app-source/www && node tests/app-multibiz/ui-br1.js ../app-source/www && node tests/app-multibiz/ui-cf1.js ../app-source/www && node tests/app-multibiz/ui-cf2.js ../app-source/www && node tests/app-multibiz/ui-rec1.js ../app-source/www && node tests/app-multibiz/ui-rec2.js ../app-source/www && node tests/app-multibiz/ui-c3.js ../app-source/www && node tests/app-multibiz/ui-sup-debt.js ../app-source/www && node tests/app-multibiz/ui-bq-queue.js ../app-source/www ../out/ui-bq-queue.json && node tests/app-multibiz/ui-inb-live.js ../app-source/www ../out/ui-inb-live.json && node tests/app-multibiz/ui-pdf1.js ../app-source/www
      - name: ui-welcome (invite welcome page, mocked network)
        if: always()
        run: node tests/app-multibiz/ui-welcome.js ../app-source/www
      - name: extra (mocked network)
        if: always()
        run: node tests/app-multibiz/extra.js ../app-source/www ../out/extra.json
      - name: scenario + compare (branch vs main)
        if: always()
        run: |
          git -C .. fetch --depth=1 origin main
          git -C .. worktree add /tmp/t/main FETCH_HEAD
          for v in legacy-old legacy-new; do
            node tests/app-multibiz/scenario-all.js ../app-source/www ../out/br-$v.json $v
            node tests/app-multibiz/scenario-all.js /tmp/t/main/app-source/www ../out/main-$v.json $v
            node tests/app-multibiz/compare.js legacy ../out/main-$v.json ../out/br-$v.json
          done
          node tests/app-multibiz/scenario-all.js ../app-source/www ../out/br-b.json b
          node tests/app-multibiz/compare.js b ../out/br-b.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: browser-results, path: out, retention-days: 7 }
