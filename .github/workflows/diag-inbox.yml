name: Diagnose worker expenses (read-only)
# קריאה בלבד: הוצאות שעובדים שלחו (inbox) ב-4 הימים האחרונים – סטטוס, צילום (chunks) והאם נוצרה חשבונית לתמחור (pinv),
# ויומן piInbox. לא כותב ולא מוחק שום דבר. שמות משתמשים מוסתרים.
on:
  push:
    branches: ["ccr-7ac71d85-oqq1vz"]
    paths: [".github/workflows/diag-inbox.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Read
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          mkdir -p "$RUNNER_TEMP/d" && cd "$RUNNER_TEMP/d" && npm i -s firebase-admin@12 >/dev/null 2>&1
          cat > d.js <<'EOF'
          const admin=require('firebase-admin');const sa=require(process.env.SA);
          admin.initializeApp({credential:admin.credential.cert(sa)});const fs=admin.firestore();
          const m=s=>{s=String(s||'');return s.slice(0,2)+'***'};
          const rqOf=f=>{let s=('pi'+String(f||'')).replace(/[^A-Za-z0-9_-]/g,'').slice(0,40);while(s.length<8)s+='0';return s};
          (async()=>{const since=Date.now()-4*864e5;
           const roots=[''];for(const r of await fs.collection('b').listDocuments())roots.push('b/'+r.id+'/');
           for(const p of roots){let q;try{q=await fs.collection(p+'inbox').where('t','>=',since).get()}catch(e){console.log(p,'ERR',e.message);continue}
            if(!q.size)continue;console.log('== root "'+p+'" docs:',q.size);
            const ad=await fs.collection(p+'admins').get();console.log('   admins:',ad.size);
            const rows=q.docs.sort((a,b)=>(a.get('t')||0)-(b.get('t')||0));
            for(const d of rows){let x={};try{x=JSON.parse(d.get('data')||'{}')}catch(e){}
             const np=+d.get('parts')||0;const c0=np?(await fs.doc(p+'chunks/'+d.id+'_0').get()).exists:false;
             const pi=await fs.doc(p+'pinv/i'+rqOf('o'+d.id)).get();
             console.log([new Date(d.get('t')).toISOString(),d.id,'st='+d.get('status'),'by='+m(d.get('by')),'amt='+x.amt,'cat='+(x.catName||''),'sub='+(x.subName||''),'reg='+(x.reg?1:0),'repl='+(x.repl?1:0),'br='+(d.get('br')||''),'parts='+np,'chunk0='+c0,'pinv='+(pi.exists?pi.get('st'):'none')].join(' | '))}}
          })().catch(e=>{console.log('FAIL',e.message);process.exit(1)});
          EOF
          SA="$RUNNER_TEMP/sa.json" node d.js
          PROJECT=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["project_id"])' "$RUNNER_TEMP/sa.json")
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          echo "== piInbox log (4 days) =="
          gcloud logging read 'resource.labels.service_name:"piinbox" AND timestamp>="'$(date -u -d '-4 days' +%Y-%m-%dT%H:%M:%SZ)'"' --project "$PROJECT" --limit 200 \
            --format='value(timestamp,resource.labels.service_name,severity,jsonPayload.message,jsonPayload.reason,jsonPayload.biz,textPayload)' | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g' | cut -c1-220
