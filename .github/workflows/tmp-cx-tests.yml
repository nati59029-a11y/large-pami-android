name: TMP caspit tests (branch only)
# זמני – רק בענף הזה, נמחק לפני המיזוג. מריץ רק את בדיקות כספית מול האמולטור (פרויקט demo, בלי סודות ובלי פרסום)
on:
  push:
    branches: ["ccr-29b75574-0j878p"]
    paths: [".github/workflows/tmp-cx-tests.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci || npm install
      - run: node scripts/ensure-emulator-secrets.js
      - run: npx firebase emulators:exec --only auth,firestore,storage,functions --project demo-largpeami "node --test --test-concurrency=1 tests/caspit-core.unit.test.js tests/caspit.test.js tests/caspit-sales.test.js tests/caspit-bot.test.js" 2>&1 | tee /tmp/l.log; s=${PIPESTATUS[0]}; grep -n -A30 "not ok" /tmp/l.log | tail -200 || true; exit $s
        shell: bash
