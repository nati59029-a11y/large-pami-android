name: Read secretary function logs (read-only)
# Reads only. Lists errors/warnings of the secretary functions (sec*) from the last 24 hours.
# Prints time, function, severity and a short masked message (emails/numbers hidden). Changes nothing.
on:
  push:
    branches: ["claude/secretary-email-server-check-sr908b", "ccr-beb89403-34diot"]
    paths: [".github/workflows/read-sec-logs.yml"]
permissions:
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Read logs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          PROJECT=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["project_id"])' "$RUNNER_TEMP/sa.json")
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          BASE='resource.type="cloud_run_revision" AND resource.labels.service_name:"sec" AND timestamp>="'$(date -u -d '-24 hours' +%Y-%m-%dT%H:%M:%SZ)'"'
          mask() { sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g; s/[0-9]{6,}/<num>/g' | cut -c1-220; }
          echo "== Requests per function (24h) =="
          gcloud logging read "$BASE AND log_id(\"run.googleapis.com/requests\")" --project "$PROJECT" --limit 2000 \
            --format='value(resource.labels.service_name,httpRequest.status)' | sort | uniq -c | sort -rn
          echo "== Errors/warnings (24h, newest first, max 60) =="
          gcloud logging read "$BASE AND severity>=WARNING" --project "$PROJECT" --limit 60 \
            --format='value(timestamp,resource.labels.service_name,severity,textPayload,jsonPayload.message,httpRequest.status)' | mask
          echo "== Invoice / attachment failures with reason (24h, max 200) =="
          gcloud logging read "$BASE AND severity>=WARNING AND (jsonPayload.message:\"invoice\" OR jsonPayload.message:\"attachment\" OR jsonPayload.message:\"hist inv\")" --project "$PROJECT" --limit 200 \
            --format='value(timestamp,resource.labels.service_name,jsonPayload.message,jsonPayload.reason,jsonPayload.g)' | mask
          echo "== Same, grouped by message and reason =="
          gcloud logging read "$BASE AND severity>=WARNING AND (jsonPayload.message:\"invoice\" OR jsonPayload.message:\"attachment\" OR jsonPayload.message:\"hist inv\")" --project "$PROJECT" --limit 2000 \
            --format='value(jsonPayload.message,jsonPayload.reason)' | sort | uniq -c | sort -rn
          echo "== OAuth callback / connect warnings+errors (72h) =="
          B72='resource.type="cloud_run_revision" AND resource.labels.service_name:"sec" AND timestamp>="'$(date -u -d '-72 hours' +%Y-%m-%dT%H:%M:%SZ)'"'
          gcloud logging read "$B72 AND severity>=WARNING AND (resource.labels.service_name:\"oauth\" OR resource.labels.service_name:\"secgoogle\")" --project "$PROJECT" --limit 40 \
            --format='value(timestamp,resource.labels.service_name,severity,jsonPayload.message,jsonPayload.reason,jsonPayload.why,textPayload,httpRequest.status)' | mask
          echo "== google-scope by hour (72h) =="
          gcloud logging read "$B72 AND jsonPayload.reason=\"google-scope\"" --project "$PROJECT" --limit 3000 \
            --format='value(timestamp,jsonPayload.message)' | cut -c1-13,28- | sort | uniq -c
          echo "== Gmail / Calendar API enabled? (read-only) =="
          gcloud services list --enabled --project "$PROJECT" --format='value(config.name)' 2>&1 | grep -Ei 'gmail|calendar|denied|error' || echo "(gmail/calendar not in enabled list)"
          echo "== Recent changes to services (audit, 72h) =="
          gcloud logging read "protoPayload.serviceName=\"serviceusage.googleapis.com\" AND timestamp>=\"$(date -u -d '-72 hours' +%Y-%m-%dT%H:%M:%SZ)\"" --project "$PROJECT" --limit 20 \
            --format='value(timestamp,protoPayload.methodName,protoPayload.resourceName)' 2>&1 | mask
          echo "== Secretary invoice activity since deploy (read-only, counts only) =="
          TOK=$(gcloud auth print-access-token)
          for ACT in histInvRetry histInv; do
            curl -sS -X POST -H "Authorization: Bearer $TOK" -H "Content-Type: application/json" \
              "https://firestore.googleapis.com/v1/projects/$PROJECT/databases/(default)/documents:runQuery" \
              -d '{"structuredQuery":{"from":[{"collectionId":"sec_log","allDescendants":true}],"where":{"fieldFilter":{"field":{"fieldPath":"act"},"op":"EQUAL","value":{"stringValue":"'$ACT'"}}},"limit":30}}' \
              | python3 -c 'import json,sys
          d=json.load(sys.stdin)
          if isinstance(d,dict): print("query error:",str(d.get("error",{}).get("message",""))[:200]); sys.exit()
          for r in d:
            f=(r.get("document") or {}).get("fields") or {}
            if f: print(sys.argv[1], f.get("note",{}).get("stringValue",""), f.get("t",{}).get("integerValue",""))' "$ACT" | sort -k3 | tail -10
          done
          echo "== Count by function and severity =="
          gcloud logging read "$BASE AND severity>=WARNING" --project "$PROJECT" --limit 1000 \
            --format='value(resource.labels.service_name,severity)' | sort | uniq -c | sort -rn
