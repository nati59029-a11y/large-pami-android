# יצירת מפתחות הצפנה אקראיים בכספת הסודות (Secret Manager) של הפרויקט – בלי שאף אחד יראה אותם.
# ידני בלבד (Actions -> "Create random secrets" -> Run workflow), ורק מ-main. אושר ע"י בעל הפרויקט 12.11.2026.
# רק שמות מרשימה סגורה של מפתחות אקראיים (לא סודות של Meta/Google – אותם מזינים ידנית).
# סוד שכבר קיים לא נדרס לעולם (החלפת SEC_SENS_KEY / SEC_GOOGLE_KEY הייתה הופכת מידע מוצפן לבלתי קריא).
# הערך נוצר ב-runner (openssl, 32 בתים, base64), עובר ישר ל-gcloud ולא מודפס ולא נשמר בקובץ.
name: Create random secrets

on:
  workflow_dispatch:
    inputs:
      names:
        description: "Secret names, separated by commas (allowed: SEC_SENS_KEY, SEC_GOOGLE_KEY)"
        required: true
        default: "SEC_SENS_KEY,SEC_GOOGLE_KEY"

permissions:
  contents: read

concurrency:
  group: create-secrets
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Only from main
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Allowed only from main"; exit 1; }
      - name: Create missing secrets (never overwrite)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NAMES: ${{ inputs.names }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          PROJECT=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["project_id"])' "$RUNNER_TEMP/sa.json")
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet >/dev/null 2>&1
          for n in $(echo "$NAMES" | tr ',' ' '); do
            case "$n" in SEC_SENS_KEY|SEC_GOOGLE_KEY) ;; *) echo "::error::Not allowed: $n"; exit 1;; esac
            if gcloud secrets describe "$n" --project "$PROJECT" >/dev/null 2>&1; then
              echo "$n: already exists – not changed" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            openssl rand -base64 32 | tr -d '\n' | gcloud secrets create "$n" --project "$PROJECT" --replication-policy=automatic --data-file=- --quiet >/dev/null
            echo "$n: created (random, 32 bytes, not shown)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
