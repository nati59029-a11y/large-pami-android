# העברת הנתונים של לארג' פעמי לעסק הראשון במבנה ריבוי העסקים (b/largpeami).
# ידני בלבד (Actions -> "Migrate largpeami data" -> Run workflow). אין push ואין schedule.
# ברירת המחדל: קריאה בלבד (גיבוי + ספירה + אימות), בלי שום כתיבה.
# מצב write (העתקה/השלמה) רק עם קלט אישור נוסף. המקור בשורש לא נמחק ולא מתעדכן לעולם.
# הוראות מלאות: firebase/migrate/README.md. חזרה: firebase/migrate/ROLLBACK.md.
# הסוד FIREBASE_SERVICE_ACCOUNT נלקח מ-secrets של GitHub בלבד. לא נכתב לקובץ במאגר.
name: Migrate largpeami data

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "מזהה הפרויקט המלא (למשל largpeami)"
        required: true
        type: string
      project_id_confirm:
        description: "הקלד שוב את מזהה הפרויקט המלא (אישור)"
        required: true
        type: string
      mode:
        description: "readonly = גיבוי, ספירה ואימות בלבד. write = העתקה/השלמה ל-b/<bizId>"
        required: true
        type: choice
        options: [readonly, write]
        default: readonly
      write_confirm:
        description: "רק למצב write: הקלד write-to-<מזהה הפרויקט>"
        required: false
        type: string
        default: ""
      allow_test_project:
        description: "אישור נפרד להרצה על פרויקט שמזהה שלו מכיל test (הקלד true)"
        required: false
        type: string
        default: ""
      biz_id:
        description: "מזהה העסק היעד"
        required: false
        type: string
        default: largpeami
      state_run_id:
        description: "להשלמה: מספר ההרצה הקודמת (run id) שממנה לקחת את קובץ המצב. ריק = העתקה ראשונה"
        required: false
        type: string
        default: ""
      upload_backup:
        description: "להעלות את קובץ הגיבוי (כל הנתונים) כ-artifact? (true/false). ברירת מחדל: לא"
        required: false
        type: string
        default: "false"

concurrency:
  group: migrate-largpeami
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      # 1. השומר – לפני כל דבר אחר, ובלי גישה לסודות
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Guard (project typed twice, read-only by default)
        env:
          MIGRATE_PROJECT: ${{ inputs.project_id }}
          MIGRATE_PROJECT_CONFIRM: ${{ inputs.project_id_confirm }}
          MIGRATE_MODE: ${{ inputs.mode }}
          MIGRATE_WRITE_CONFIRM: ${{ inputs.write_confirm }}
          MIGRATE_ALLOW_TEST_PROJECT: ${{ inputs.allow_test_project }}
        run: node firebase/migrate/guard.js
      - name: Check the business id
        env:
          BIZ: ${{ inputs.biz_id }}
        run: echo "$BIZ" | grep -Eq '^[a-z0-9-]{3,30}$' || { echo "::error::Bad biz_id"; exit 1; }

      # 2. התקנה (firebase-admin של הפונקציות; בלי תלות חדשה)
      - name: Install firebase-admin (functions dependencies)
        working-directory: firebase/functions
        run: npm ci --no-audit --no-fund

      # 3. חשבון השירות: נכתב לקובץ זמני בלבד, והשומר בודק שהוא של אותו פרויקט
      - name: Service account (temporary file) and second guard check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MIGRATE_PROJECT: ${{ inputs.project_id }}
          MIGRATE_PROJECT_CONFIRM: ${{ inputs.project_id_confirm }}
          MIGRATE_MODE: ${{ inputs.mode }}
          MIGRATE_WRITE_CONFIRM: ${{ inputs.write_confirm }}
          MIGRATE_ALLOW_TEST_PROJECT: ${{ inputs.allow_test_project }}
        run: |
          umask 077
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || { echo "::error::Missing secret FIREBASE_SERVICE_ACCOUNT"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          MIGRATE_SA_PROJECT=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["project_id"])' "$RUNNER_TEMP/sa.json") \
            node firebase/migrate/guard.js
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Storage bucket name (from the app, ST_BUCKET)
        id: bucket
        run: |
          B=$(sed -nE "s/^const ST_BUCKET='([a-z0-9._-]+)';.*/\1/p" app-source/www/index.html | head -1)
          [ -n "$B" ] || { echo "::error::ST_BUCKET not found in app-source/www/index.html"; exit 1; }
          echo "name=$B" >> "$GITHUB_OUTPUT"
          echo "Storage bucket: $B" | tee -a "$GITHUB_STEP_SUMMARY"

      # 4. קובץ המצב מההרצה הקודמת (להשלמה)
      - name: Previous state (for an incremental copy)
        if: ${{ inputs.state_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: migrate-state
          path: ${{ runner.temp }}/prev
          run-id: ${{ inputs.state_run_id }}
          github-token: ${{ github.token }}

      # 5. ההרצה
      - name: Run (backup, then dry-run or copy, then verify)
        env:
          MIGRATE_PROJECT: ${{ inputs.project_id }}
          MIGRATE_PROJECT_CONFIRM: ${{ inputs.project_id_confirm }}
          MIGRATE_MODE: ${{ inputs.mode }}
          MIGRATE_WRITE_CONFIRM: ${{ inputs.write_confirm }}
          MIGRATE_ALLOW_TEST_PROJECT: ${{ inputs.allow_test_project }}
          BIZ: ${{ inputs.biz_id }}
          BUCKET: ${{ steps.bucket.outputs.name }}
        run: |
          set -o pipefail
          O="$RUNNER_TEMP/out"; mkdir -p "$O"
          [ -f "$RUNNER_TEMP/prev/state.json" ] && cp "$RUNNER_TEMP/prev/state.json" "$O/state.json"
          T="node firebase/migrate/migrate.js --project $MIGRATE_PROJECT --biz $BIZ --bucket $BUCKET"
          $T backup --out "$O/backup.json" --report "$O/r-backup.json" | tee "$O/log.txt"
          if [ "$MIGRATE_MODE" = "write" ]; then
            $T copy --mode write --state "$O/state.json" --backup "$O/backup.json" --report "$O/r-copy.json" | tee -a "$O/log.txt"
            $T verify --report "$O/r-verify.json" | tee -a "$O/log.txt"
            $T compare-backup --backup "$O/backup.json" --report "$O/r-compare.json" | tee -a "$O/log.txt"
          else
            $T dry-run --report "$O/r-dry.json" | tee -a "$O/log.txt"
            $T verify --report "$O/r-verify.json" | tee -a "$O/log.txt" || echo "verify: differences (expected before the first copy)"
          fi
          tail -n 40 "$O/log.txt" >> "$GITHUB_STEP_SUMMARY"

      # 6. תוצאות: מצב (גיבובים בלבד, בלי נתונים) ודוחות. הגיבוב המלא רק אם ביקשו במפורש
      - name: Upload state and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrate-state
          path: |
            ${{ runner.temp }}/out/state.json
            ${{ runner.temp }}/out/r-*.json
            ${{ runner.temp }}/out/log.txt
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload the full backup (only when asked)
        if: ${{ always() && inputs.upload_backup == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: migrate-backup
          path: ${{ runner.temp }}/out/backup.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove the service account file
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
