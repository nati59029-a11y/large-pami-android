name: Caspit extension
# תוסף Chrome לסנכרון כספית (caspit-extension/). בדיקות יחידה + Playwright, ואז zip להורדה מ-Artifacts.
# Release בשם caspit-ext-v<version> – רק מ-main (דחיפה, או הפעלה ידנית עם "release"), רק לשרת prod, ולא דורס release קיים.
# לא נוגע ב-latest / test-latest / biz-* ולא באפליקציה.
on:
  push:
    paths:
      - 'caspit-extension/**'
      - 'app-source/www/caspit-core.js'
      - 'app-source/package.json'
      - 'scripts/sync-ext-core.js'
      - '.github/workflows/caspit-ext.yml'
  workflow_dispatch:
    inputs:
      backend:
        description: "prod = השרת הרגיל, test = פרויקט הבדיקות"
        type: choice
        options: ["prod", "test"]
        default: "prod"
      release:
        description: "ליצור release caspit-ext-v<version> (רק מ-main ורק prod)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.b.outputs.ver }}
      backend: ${{ steps.b.outputs.backend }}
    env:
      TMPDIR: /tmp/t
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test tools (Playwright, xlsx at the app's pinned version)
        run: |
          mkdir -p /tmp/t "$RUNNER_TEMP/tools"
          XV=$(node -p "require('./app-source/package.json').dependencies.xlsx")
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/tools" playwright@1.63.0 "xlsx@$XV"
          echo "NODE_PATH=$RUNNER_TEMP/tools/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Extension copies identical to the app (caspit-core.js, xlsx)
        run: node scripts/sync-ext-core.js --xlsx "$RUNNER_TEMP/tools/node_modules/xlsx"
      - name: Unit + Playwright tests
        run: node --test --test-concurrency=1 'caspit-extension/test/*.test.js'
      - name: Build zip
        id: b
        run: |
          BE="${{ github.event_name == 'workflow_dispatch' && inputs.backend || 'prod' }}"
          node caspit-extension/build.js --backend "$BE" --zip
          echo "ver=$(node -p "require('./caspit-extension/src/manifest.json').version")" >> "$GITHUB_OUTPUT"
          echo "backend=$BE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: caspit-extension-${{ steps.b.outputs.ver }}-${{ steps.b.outputs.backend }}
          path: caspit-extension/dist/*.zip
          retention-days: 30
  release:
    needs: test-build
    if: >-
      github.ref == 'refs/heads/main' && needs.test-build.outputs.backend == 'prod' &&
      (github.event_name == 'push' || inputs.release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: caspit-ext-release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: caspit-extension-${{ needs.test-build.outputs.ver }}-prod
      - name: Release caspit-ext-v<version> (never overwrites)
        run: |
          TAG="caspit-ext-v${{ needs.test-build.outputs.ver }}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "::notice::$TAG already exists – bump the version in caspit-extension/src/manifest.json to release"; exit 0; fi
          gh release create "$TAG" caspit-extension-*.zip --target "$GITHUB_SHA" --title "תוסף סנכרון כספית $TAG" --notes "התקנה: docs/caspit-extension-install.md"
