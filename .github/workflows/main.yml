name: Build Large Pami APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: unzip -o large-pami-android-project.zip-4 -d project

      - name: Install dependencies
        working-directory: project/android-app
        run: npm install

      - name: Prepare project
        working-directory: project/android-app
        run: node scripts/prepare.js

      - name: Add Android platform
        working-directory: project/android-app
        run: npx cap add android

      - name: Patch Android
        working-directory: project/android-app
        run: bash scripts/patch-android.sh

      - name: Sync Android
        working-directory: project/android-app
        run: npx cap sync android

      - name: Prepare debug keystore
        working-directory: project/android-app
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build Android APK
        working-directory: project/android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: large-pami-apk
          path: project/android-app/android/app/build/outputs/apk/debug/app-debug.apk
