name: Build Large Pami
# IMPORTANT: do not rename this file. versionCode = 1000 + GITHUB_RUN_NUMBER, and the run
# number belongs to this file. A new file name starts counting from 1 again, and phones
# would refuse the update.
#
# Build: on every push to any branch, and on every manual run.
# Publish to phones (GitHub release "latest"): ONLY when
#   (a) a push to main (for example, merging a branch into main), or
#   (b) a manual run from main with the "publish" box ticked (default: not ticked).
on:
  push:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build to the phones (release 'latest'). Works only when run from main."
        type: boolean
        default: false
      site_backend:
        description: "test = an APK connected to the TEST project (largpeami-test-f4691), live update OFF, never published. Not allowed from main."
        type: choice
        options: ["off", "test"]
        default: "off"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      storage_bucket: ${{ steps.bucket.outputs.name }}
    env:
      GH_REPO: ${{ github.repository }}
      # Only a manual run can ask for a test build. prepare.js ignores it on main; the step below fails it there.
      SITE_BACKEND: ${{ github.event_name == 'workflow_dispatch' && inputs.site_backend == 'test' && 'test' || '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Test build is never allowed from main
        if: env.SITE_BACKEND == 'test'
        working-directory: .
        run: |
          [ "$GITHUB_REF" != "refs/heads/main" ] || { echo "::error::site_backend=test is not allowed from main"; exit 1; }
          echo "### TEST BUILD: connected to largpeami-test-f4691, live update OFF. Not for the business phone." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check that app-source matches the project ZIP
        working-directory: .
        run: python3 scripts/verify-source-matches-zip.py large-pami-android-project.zip app-source
      - name: Copy project source
        working-directory: .
        run: |
          rm -rf app && mkdir app
          cp -a app-source/. app/
          ls app
      - name: Check signing key
        run: |
          test -f keystore/debug.keystore || { echo "::error::keystore/debug.keystore is missing from the repo"; exit 1; }
          echo "keystore sha256:" && sha256sum keystore/debug.keystore
          keytool -list -keystore keystore/debug.keystore -storepass android | tail -3
      - run: npm install
      - run: node scripts/prepare.js
      - run: npx cap add android
      - run: bash scripts/patch-android.sh
      - name: Always-increasing versionCode
        run: sed -i "s/versionCode [0-9]*/versionCode $((1000 + GITHUB_RUN_NUMBER))/" android/app/build.gradle && grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Stamp version into the app
        run: sed -i "s#__VC__#$((1000 + GITHUB_RUN_NUMBER))#; s#__REPO__#${GITHUB_REPOSITORY}#" www/index.html
      # Storage bucket name: written ONCE in the app (www/index.html, the line "const ST_BUCKET='...';").
      # If the repository variable FIREBASE_STORAGE_BUCKET is set, it replaces that default here.
      # The backup and the APK updates in the app, and the upload job below, all use this one name.
      - name: Storage bucket name (default in the app, or the variable FIREBASE_STORAGE_BUCKET)
        id: bucket
        env:
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
        run: |
          N=$(grep -c "^const ST_BUCKET='[^']*';$" www/index.html || true)
          [ "$N" = 1 ] || { echo "::error::www/index.html must have exactly one line const ST_BUCKET='...'; (found $N)"; exit 1; }
          # A test build keeps the test bucket that prepare.js wrote.
          if [ -n "$FIREBASE_STORAGE_BUCKET" ] && [ "$SITE_BACKEND" != "test" ]; then
            echo "$FIREBASE_STORAGE_BUCKET" | grep -Eq '^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$' || { echo "::error::FIREBASE_STORAGE_BUCKET is not a valid bucket name (a-z, 0-9, . _ -)"; exit 1; }
            sed -i "s#^const ST_BUCKET='[^']*';\$#const ST_BUCKET='$FIREBASE_STORAGE_BUCKET';#" www/index.html
          fi
          B=$(sed -n "s#^const ST_BUCKET='\([^']*\)';\$#\1#p" www/index.html)
          echo "Storage bucket in this APK: $B" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "name=$B" >> "$GITHUB_OUTPUT"
      - run: npx cap sync android
      # Live update (stage 6): the app gets the PUBLIC key and the manifest address only if the
      # secret LIVE_UPDATE_SIGNING_KEY and the variable LIVE_UPDATE_SITE exist. Otherwise nothing
      # is added, and live update stays off in this APK (the app works like before).
      - name: Live update settings in the app (only if the secret and the site are set)
        env:
          LIVE_UPDATE_SIGNING_KEY: ${{ secrets.LIVE_UPDATE_SIGNING_KEY }}
          LIVE_UPDATE_SITE: ${{ vars.LIVE_UPDATE_SITE }}
        run: |
          if [ "$SITE_BACKEND" = "test" ]; then
            echo "::notice::Live update is OFF in this APK: test build."
            exit 0
          fi
          if [ -z "$LIVE_UPDATE_SIGNING_KEY" ] || [ -z "$LIVE_UPDATE_SITE" ]; then
            echo "::notice::Live update is OFF in this APK: secret LIVE_UPDATE_SIGNING_KEY or variable LIVE_UPDATE_SITE is not set."
            exit 0
          fi
          echo "$LIVE_UPDATE_SITE" | grep -Eq '^[a-z0-9-]+$' || { echo "::error::LIVE_UPDATE_SITE must be a Firebase Hosting site name (a-z, 0-9, -)"; exit 1; }
          umask 077
          printf '%s\n' "$LIVE_UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/lu-key.pem"
          openssl pkey -in "$RUNNER_TEMP/lu-key.pem" -pubout -out "$RUNNER_TEMP/lu-pub.pem"
          rm -f "$RUNNER_TEMP/lu-key.pem"
          python3 ../scripts/live-update.py config --pub "$RUNNER_TEMP/lu-pub.pem" \
            --url "https://$LIVE_UPDATE_SITE.web.app/app-updates/manifest.json" \
            --native-id "$(python3 ../scripts/live-update.py native-id ../app-source)" \
            --out android/app/src/main/assets/live-update.properties
      - name: Use the fixed signing key
        run: mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      # Key rotation (APK Signature Scheme v3). Runs ONLY if the secrets exist.
      # Without them the APK stays exactly as Gradle signed it (old key, like today).
      - name: Key rotation signing (only if the secrets are set)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SIGNING_LINEAGE_B64: ${{ secrets.SIGNING_LINEAGE_B64 }}
        run: bash ../scripts/sign-with-rotation.sh android/app/build/outputs/apk/debug/app-debug.apk keystore/debug.keystore
      - name: Show signature and version of the built APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          { echo "### APK signature"; keytool -printcert -jarfile $APK | grep -E "Owner|SHA256"; } | tee -a $GITHUB_STEP_SUMMARY
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | tail -1)aapt2
          $AAPT dump badging $APK | grep -E "^package:" | tee -a $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with: { name: large-pami-apk, path: app/android/app/build/outputs/apk/debug/app-debug.apk }
      # Live update bundle: the same screens that are inside this APK (assets/public), with the same
      # version number. Built on every run (to check it), NOT signed here. Kept only when publishing.
      - name: Live update bundle (built every run; signed and uploaded only from main)
        run: |
          python3 ../scripts/live-update.py bundle --www android/app/src/main/assets/public \
            --version $((1000 + GITHUB_RUN_NUMBER)) \
            --native-id "$(python3 ../scripts/live-update.py native-id ../app-source)" \
            --out ../live-update-out
      - uses: actions/upload-artifact@v4
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' &&
            (inputs.publish == true || inputs.publish == 'true')))
        with: { name: live-update-bundle, path: live-update-out, retention-days: 7 }

  publish:
    needs: build
    # Publish only from main: a push to main, or a manual run from main with "publish" ticked.
    # The input is compared both as a boolean and as a string, so it works either way.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.publish == true || inputs.publish == 'true')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: large-pami-apk, path: apk }
      - name: Publish release for in-app updates
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          VC=$((1000 + GITHUB_RUN_NUMBER))
          cp apk/app-debug.apk large-pami.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest large-pami.apk --title "latest" --notes "versionCode: $VC"

  # APK updates from Firebase Storage (app_releases/latest/), for signed-in staff only (storage.rules).
  # Its own job, next to publish: if this upload fails, the GitHub release is not affected.
  # Runs the upload ONLY on main (push, or a manual run with "publish" - the same condition as publish),
  # and only if the secret FIREBASE_SERVICE_ACCOUNT and the variable FIREBASE_STORAGE_BUCKET exist.
  # In every other case it writes "skipped (דולג)" with the reason.
  apk-storage:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: apk-storage
      cancel-in-progress: false
    steps:
      - name: Upload the APK to Firebase Storage? (main only, with the secret and the variable)
        id: chk
        env:
          FROM_MAIN: >-
            ${{ github.ref == 'refs/heads/main' &&
            (github.event_name == 'push' ||
             (github.event_name == 'workflow_dispatch' &&
              (inputs.publish == true || inputs.publish == 'true'))) }}
          HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
          HAS_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET != '' }}
        run: |
          WHY=""
          [ "$FROM_MAIN" = "true" ] || WHY="not a publish from main"
          [ -n "$WHY" ] || [ "$HAS_SA" = "true" ] || WHY="secret FIREBASE_SERVICE_ACCOUNT is not set"
          [ -n "$WHY" ] || [ "$HAS_BUCKET" = "true" ] || WHY="variable FIREBASE_STORAGE_BUCKET is not set"
          if [ -n "$WHY" ]; then
            MSG="APK upload to Firebase Storage skipped (דולג): $WHY."
            echo "::notice::$MSG"; echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.go == 'yes'
      - uses: actions/download-artifact@v4
        if: steps.chk.outputs.go == 'yes'
        with: { name: large-pami-apk, path: apk }
      - name: Upload the APK and its version file to Storage (app_releases/latest/)
        if: steps.chk.outputs.go == 'yes'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BUCKET: ${{ needs.build.outputs.storage_bucket }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          python3 scripts/upload-apk-to-storage.py --apk apk/app-debug.apk \
            --version-code $((1000 + GITHUB_RUN_NUMBER)) --bucket "$BUCKET" \
            --sa "$RUNNER_TEMP/sa.json" --summary "$GITHUB_STEP_SUMMARY"

  # Live update (stage 6): sign the bundle and upload it to Firebase Hosting. Same condition as
  # publish (main only), and only after the APK release succeeded. Without the secrets: skipped.
  live-update:
    needs: [build, publish]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.publish == true || inputs.publish == 'true')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: live-update
      cancel-in-progress: false
    steps:
      - name: Check the live update secrets
        id: chk
        env:
          HAS_KEY: ${{ secrets.LIVE_UPDATE_SIGNING_KEY != '' }}
          HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
          LIVE_UPDATE_SITE: ${{ vars.LIVE_UPDATE_SITE }}
        run: |
          if [ "$HAS_KEY" != "true" ] || [ "$HAS_SA" != "true" ] || [ -z "$LIVE_UPDATE_SITE" ]; then
            MSG="Live update upload skipped (דולג): needs secret LIVE_UPDATE_SIGNING_KEY, secret FIREBASE_SERVICE_ACCOUNT and variable LIVE_UPDATE_SITE."
            echo "::notice::$MSG"; echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.go == 'yes'
      - uses: actions/download-artifact@v4
        if: steps.chk.outputs.go == 'yes'
        with: { name: live-update-bundle, path: lu }
      - name: Sign the bundle and check it like the app does
        if: steps.chk.outputs.go == 'yes'
        env:
          LIVE_UPDATE_SIGNING_KEY: ${{ secrets.LIVE_UPDATE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$LIVE_UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/lu-key.pem"
          openssl pkey -in "$RUNNER_TEMP/lu-key.pem" -pubout -out "$RUNNER_TEMP/lu-pub.pem"
          python3 scripts/live-update.py sign --payload lu/payload.txt --key "$RUNNER_TEMP/lu-key.pem" --out lu/public/app-updates/manifest.json
          rm -f "$RUNNER_TEMP/lu-key.pem"
          python3 scripts/live-update.py verify --manifest lu/public/app-updates/manifest.json --pub "$RUNNER_TEMP/lu-pub.pem" --root lu/public/app-updates
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.go == 'yes'
        with: { node-version: 20 }
      - name: Upload to Firebase Hosting (its own site, only app-updates/)
        if: steps.chk.outputs.go == 'yes'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LIVE_UPDATE_SITE: ${{ vars.LIVE_UPDATE_SITE }}
        run: |
          umask 077
          echo "$LIVE_UPDATE_SITE" | grep -Eq '^[a-z0-9-]+$' || { echo "::error::bad LIVE_UPDATE_SITE"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          PROJECT=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["project_id"])' "$RUNNER_TEMP/sa.json")
          cd lu
          printf '{"hosting":{"site":"%s","public":"public","headers":[{"source":"/app-updates/manifest.json","headers":[{"key":"Cache-Control","value":"no-cache, max-age=0"}]}]}}\n' "$LIVE_UPDATE_SITE" > firebase.json
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@15.34.1 deploy --only hosting --project "$PROJECT" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
          echo "Live update bundle $((1000 + GITHUB_RUN_NUMBER)) uploaded to https://$LIVE_UPDATE_SITE.web.app/app-updates/manifest.json" >> "$GITHUB_STEP_SUMMARY"
