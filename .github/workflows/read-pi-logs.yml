name: PI gap check (one-off)
on:
  push:
    branches: ["fix/read-piinbox-logs"]
    paths: [".github/workflows/read-pi-logs.yml", "scripts/ops/pi-gap.js"]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MODE: check
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          export SA="$RUNNER_TEMP/sa.json" GCLOUD_PROJECT=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["project_id"])' "$SA")
          (cd firebase/functions && npm ci --silent)
          node scripts/ops/pi-gap.js firebase/functions
