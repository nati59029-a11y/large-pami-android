name: Diagnose scan log (read-only)
# קריאה בלבד: יומן scanDocument / piCreate / piImg ב-4 השעות האחרונות, ומצב pinv של הוצאת סופר קייק. לא משנה כלום.
on:
  push:
    branches: ["ccr-7ac71d85-oqq1vz"]
    paths: [".github/workflows/diag-scanlog.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Read
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          PROJECT=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["project_id"])' "$RUNNER_TEMP/sa.json")
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          SINCE=$(date -u -d '-2 hours' +%Y-%m-%dT%H:%M:%SZ)
          mask() { sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<email>/g; s/[0-9]{9,}/<num>/g' | cut -c1-230; }
          echo "== requests (scandocument / picreate / piimg), 4h =="
          gcloud logging read "resource.type=\"cloud_run_revision\" AND (resource.labels.service_name:\"scandocument\" OR resource.labels.service_name:\"picreate\" OR resource.labels.service_name:\"piimg\") AND log_id(\"run.googleapis.com/requests\") AND timestamp>=\"$SINCE\"" --project "$PROJECT" --limit 200 \
            --format='value(timestamp,resource.labels.service_name,httpRequest.status,httpRequest.latency)' | mask
          echo "== warnings/errors, 4h =="
          gcloud logging read "resource.type=\"cloud_run_revision\" AND (resource.labels.service_name:\"scandocument\" OR resource.labels.service_name:\"picreate\" OR resource.labels.service_name:\"piimg\") AND severity>=WARNING AND timestamp>=\"$SINCE\"" --project "$PROJECT" --limit 100 \
            --format='value(timestamp,resource.labels.service_name,severity,jsonPayload.message,jsonPayload.reason,jsonPayload.kind,textPayload)' | mask
          echo "== info with kind, 4h =="
          gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name:\"scandocument\" AND jsonPayload.kind:* AND timestamp>=\"$SINCE\"" --project "$PROJECT" --limit 60 \
            --format='value(timestamp,severity,jsonPayload.message,jsonPayload.kind,jsonPayload.reason,jsonPayload.files,jsonPayload.ms)' | mask
          echo "== one full warning entry (json) =="
          gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name:\"scandocument\" AND severity>=WARNING AND timestamp>=\"$SINCE\"" --project "$PROJECT" --limit 2 --format=json | grep -vE '"(insertId|trace|spanId)"' | mask | head -80
          mkdir -p "$RUNNER_TEMP/d" && cd "$RUNNER_TEMP/d" && npm i -s firebase-admin@12 >/dev/null 2>&1
          cat > d.js <<'JS'
          const admin=require('firebase-admin');admin.initializeApp({credential:admin.credential.cert(require(process.env.SA))});const fs=admin.firestore();
          (async()=>{const id='w8s4v5c57cm';let s=('pio'+id).slice(0,40);while(s.length<8)s+='0';
           for(const p of ['','b/largpeami/']){const d=await fs.doc(p+'pinv/i'+s).get();console.log('pinv',p||'(root)',d.exists?JSON.stringify({st:d.get('st'),n:d.get('n'),np:d.get('np'),src:d.get('src'),at:d.get('at')}):'none');
            const u=await fs.collection(p+'scan_usage').get();for(const x of u.docs){const ad=(await fs.doc(p+'admins/'+x.id).get()).exists,st=await fs.doc(p+'staff/'+x.id).get();console.log('usage',p||'(root)',x.id.slice(0,3)+'***',JSON.stringify(x.data()),'admin='+ad,'staff='+st.exists,'byStart='+String(st.exists&&st.get('name')||'').slice(0,1))}}
           const b=await fs.doc('b/largpeami').get();console.log('biz scan caps',JSON.stringify(b.exists?{scanCap:b.get('scanCap'),scan:b.get('scan'),limits:b.get('limits')}:null));})();
          JS
          SA="$RUNNER_TEMP/sa.json" node d.js
