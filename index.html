<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לארג’ פעמי – ניהול כספים</title>

<style>
:root{--bg:#eef2f3;--card:#fff;--ink:#1c2a2d;--mut:#62767a;--line:#d9e2e4;--pri:#0f5c5a;--pri2:#e1f0ef;--acc:#c8921b;--ok:#23704a;--okb:#dff3e8;--bad:#b3412f;--badb:#fbe6e1;--warn:#8a5a00;--warnb:#fdf0d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10191b;--card:#182427;--ink:#e6eeef;--mut:#93a8ac;--line:#2a3b3f;--pri:#4fb8b2;--pri2:#1b3436;--acc:#e0ac3a;--ok:#5fcf93;--okb:#173a2a;--bad:#f08a76;--badb:#3d211b;--warn:#f0c264;--warnb:#3a2f12;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;font-size:15px;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pri);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:18px;font-weight:800;margin:0;flex:1;white-space:nowrap}
header input,header button{font:inherit;border-radius:8px;border:0;padding:7px 10px}
header input{background:#fff;color:#1c2a2d}
header button{background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
nav{overflow-x:auto;position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav button{flex:1 0 62px;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;padding:9px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:19px}
nav button.on{color:var(--pri);font-weight:700;background:var(--pri2)}
main{max-width:1000px;margin:0 auto;padding:14px}
h2{font-size:20px;margin:6px 0 12px}h3{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;border-inline-start:5px solid var(--pri)}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:21px;font-weight:800}
.kpi.in{border-color:var(--ok)}.kpi.out{border-color:var(--bad)}.kpi.ac{border-color:var(--acc)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:13px}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
input,select,textarea{font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.btn{font:inherit;border:0;border-radius:8px;padding:9px 15px;background:var(--pri);color:#fff;cursor:pointer;font-weight:500}
.btn.s{padding:5px 10px;font-size:13px}.btn.g{background:var(--pri2);color:var(--pri)}.btn.r{background:var(--badb);color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.t1{background:var(--warnb);color:var(--warn)}.t2{background:var(--pri2);color:var(--pri)}.t3{background:var(--okb);color:var(--ok)}.t4{background:var(--badb);color:var(--bad)}
.calc{background:var(--pri2);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--pri)}
.bar{height:8px;background:var(--line);border-radius:4px;min-width:60px}.bar i{display:block;height:100%;border-radius:4px;background:var(--pri)}
.empty{color:var(--mut);text-align:center;padding:18px}
.sup{cursor:pointer}.sup:hover{border-color:var(--pri)}
dialog{border:0;border-radius:14px;padding:18px;width:min(440px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.toast{position:fixed;bottom:96px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:40}
.note{font-size:13px;color:var(--mut);line-height:1.6}
@media(min-width:760px){body{padding-bottom:20px}nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}nav button{flex-direction:row;justify-content:center;gap:6px;font-size:14px}}
.up{position:relative;overflow:hidden;flex-direction:row}.up input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0;padding:0;border:0}
.stp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.stp span{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--mut)}.stp span.on{background:var(--pri);color:#fff}
td input{min-width:90px;padding:5px}tr.bad td{background:var(--badb)}tr.wr td{background:var(--warnb)}
</style>
<script src="xlsx.full.min.js"></script>
</head>
<body>
<header><h1>לארג’ פעמי</h1><input type="month" id="mon" aria-label="חודש ושנה"><button data-a="settings" aria-label="נתונים והגדרות">⚙ נתונים</button></header>
<nav id="nav"></nav>
<main id="main"></main>
<dialog id="dlg"></dialog>
<script>
const IC=['מזומן נחל לכיש','אשראי נחל לכיש','הקפה נחל לכיש','מזומן יהודה הנשיא','אשראי יהודה הנשיא','צ’קים','העברה','זיכוי ספקים','שונות'];
const EC=['ספקים','ספקים אפייה','משכורות','משכורות אפייה','הוצאות קבועות','אשראי','הלוואות','שונות'];
const TABS=[['dash','📊','ראשי'],['cats','🗂','קטגוריות'],['inc','💰','הכנסות'],['exp','🧾','הוצאות'],['sup','🏭','ספקים'],['pay','📅','תשלומים'],['rep','📈','דוחות'],['scan','📷','סריקה'],['imp','📥','ייבוא'],['cmp','⚖','השוואות']];
const KEY='large-pami-v1';
let S={sup:[],inc:[],exp:[]},view='dash',edit=null,selSup=null,showAll=false,pending=null;
const $=s=>document.querySelector(s);
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const today=()=>{const d=new Date();return ym(d)+'-'+String(d.getDate()).padStart(2,'0')};
let month=ym(new Date());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:2});
const ils=n=>nf.format(n||0);
const num=v=>parseFloat(v)||0;
const uid=()=>Math.random().toString(36).slice(2,9);
const dfmt=d=>d?d.split('-').reverse().join('/'):'';
const mfmt=m=>{const[y,mm]=m.split('-');return['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'][mm-1]+' '+y};
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const paid=e=>sum(e.pays,p=>p.a);
const bal=e=>Math.max(0,Math.round((e.amt-paid(e))*100)/100);
const st=e=>paid(e)>=e.amt-0.004?3:paid(e)>0?2:1;
const STN={1:'ממתין לתשלום',2:'שולם חלקית',3:'שולם במלואו'};
const tag=e=>e.kind==='credit'?'<span class="tag t2">זיכוי</span>':e.kind==='refund'?'<span class="tag t2">החזר כספי</span>':`<span class="tag t${st(e)}">${STN[st(e)]}</span>`;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);return true}}catch(e){}return false}
function sample(){
  const d=new Date(),m0=ym(d),m1=ym(new Date(d.getFullYear(),d.getMonth()-1,1)),m2=ym(new Date(d.getFullYear(),d.getMonth()+1,1));
  const D=(m,x)=>m+'-'+String(x).padStart(2,'0');
  S={sup:[
    {name:'מילס קמח',cat:'ספקים אפייה'},{name:'חלב וביצים הצפון',cat:'ספקים אפייה'},{name:'אריזות פלוס',cat:'ספקים'},
    {name:'חברת חשמל',cat:'הוצאות קבועות'},{name:'משכורות נחל לכיש',cat:'משכורות'}],
  inc:[
    [D(m0,2),'קופה בוקר','מזומן נחל לכיש',4200],[D(m0,2),'סליקה יומית','אשראי נחל לכיש',6800],[D(m0,5),'מכירות קפה','הקפה נחל לכיש',1900],
    [D(m0,6),'קופה','מזומן יהודה הנשיא',3500],[D(m0,6),'סליקה','אשראי יהודה הנשיא',5200],[D(m0,9),'צ’ק מלקוח עסקי','צ’קים',2400],
    [D(m1,10),'קופה חודשית','מזומן נחל לכיש',21000],[D(m1,12),'סליקה חודשית','אשראי יהודה הנשיא',18500],[D(m1,20),'זיכוי מספק','זיכוי ספקים',350]
  ].map(x=>({id:uid(),date:x[0],desc:x[1],cat:x[2],amt:x[3],notes:''})),
  exp:[
    [D(m0,1),'מילס קמח','קמח 40 שק','ספקים אפייה',9600,m0,[[D(m0,3),4000]]],
    [D(m0,4),'חלב וביצים הצפון','מחצבי חלב וביצים','ספקים אפייה',3200,m0,[[D(m0,8),3200]]],
    [D(m0,7),'אריזות פלוס','קופסאות וניילון','ספקים',1450,m2,[]],
    [D(m0,3),'חברת חשמל','חשבון חשמל','הוצאות קבועות',2300,m0,[]],
    [D(m0,10),'משכורות נחל לכיש','שכר עובדים','משכורות',14500,m2,[]],
    [D(m1,15),'מילס קמח','קמח 30 שק','ספקים אפייה',7200,m1,[[D(m1,25),5000]]]
  ].map(x=>({id:uid(),date:x[0],sup:x[1],desc:x[2],cat:x[3],amt:x[4],plan:x[5],notes:'',pays:x[6].map(p=>({id:uid(),d:p[0],a:p[1]}))}))};
  save();
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
function dlg(h){const d=$('#dlg');d.innerHTML=h;if(!d.open)d.showModal()}
function closeDlg(){$('#dlg').close()}
function ask(msg,fn){pending=fn;dlg(`<p>${esc(msg)}</p><div class="row"><button class="btn r" data-a="yes">כן, המשך</button><button class="btn g" data-a="close">ביטול</button></div>`)}
const opts=(l,v)=>l.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('');
const inM=(d)=>d&&d.startsWith(month);
const inY=(d)=>d&&d.startsWith(month.slice(0,4));

/* ---------- views ---------- */
function dash(){
  const inc=sum(S.inc.filter(x=>inM(x.date)),x=>x.amt),out=sum(S.exp.filter(x=>inM(x.date)),x=>x.amt);
  const pl=S.exp.filter(x=>x.plan===month&&(x.kind||'inv')==='inv'),due=sum(pl,x=>x.amt),pd=sum(pl,paid),op=sum(pl,bal);
  const up=S.exp.filter(x=>bal(x)>0&&x.plan<=month).sort((a,b)=>a.plan.localeCompare(b.plan)||a.date.localeCompare(b.date)).slice(0,8);
  return `<h2>סיכום ${mfmt(month)}</h2><div class="grid">
  <div class="kpi in"><small>הכנסות</small><b>${ils(inc)}</b></div>
  <div class="kpi out"><small>הוצאות (לפי חשבוניות)</small><b>${ils(out)}</b></div>
  <div class="kpi"><small>הפרש</small><b class="${inc-out>=0?'pos':'neg'}">${ils(inc-out)}</b></div>
  <div class="kpi ac"><small>לתשלום החודש</small><b>${ils(due)}</b></div>
  <div class="kpi in"><small>שולם</small><b>${ils(pd)}</b></div>
  <div class="kpi out"><small>נותר פתוח</small><b>${ils(op)}</b></div></div>
  <div class="card"><h3>תשלומים קרובים</h3>${up.length?`<div class="tw"><table><tr><th>ספק</th><th>חודש תשלום</th><th class="n">יתרה</th><th></th></tr>${up.map(e=>`<tr><td>${esc(e.sup||e.desc)}</td><td>${mfmt(e.plan)}${e.plan<month?' <span class="tag t4">באיחור</span>':''}</td><td class="n">${ils(bal(e))}</td><td><button class="btn s" data-a="pay" data-id="${e.id}">סמן תשלום</button></td></tr>`).join('')}</table></div>`:'<div class="empty">אין תשלומים פתוחים 🎉</div>'}</div>`;
}
function incView(){
  const e=edit&&edit.t==='inc'?S.inc.find(x=>x.id===edit.id):null;
  const list=S.inc.filter(x=>showAll||inM(x.date)).sort((a,b)=>b.date.localeCompare(a.date));
  return `<h2>הכנסות</h2><div class="card"><h3>${e?'עריכת הכנסה':'הוספת הכנסה'}</h3><form id="fi"><div class="f">
  <label>תאריך<input type="date" name="date" required value="${e?e.date:today()}"></label>
  <label>תיאור<input name="desc" required value="${esc(e?.desc)}"></label>
  <label>קטגוריה<select name="cat">${opts(IC,e?.cat)}</select></label>
  <label>סכום (₪)<input type="number" step="0.01" min="0" name="amt" required value="${e?e.amt:''}"></label>
  <label>הערות<input name="notes" value="${esc(e?.notes)}"></label></div>
  <div class="row"><button class="btn">${e?'שמור שינויים':'הוסף הכנסה'}</button>${e?'<button type="button" class="btn g" data-a="cancel">ביטול</button>':''}</div></form></div>
  <div class="card"><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" style="width:auto" data-a="all" ${showAll?'checked':''}> הצג את כל החודשים</label>
  <div class="tw"><table><tr><th>תאריך</th><th>תיאור</th><th>קטגוריה</th><th class="n">סכום</th><th>הערות</th><th></th></tr>
  ${list.map(x=>`<tr><td>${dfmt(x.date)}</td><td>${esc(x.desc)}</td><td>${esc(x.cat)}</td><td class="n">${ils(x.amt)}</td><td>${esc(x.notes)}</td><td><button class="btn s g" data-a="eInc" data-id="${x.id}">עריכה</button> <button class="btn s r" data-a="dInc" data-id="${x.id}">מחיקה</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">אין הכנסות לחודש זה</td></tr>'}
  </table></div>${list.length?`<p><b>סה״כ: ${ils(sum(list,x=>x.amt))}</b></p>`:''}</div>`;
}
function expView(){
  const e=edit&&edit.t==='exp'?S.exp.find(x=>x.id===edit.id):null;
  const sn=S.sup.map(s=>s.name);
  const list=S.exp.filter(x=>showAll||inM(x.date)).sort((a,b)=>b.date.localeCompare(a.date));
  return `<h2>הוצאות</h2><div class="card"><h3>${e?'עריכת הוצאה':'הוספת הוצאה'}</h3><form id="fe"><div class="f">
  <label>תאריך החשבונית<input type="date" name="date" required value="${e?e.date:today()}"></label>
  <label id="supLbl">ספק<select name="sup" id="supSel" data-v="${esc(e?.sup||'')}"></select></label><label id="empLbl" style="display:none">עובד (לא חובה)<input name="emp" value="${esc(e?.emp)}"></label>
  <label id="nsw" style="display:none">שם הספק החדש<input name="newSup"></label>
  <label>תיאור ההוצאה<input name="desc" required value="${esc(e?.desc)}"></label>
  <label>קטגוריית הוצאה<select name="cat" id="catSel">${opts(EC,e?.cat||PRE)}</select></label>
  <label>סוג תנועה<select name="kind">${[['inv','חשבונית ספק'],['credit','חשבונית זיכוי'],['refund','החזר כספי שהתקבל']].map(([k,l])=>`<option value="${k}"${(e?.kind||'inv')===k?' selected':''}>${l}</option>`).join('')}</select></label><label>סכום (₪) – בזיכוי/החזר הזן סכום חיובי<input type="number" step="0.01" name="amt" required value="${e?(e.kind==='refund'?e.ref:Math.abs(e.amt)):''}"></label>
  <label>חודש תשלום מתוכנן<input type="month" name="plan" required value="${e?e.plan:month}"></label>
  <label>סכום ששולם (₪)<input type="number" step="0.01" min="0" name="paid" ${e?'readonly':''} value="${e?paid(e):0}"></label></div>
  <label style="margin-top:10px">הערות<input name="notes" value="${esc(e?.notes)}"></label>
  <div class="row"><span class="calc" id="calc"></span></div>
  ${e?'<p class="note">תשלומים בהוצאה קיימת מנוהלים במסך “תשלומים” או בכרטיס הספק.</p>':''}
  <div class="row"><button class="btn">${e?'שמור שינויים':'הוסף הוצאה'}</button>${e?'<button type="button" class="btn g" data-a="cancel">ביטול</button>':''}</div></form></div>
  <div class="card"><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" style="width:auto" data-a="all" ${showAll?'checked':''}> הצג את כל החודשים</label>
  <div class="tw"><table><tr><th>תאריך</th><th>ספק</th><th>תיאור</th><th>קטגוריה</th><th class="n">סכום</th><th class="n">שולם</th><th class="n">יתרה</th><th>תשלום ב־</th><th>סטטוס</th><th></th></tr>
  ${list.map(x=>`<tr><td>${dfmt(x.date)}</td><td>${esc(x.sup)}</td><td>${esc(x.desc)}</td><td>${esc(x.cat)}</td><td class="n">${ils(x.amt)}</td><td class="n">${ils(paid(x))}</td><td class="n">${ils(bal(x))}</td><td>${mfmt(x.plan)}</td><td>${tag(x)}</td><td>${x.file?`<button class="btn s g" data-b="vf" data-id="${x.file}">קובץ</button> `:''}<button class="btn s g" data-a="eExp" data-id="${x.id}">עריכה</button> <button class="btn s r" data-a="dExp" data-id="${x.id}">מחיקה</button></td></tr>`).join('')||'<tr><td colspan="10" class="empty">אין הוצאות לחודש זה</td></tr>'}
  </table></div></div>`;
}
function supView(){
  if(selSup){
    const s=S.sup.find(x=>x.name===selSup);if(!s){selSup=null;return supView()}
    const ex=S.exp.filter(x=>x.sup===s.name).sort((a,b)=>b.date.localeCompare(a.date));
    const pays=ex.flatMap(x=>x.pays.map(p=>({...p,inv:x}))).sort((a,b)=>b.d.localeCompare(a.d));
    return `<div class="row" style="margin:0 0 8px"><button class="btn g s" data-a="back">‹ כל הספקים</button></div><h2>${esc(s.name)}</h2>
    <div class="card"><label style="max-width:260px">קטגוריה<select data-a="supCat">${opts(EC,s.cat)}</select></label></div>
    <div class="grid"><div class="kpi"><small>סה״כ חשבוניות</small><b>${ils(sum(ex,x=>x.amt))}</b></div><div class="kpi in"><small>שולם</small><b>${ils(sum(ex,paid))}</b></div><div class="kpi out"><small>${ledger(s.name).close<0?'יתרת זכות לעסק':'יתרת חוב (כרטסת)'}</small><b>${ils(Math.abs(ledger(s.name).close))}</b></div></div>

const s_=v=>String(v??'').trim(),p2=n=>String(n).padStart(2,'0');
function mk(y,mo,d){y=+y;mo=+mo;d=+d;const t=new Date(Date.UTC(y,mo-1,d));return t.getUTCFullYear()===y&&t.getUTCMonth()===mo-1&&t.getUTCDate()===d?y+'-'+p2(mo)+'-'+p2(d):null}
function pDate(v){if(v===''||v==null)return null;if(typeof v==='number')return v<20000||v>80000?null:new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);const s=s_(v);let m;if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))return mk(m[1],m[2],m[3]);if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/)){let y=+m[3];if(y<100)y+=2000;return mk(y,m[2],m[1])}return null}
function pMonth(v){const s=s_(v);let m;if(m=s.match(/^(\d{1,2})[\/.-](\d{4})$/))return +m[1]>=1&&+m[1]<=12?m[2]+'-'+p2(m[1]):null;if(m=s.match(/^(\d{4})-(\d{2})$/))return +m[2]>=1&&+m[2]<=12?s:null;const d=pDate(v);return d?d.slice(0,7):null}
function pNum(v){if(typeof v==='number')return v;let s=s_(v).replace(/[₪\s]|ש"ח|שח/g,'');if(!s)return null;let neg=/^\(.*\)$/.test(s);s=s.replace(/[()]/g,'');const c=s.lastIndexOf(','),d=s.lastIndexOf('.');if(c>-1&&d>-1)s=c>d?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else if(c>-1)s=/,\d{1,2}$/.test(s)?s.replace(',','.'):s.replace(/,/g,'');if(!/^-?\d+(\.\d+)?$/.test(s))return null;return neg?-parseFloat(s):parseFloat(s)}
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('lp-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function fput(id,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function fget(id){const d=await idb();return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const rd=f=>new Promise(r=>{const a=new FileReader();a.onload=()=>r(a.result);a.readAsDataURL(f)});
async function shrinkDU(f){const u=await rd(f);return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85))};i.onerror=()=>r(u);i.src=u})}
const du2b=u=>{const[h,b]=u.split(','),bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.match(/:(.*?);/)[1]})};

const rows=cvRows(),all=CV.cat==='ALL',sups=!all&&SUPC.includes(CV.cat)?S.sup.filter(s=>s.cat===CV.cat):[];
return `<div class="row" style="margin:0 0 8px"><button class="btn g s" data-b="cback">‹ כל הקטגוריות</button></div><h2>${all?'כל העסק':esc(CV.cat)}</h2><div class="card"><div class="f"><label>קטגוריה<select data-c="cv" data-k="cat"><option value="ALL"${all?' selected':''}>כל העסק</option>${opts(EC,CV.cat)}</select></label><label>מתאריך<input type="date" data-c="cv" data-k="from" value="${f}"></label><label>עד תאריך<input type="date" data-c="cv" data-k="to" value="${t}"></label><label>סוג תנועה<select data-c="cv" data-k="kind">${[['','הכול'],['inv','חשבוניות/הוצאות'],['credit','זיכויים'],['refund','החזרים']].map(([k,l])=>`<option value="${k}"${CV.kind===k?' selected':''}>${l}</option>`).join('')}</select></label><label>חיפוש<input data-c="cv" data-k="q" value="${esc(CV.q)}" placeholder="ספק, תיאור, עובד, חשבונית"></label></div><div class="row"><button class="btn" data-b="cadd">+ הוספת תנועה</button><button class="btn g" data-b="cvcsv">ייצוא CSV</button></div></div>
<div class="grid"><div class="kpi out"><small>סה״כ נטו (${rows.length} תנועות)</small><b>${ils(sum(rows,x=>x.amt))}</b></div><div class="kpi in"><small>שולם</small><b>${ils(sum(rows,paid))}</b></div><div class="kpi ac"><small>פתוח לתשלום</small><b>${ils(sum(rows,bal))}</b></div></div>
${sups.length?`<div class="card"><h3>ספקים בקטגוריה</h3><div class="tw"><table><tr><th>ספק</th><th class="n">יתרה (כרטסת)</th><th></th></tr>${sups.map(s=>`<tr><td>${esc(s.name)}</td><td class="n">${ils(ledger(s.name).close)}</td><td><button class="btn s g" data-b="os" data-n="${esc(s.name)}">כרטסת</button></td></tr>`).join('')}</table></div></div>`:''}
${all?gtab('לפי קטגוריה',grp(rows,x=>x.cat)):''}${SALC.includes(CV.cat)?gtab('לפי עובד',grp(rows,x=>x.emp)):''}${['הוצאות קבועות','אשראי','הלוואות'].includes(CV.cat)?gtab('לפי פריט',grp(rows,x=>x.desc)):''}${gtab('לפי חודש',grp(rows,x=>x.date.slice(0,7)).sort())}
<div class="card"><h3>תנועות</h3><div class="tw"><table><tr><th>תאריך</th><th>עברי</th>${all?'<th>קטגוריה</th>':''}<th>ספק/עובד</th><th>תיאור</th><th>סוג</th><th class="n">סכום</th><th class="n">שולם</th><th class="n">יתרה</th><th></th></tr>${rows.map(x=>`<tr><td>${dfmt(x.date)}</td><td>${heb(x.date)}</td>${all?`<td>${esc(x.cat)}</td>`:''}<td>${esc(x.sup||x.emp||'')}</td><td>${esc(x.desc)}</td><td>${tag(x)}</td><td class="n">${amtOf(x)}</td><td class="n">${ils(paid(x))}</td><td class="n">${ils(bal(x))}</td><td><button class="btn s g" data-b="ce" data-id="${x.id}">עריכה</button></td></tr>`).join('')||'<tr><td colspan="10" class="empty">אין תנועות בתקופה</td></tr>'}</table></div></div>`}
function cvCsv(){const[f,t]=cvRange(),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',l=[['דוח קטגוריה',CV.cat==='ALL'?'כל העסק':CV.cat],['תקופה',f+' עד '+t],['תאריך הפקה',today()],['סינון','סוג: '+(CV.kind||'הכול')+', חיפוש: '+(CV.q||'—')],['תאריכים','לועזי ועברי'],[],['תאריך','תאריך עברי','קטגוריה','ספק','עובד','מספר חשבונית','תיאור','סוג','סכום','שולם','יתרה'],...cvRows().map(x=>[x.date,heb(x.date),x.cat,x.sup||'',x.emp||'',x.inv||'',x.desc,x.kind||'inv',x.kind==='refund'?x.ref:x.amt,paid(x),bal(x)])];saveFile('category-'+today()+'.csv','\ufeff'+l.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv')}
const V={dash,inc:incView,exp:expView,sup:supView,pay:payView,rep:repView,scan:scanView,imp:impView,cmp:cmpView,cats:catsView};
function render(){
  $('#nav').innerHTML=TABS.map(t=>`<button data-a="nav" data-v="${t[0]}" class="${view===t[0]?'on':''}"><span>${t[1]}</span>${t[2]}</button>`).join('');
  $('#main').innerHTML=V[view]();$('#mon').value=month;calc();fillSup();
}
function calc(){const f=$('#fe'),c=$('#calc');if(!f||!c)return;const a=num(f.amt.value),p=num(f.paid.value),b=Math.max(0,a-p);c.textContent=`יתרה לתשלום: ${ils(b)} · סטטוס: ${p>=a&&a>0?'שולם במלואו':p>0?'שולם חלקית':'ממתין לתשלום'}`}
function go(v){PRE='';if(v==='cats')CV.cat=null;view=v;edit=null;selSup=null;render();scrollTo(0,0)}

/* ---------- actions ---------- */
function payDlg(id){const e=S.exp.find(x=>x.id===id);dlg(`<h3>תשלום ל${esc(e.sup||e.desc)}</h3><p class="note">${esc(e.desc)} · יתרה פתוחה ${ils(bal(e))}</p><form id="fp" data-id="${id}"><div class="f"><label>סכום ששולם (₪)<input type="number" step="0.01" min="0.01" max="${bal(e)}" name="a" required value="${bal(e)}"></label><label>תאריך תשלום<input type="date" name="d" required value="${today()}"></label></div><p class="note">סכום נמוך מהיתרה יסומן כתשלום חלקי.</p><div class="row"><button class="btn">שמור תשלום</button><button type="button" class="btn g" data-a="close">ביטול</button></div></form>`)}
function settings(){dlg(`<h3>נתונים והגדרות</h3><p class="note"><b>שמירה:</b> הנתונים נשמרים בדפדפן הזה בלבד, במכשיר הזה. הם לא משותפים בין מכשירים או אנשים, ויימחקו אם תנקה את נתוני הדפדפן או תעבור לדפדפן אחר. זו אינה מסד נתונים ואינה גיבוי. להעתקה ידנית, השתמש בייצוא למטה.</p><div class="row"><button class="btn" data-a="sample">טען נתוני דוגמה</button><button class="btn r" data-a="wipe">נקה הכול</button></div><h3 style="margin-top:16px">ייצוא וייבוא</h3><textarea id="bk" rows="4" placeholder="הדבק כאן גיבוי לשחזור"></textarea><div class="row"><button class="btn g" data-a="exp">הצג גיבוי להעתקה</button><button class="btn g" data-b="bkfile">הורד קובץ גיבוי</button><label class="btn g up">שחזר מקובץ<input type="file" accept=".json,application/json" data-c="rfile"></label><button class="btn g" data-a="imp">שחזר מהתיבה</button><button class="btn g" data-a="close">סגור</button></div>`)}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b||b.tagName==='SELECT'||b.type==='checkbox')return;
  const a=b.dataset.a,id=b.dataset.id;
  if(a==='nav')go(b.dataset.v);
  else if(a==='settings')settings();
  else if(a==='close')closeDlg();
  else if(a==='yes'){closeDlg();pending&&pending();pending=null}
  else if(a==='cancel'){edit=null;render()}
  else if(a==='eInc'){edit={t:'inc',id};render();scrollTo(0,0)}
  else if(a==='eExp'){edit={t:'exp',id};render();scrollTo(0,0)}
  else if(a==='dInc')ask('למחוק את ההכנסה?',()=>{S.inc=S.inc.filter(x=>x.id!==id);save();render();toast('ההכנסה נמחקה')});
  else if(a==='dExp')ask('למחוק את ההוצאה וההיסטוריה שלה?',()=>{S.exp=S.exp.filter(x=>x.id!==id);save();render();toast('ההוצאה נמחקה')});
  else if(a==='dSup')ask('למחוק את הספק?',()=>{S.sup=S.sup.filter(x=>x.name!==selSup);selSup=null;save();render()});
  else if(a==='pay')payDlg(id);
  else if(a==='full'){const e=S.exp.find(x=>x.id===id);e.pays.push({id:uid(),d:today(),a:bal(e)});save();render();toast('סומן כשולם במלואו')}
  else if(a==='openSup'){selSup=b.dataset.n;render();scrollTo(0,0)}
  else if(a==='back'){selSup=null;render()}
  else if(a==='sample'){sample();closeDlg();render();toast('נטענו נתוני דוגמה')}
  else if(a==='wipe')ask('למחוק את כל הנתונים במכשיר?',()=>{S={sup:[],inc:[],exp:[]};save();render();toast('הנתונים נוקו')});
  else if(a==='exp'){$('#bk').value=JSON.stringify(S);$('#bk').select()}
  else if(a==='imp'){try{const o=JSON.parse($('#bk').value);if(!o.sup||!o.inc||!o.exp)throw 0;S=migrate(o);save();closeDlg();render();toast('הנתונים שוחזרו')}catch(e){toast('הטקסט אינו גיבוי תקין')}}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.a==='all'){showAll=t.checked;render()}
  else if(t.dataset.a==='supCat'){S.sup.find(x=>x.name===selSup).cat=t.value;save();toast('הקטגוריה עודכנה')}
  else if(t.id==='mon'&&t.value){month=t.value;render()}
  else if(t.id==='catSel')fillSup();else if(t.id==='supSel'){const nw=t.value==='__new';$('#nsw').style.display=nw?'flex':'none';const s=S.sup.find(x=>x.name===t.value);if(s)$('#catSel').value=s.cat}
});
document.addEventListener('input',ev=>{if(ev.target.closest('#fe'))calc()});
document.addEventListener('submit',ev=>{
  ev.preventDefault();const f=ev.target,v=Object.fromEntries(new FormData(f));
  if(f.id==='fi'){
    const o={date:v.date,desc:v.desc.trim(),cat:v.cat,amt:num(v.amt),notes:v.notes};
    if(edit){Object.assign(S.inc.find(x=>x.id===edit.id),o);edit=null}else S.inc.push({id:uid(),...o});
    if(!o.date.startsWith(month)){month=o.date.slice(0,7)}
    save();render();toast('ההכנסה נשמרה');
  }else if(f.id==='fe'){
    let sup=v.sup||'';if(sup==='__new'){sup=(v.newSup||'').trim();if(!sup){toast('הזן שם לספק החדש');return}}if(SUPC.includes(v.cat)&&!sup){toast('בקטגוריה זו חובה לבחור ספק');return}if(sup&&!S.sup.find(s=>s.name===sup))S.sup.push({name:sup,cat:SUPC.includes(v.cat)?v.cat:'ספקים'});
    const o={date:v.date,sup,desc:v.desc.trim(),cat:v.cat,...kx(v),plan:v.plan,notes:v.notes,emp:(v.emp||'').trim()};
    if(edit){Object.assign(S.exp.find(x=>x.id===edit.id),o);edit=null}
    else{const p=Math.min(num(v.paid),o.amt);S.exp.push({id:uid(),...o,pays:p>0?[{id:uid(),d:v.date,a:p}]:[]})}
    month=o.date.slice(0,7);save();render();toast('ההוצאה נשמרה');
  }else if(f.id==='fs'){
    const n=v.name.trim();if(S.sup.find(s=>s.name===n)){toast('ספק בשם הזה כבר קיים');return}
    S.sup.push({name:n,cat:v.cat});save();render();toast('כרטיס הספק נוצר');
  }else if(f.id==='fp'){
    const e=S.exp.find(x=>x.id===f.dataset.id),a=Math.min(num(v.a),bal(e));
    if(a>0)e.pays.push({id:uid(),d:v.d,a});closeDlg();save();render();toast(st(e)===3?'שולם במלואו':'נרשם תשלום חלקי');
  }
});
try{const raw=localStorage.getItem(KEY);if(raw&&!JSON.parse(raw).v)localStorage.setItem(KEY+'-v1-copy',raw)}catch(e){}
if(!load()||(!S.exp.length&&!S.inc.length&&!S.sup.length&&!localStorage.getItem(KEY+'-seen'))){sample();try{localStorage.setItem(KEY+'-seen','1')}catch(e){}}
S=migrate(S);save();window.addEventListener('error',e=>toast('שגיאה: '+(e.message||'')));window.addEventListener('unhandledrejection',e=>toast('שגיאה: '+((e.reason&&e.reason.message)||e.reason)));render();
</script>
</body>
</html>
