<!DOCTYPE html>
<html lang="he" dir="rtl" data-th="paper">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c5a49">
<title>לארג׳ פעמי</title>
<style>[hidden]{display:none!important}
:root{--bg:#f1ede4;--card:#fffdf8;--ink:#1d2a2c;--mut:#5f6b69;--line:#d9d2c3;--acc:#1c5a49;--acc2:#e1eee9;--onacc:#fff;--inc:#1b6b4a;--exp:#b2452b;--warn:#8a5a00;--bad:#b3261e;--sh:0 1px 0 rgba(0,0,0,.04),0 6px 18px -10px rgba(40,30,10,.35);--fs:16px;color-scheme:light}
html[data-th=night]{--bg:#121516;--card:#1b2023;--ink:#ece9e1;--mut:#a3aca9;--line:#313a3d;--acc:#69c6a4;--acc2:#1f3a31;--onacc:#06241a;--inc:#69c6a4;--exp:#ee9a82;--warn:#f0c15a;--bad:#ff8c80;--sh:none;color-scheme:dark}
html[data-th=sea]{--bg:#e9eff5;--card:#fff;--ink:#16222e;--mut:#556575;--line:#cdd8e3;--acc:#1d4e89;--acc2:#dfe9f6;--onacc:#fff;--inc:#17714d;--exp:#b2452b}
html[data-th=contrast]{--bg:#000;--card:#000;--ink:#fff;--mut:#e6e6e6;--line:#fff;--acc:#ffe14d;--acc2:#262100;--onacc:#000;--inc:#5cff9d;--exp:#ff9a8a;--warn:#ffd24d;--bad:#ff8a80;--sh:none;color-scheme:dark}
html[data-th=logo]{--bg:#fbf4ee;--card:#fff;--ink:#2b2b2b;--mut:#6a625d;--line:#ecdcd0;--acc:#d9532f;--acc2:#fde8df;--onacc:#fff;--inc:#2f6f55;--exp:#c2441f}
html[data-th=logod]{--bg:#181514;--card:#231f1d;--ink:#f3ece6;--mut:#b5aaa2;--line:#3a332f;--acc:#ef6d4f;--acc2:#3b2a24;--onacc:#1a0d08;--inc:#6fcf9f;--exp:#f09a80;--warn:#f0c15a;--bad:#ff8c80;--sh:none;color-scheme:dark}
html[data-th=bake]{--bg:#f7efe2;--card:#fffaf0;--ink:#3a2a1d;--mut:#7a6650;--line:#e3d3b8;--acc:#9a5b1f;--acc2:#f5e4c8;--onacc:#fff;--inc:#4f7a2a;--exp:#a8431f}
html[data-th=baked]{--bg:#1c1713;--card:#28211a;--ink:#f2e8d9;--mut:#b8a68d;--line:#3d3226;--acc:#e0a15a;--acc2:#3a2c1a;--onacc:#2a1a08;--inc:#a3cf6e;--exp:#f0a07c;--warn:#f0c15a;--bad:#ff8c80;--sh:none;color-scheme:dark}
html[data-th=fresh]{--bg:#eef5ec;--card:#fff;--ink:#1f2d22;--mut:#5a6b5d;--line:#cfe0cc;--acc:#2f7d3a;--acc2:#dff0dc;--onacc:#fff;--inc:#2f7d3a;--exp:#c2441f}
html[data-th=freshd]{--bg:#101813;--card:#18231b;--ink:#e6f0e6;--mut:#9fb3a2;--line:#2a3b2d;--acc:#6fd07b;--acc2:#1b3a22;--onacc:#06200c;--inc:#6fd07b;--exp:#f09a80;--warn:#f0c15a;--bad:#ff8c80;--sh:none;color-scheme:dark}
#lglogo{display:none;width:42px;height:42px;border-radius:50%;background:#fff center/110% no-repeat;border:1px solid var(--line);flex:none}
html[data-th=logo] #lglogo,html[data-th=logod] #lglogo,html[data-th=bake] #lglogo,html[data-th=baked] #lglogo,html[data-th=fresh] #lglogo,html[data-th=freshd] #lglogo{display:block}
html[data-fs="2"]{--fs:18px}html[data-fs="3"]{--fs:21px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Assistant,Rubik,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif;font-size:1rem;line-height:1.45;padding-bottom:calc(92px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums;overscroll-behavior-x:none}
h1,h2,h3{margin:0;line-height:1.2}h2{font-size:1.45rem;font-weight:800;letter-spacing:-.01em}h3{font-size:1.05rem;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.top .ttl{flex:1;min-width:0;font-weight:800;font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;font-size:.72rem;font-weight:600;color:var(--mut);letter-spacing:.02em}
.ib{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.ib svg{width:24px;height:24px}
main{padding:14px;max-width:760px;margin:0 auto}
.sec{margin:20px 0 8px;display:flex;align-items:center;gap:8px}.sec h3{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh);margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.grow{flex:1}
.btn{min-height:52px;padding:0 18px;border-radius:14px;border:2px solid var(--acc);background:var(--acc);color:var(--onacc);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.15}
.btn.g{background:transparent;color:var(--acc)}
.btn.r{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.s{min-height:44px;padding:0 14px;font-size:.92rem;border-radius:12px}
.btn.w{width:100%}
.btn[disabled]{opacity:.45}
.btn svg{width:22px;height:22px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
/* bottom bar */
.bar{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:end;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -18px rgba(0,0,0,.4)}
.bar button{border:0;background:none;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;font-weight:700;color:var(--mut);cursor:pointer;border-radius:12px}
.bar button svg{width:26px;height:26px}
.bar button.on{color:var(--acc)}
.bar button.on::after{content:"";width:22px;height:3px;border-radius:3px;background:var(--acc);margin-top:1px}
.bar .fab{align-self:center;width:66px;height:66px;min-height:66px;border-radius:50%;background:var(--acc);color:var(--onacc);margin-top:-30px;box-shadow:0 8px 20px -6px rgba(0,0,0,.45);border:4px solid var(--bg);justify-self:center}
.bar .fab svg{width:32px;height:32px}.bar .fab::after{display:none}
/* kpi */
.hero{background:var(--acc);color:var(--onacc);border-radius:20px;padding:16px;margin-bottom:12px}
.hero small{opacity:.85;font-weight:600}.hero .big{font-size:2.1rem;font-weight:800;line-height:1.1;margin:2px 0}
.hero .two{display:flex;gap:12px;margin-top:10px}.hero .two>div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px}
html[data-th=night] .hero .two>div,html[data-th=contrast] .hero .two>div{background:rgba(0,0,0,.2)}
.hero .two b{display:block;font-size:1.15rem}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kg .k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.k small{display:block;color:var(--mut);font-weight:600;font-size:.82rem}.k b{font-size:1.25rem}.k.pos b{color:var(--inc)}.k.neg b{color:var(--exp)}
/* list items */
.li{display:flex;align-items:center;gap:12px;padding:13px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:8px;cursor:pointer;min-height:60px;width:100%;text-align:right;position:relative}
.li.inc{border-inline-start:6px solid var(--inc)}.li.exp{border-inline-start:6px solid var(--exp)}
.li .m{flex:1;min-width:0}.li .m b{display:block;font-size:1.04rem}.li .m small{color:var(--mut);display:block}
.li .a{font-weight:800;font-size:1.05rem;white-space:nowrap}.li .a small{display:block;font-weight:600;color:var(--mut);font-size:.78rem;text-align:left}
.li .chev{width:20px;height:20px;color:var(--mut);flex:none;transform:scaleX(-1)}
.li.sel{outline:3px solid var(--acc)}
.pos{color:var(--inc)}.neg{color:var(--exp)}.late{color:var(--bad)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;border:1.5px solid currentColor;margin-inline-end:4px;white-space:nowrap}
.tag.t1{color:var(--warn)}.tag.t2{color:var(--acc)}.tag.t3{color:var(--inc)}.tag.t4{color:var(--bad)}
.note{color:var(--mut);font-size:.9rem}.empty{padding:26px 10px;text-align:center;color:var(--mut)}
.mh{margin:16px 2px 6px;display:flex;justify-content:space-between;font-weight:800;color:var(--mut);font-size:.92rem;border-bottom:1px solid var(--line);padding-bottom:4px}
/* forms */
label.f{display:block;margin-bottom:12px;font-weight:700}
label.f>span{display:block;margin-bottom:4px;font-size:.92rem}
input,select,textarea{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:8px 12px}
textarea{min-height:90px}
input[type=checkbox],input[type=radio]{width:26px;height:26px;min-height:0;accent-color:var(--acc)}
.cb{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:700}
.amt{font-size:1.7rem;font-weight:800;text-align:center;min-height:64px}
.hd{font-size:.88rem;color:var(--mut);margin-top:3px}
.pm{display:flex;gap:8px}.pm .chip{flex:1;justify-content:center}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th{background:var(--acc2);color:var(--ink);font-size:.82rem}td.n,th.n{text-align:left}
tr:last-child td{border-bottom:0}tfoot td{font-weight:800;background:var(--acc2)}
/* sheet (wizard) */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column}
.sheet .sh{position:sticky;top:0;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line);z-index:2}
.sheet .sh .row{flex-wrap:nowrap}.sheet .bd{padding:14px;max-width:640px;width:100%;margin:0 auto;flex:1;padding-bottom:40px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.crumbs .chip{min-height:38px;font-size:.88rem;background:var(--acc2);border-color:var(--acc2)}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{min-height:150px;border-radius:20px;border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:1.4rem;font-weight:800;cursor:pointer}
.tile svg{width:44px;height:44px}.tile.inc{border-color:var(--inc);color:var(--inc)}.tile.exp{border-color:var(--exp);color:var(--exp)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px;width:100%;padding:0 16px;margin-bottom:10px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:1.06rem;cursor:pointer;text-align:right}
.opt small{color:var(--mut);font-weight:500;display:block}.opt.add{border-style:dashed;color:var(--acc);border-color:var(--acc)}
.opt svg{width:20px;height:20px;color:var(--mut);transform:scaleX(-1);flex:none}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);padding:18px;width:min(560px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin-bottom:12px;font-size:1.2rem}
.toast{position:fixed;inset:auto 14px calc(100px + env(safe-area-inset-bottom)) 14px;z-index:99;background:#222;color:#fff;border-radius:14px;padding:13px 16px;text-align:center;font-weight:700;max-width:520px;margin:auto;box-shadow:0 8px 24px rgba(0,0,0,.4)}
html[data-th=night] .toast,html[data-th=contrast] .toast{background:#eee;color:#111}
.pbar{background:var(--acc2);height:10px;border-radius:99px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc)}
.warn{border:1.5px solid var(--warn);background:transparent}
.ban{display:flex;gap:10px;align-items:center;border:1.5px solid var(--warn);border-radius:14px;padding:12px;margin-bottom:12px;color:var(--ink);background:var(--card);cursor:pointer;min-height:56px;width:100%;text-align:right}
.ban b{color:var(--warn)}
.sw{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateX(-14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sw{animation:none}}
.sub{font-size:.8rem;color:var(--mut)}
@media print{.bar,.top,.toast{display:none}}

.ban svg{width:20px;height:20px;flex:none;transform:scaleX(-1)}.ban .tag{flex:none}
.hero .ib svg{width:22px;height:22px}

body.wk .bar,body.wk header [aria-label="הגדרות"]{display:none!important}body.wk main{padding-bottom:30px}

#viewer{position:fixed;inset:0;z-index:99;background:#111;display:flex;flex-direction:column}#viewer[hidden]{display:none!important}#viewer .vbar{display:flex;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}#viewer .vbar .btn{flex:1}#viewer .vimg{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom pan-x pan-y}#viewer img{max-width:100%;max-height:100%;object-fit:contain}

/* ===== מסך כניסה ===== */
body.gate>*:not(#gate){display:none!important}
body.gate{padding:0;background:#16191b}
#gate{position:fixed;inset:0;z-index:9999;overflow:auto;background:#16191b;color:#1d2a2c;font-family:Heebo,Assistant,Rubik,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif;-webkit-overflow-scrolling:touch}
#gate .gbg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#gate .gbg i{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.07)}
#gate .gbg i:nth-child(1){width:560px;height:560px;left:-220px;top:-200px;border-color:rgba(214,82,48,.35)}
#gate .gbg i:nth-child(2){width:360px;height:360px;left:-120px;top:-100px}
#gate .gbg i:nth-child(3){width:620px;height:620px;right:-300px;bottom:-280px;border-color:rgba(214,82,48,.22)}
#gate .gwrap{position:relative;min-height:100%;display:flex;align-items:center;justify-content:center;padding:calc(72px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}
#gate .gcard{position:relative;width:100%;max-width:430px;background:#fbf8f2;border-radius:28px;padding:84px 26px 22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);border-top:5px solid #c9442a}
#gate .glogo{position:absolute;top:-62px;left:50%;transform:translateX(-50%);width:124px;height:124px;background:#fff;border-radius:34px;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.55);border:5px solid #16191b}
#gate .glogo img{width:112px;height:112px;border-radius:26px;display:block}
#gate .gk{margin:0 0 4px;text-align:center;font-size:.82rem;font-weight:700;letter-spacing:.14em;color:#c9442a;text-transform:uppercase}
#gate .gh{margin:0 0 22px;text-align:center;font-size:1.5rem;font-weight:500;line-height:1.3;color:#1d2a2c}
#gate .gh b{font-weight:900;font-size:1.7rem}
#gate .gf{display:block;margin:0 0 14px;position:relative}
#gate .gf span{display:block;font-size:.8rem;font-weight:700;color:#5f6b69;margin:0 4px 5px}
#gate .gf input{width:100%;height:54px;border:1.5px solid #d9d2c3;border-radius:14px;background:#fff;padding:0 16px;font-size:1.05rem;text-align:right;outline:none;transition:border-color .15s,box-shadow .15s}
#gate .gf input:focus{border-color:#c9442a;box-shadow:0 0 0 4px rgba(201,68,42,.14)}
#gate .geye{position:absolute;left:6px;bottom:5px;width:44px;height:44px;border:0;background:transparent;color:#5f6b69;display:grid;place-items:center;cursor:pointer;border-radius:12px}
#gate .geye svg{width:22px;height:22px}
#gate .gf:has(.geye) input{padding-left:52px}
#gate .gerr{min-height:1.4em;margin:0 2px 8px;color:#b3261e;font-weight:700;font-size:.9rem;text-align:center}
#gate .gbtn{width:100%;height:56px;border:0;border-radius:16px;background:#c9442a;color:#fff;font-size:1.1rem;font-weight:800;letter-spacing:.02em;cursor:pointer;box-shadow:0 10px 20px -10px rgba(201,68,42,.9);transition:transform .1s,opacity .15s}
#gate .gbtn:active{transform:scale(.985)}
#gate .gbtn:disabled{opacity:.7}
#gate .gbtn.ld span::after{content:"";display:inline-block;width:14px;height:14px;margin-right:10px;vertical-align:-2px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:gsp .8s linear infinite}
@keyframes gsp{to{transform:rotate(360deg)}}
#gate .gfoot{margin:18px 0 0;text-align:center;font-size:.76rem;color:#7a8583}
@media(max-height:620px){#gate .gwrap{align-items:flex-start}}

.fbsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:start}
.fbsplit.one{display:block}
.fbsplit>form.card{padding:10px;margin:0}
.fbimgw{position:sticky;top:calc(72px + env(safe-area-inset-top))}
.fbzb{position:relative;overflow:hidden;touch-action:none;height:calc(100vh - 215px - env(safe-area-inset-top) - env(safe-area-inset-bottom));height:calc(100dvh - 215px - env(safe-area-inset-top) - env(safe-area-inset-bottom));min-height:260px;border:1px solid var(--line);border-radius:10px;background:#2b2e30;cursor:grab}
.fbzb img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none;user-select:none;-webkit-user-select:none}
.fbzc{position:absolute;bottom:6px;left:6px;display:flex;gap:4px;z-index:2}
.fbzc .ib{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.92);color:#222;font-size:1.1rem;font-weight:800;border-color:transparent}
.fbsplit .pm .chip{min-height:34px!important;font-size:.85rem}
.fbsplit .pm>div:last-child{gap:3px!important}
.fbprev{display:block;font-weight:400;font-size:.8rem;color:var(--mut);margin-top:3px}
.fbprev button{min-height:28px!important;padding:0 8px;font-size:.78rem;margin-inline-start:6px}
.fbtw{max-height:68vh;overflow:auto}
.fbt{border-collapse:separate;border-spacing:0;font-size:.88rem;min-width:1100px;width:100%}
.fbt th{position:sticky;top:0;background:var(--acc2);z-index:2;padding:8px 6px;text-align:start;white-space:nowrap;border-bottom:1px solid var(--line)}
.fbt th small{color:var(--mut);font-weight:400}
.fbt td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.fbt tbody tr{cursor:pointer}.fbt td.c{text-align:center}.fbt td.tx{min-width:160px;max-width:260px}
.fbt .nm{position:sticky;inset-inline-start:0;background:var(--card);font-weight:700;white-space:nowrap;z-index:1}
.fbt th:first-child{inset-inline-start:0;z-index:3}
.fbt tfoot td{position:sticky;bottom:0;background:var(--acc2);font-weight:700}
.fbbars{display:flex;gap:4px;align-items:flex-end;height:150px;margin-top:10px}
.fbbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font:inherit}
.fbbar:disabled{cursor:default}
.fbbar .b{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px;opacity:.9}
.fbbar:disabled .b{opacity:.25}
.fbbar .v{font-size:.8rem;font-weight:700;min-height:1.1em}.fbbar .x{font-size:.8rem;color:var(--mut);margin-top:3px}

.lw{display:flex;gap:6px;align-items:stretch;margin:0 0 8px}.lw>.li{flex:1;min-width:0;margin:0}.fa{display:flex;gap:4px;align-items:center;flex:none}.fa .ib{width:44px;height:44px;border-radius:12px}.fa .ib svg{width:20px;height:20px}
</style>

'use strict';
/* ===== לארג׳ פעמי v7 – ליבה: נתונים, עזרים, המרה, גיבוי ===== */

const num=v=>parseFloat(v)||0,uid=()=>Math.random().toString(36).slice(2,6)+Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,4);
const rnd=n=>Math.round((n+Number.EPSILON)*100)/100,sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());

const dObj=v=>new Date(v+'T12:00:00');

const addMon=(m,k)=>{const[y,mm]=m.split('-').map(Number);return ym(new Date(y,mm-1+k,1))};
const dfmt=d=>d?d.split('-').reverse().join('/'):'';
const MN=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

const nf=new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:2});
const ils=n=>nf.format(rnd(n||0));
const dayIn=(m,d)=>{const[y,mm]=m.split('-').map(Number),dim=new Date(y,mm,0).getDate();return m+'-'+p2(Math.min(Math.max(+d||1,1),dim))};
const addM=(iso,k)=>{const[y,m,d]=iso.split('-').map(Number);return dayIn(ym(new Date(y,m-1+k,1)),d)};
/* --- פענוח ערכים (ייבוא) --- */
function mk(y,mo,d){y=+y;mo=+mo;d=+d;const t=new Date(Date.UTC(y,mo-1,d));return t.getUTCFullYear()===y&&t.getUTCMonth()===mo-1&&t.getUTCDate()===d?y+'-'+p2(mo)+'-'+p2(d):null}
function pDate(v){if(v===''||v==null)return null;if(typeof v==='number')return v<20000||v>80000?null:new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);const s=s_(v);let m;if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))return mk(m[1],m[2],m[3]);if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/)){let y=+m[3];if(y<100)y+=2000;return mk(y,m[2],m[1])}return null}
function pMonth(v){const s=s_(v);let m;if(!s)return null;if(m=s.match(/^(\d{1,2})[\/.-](\d{4})$/))return +m[1]>=1&&+m[1]<=12?m[2]+'-'+p2(m[1]):null;if(m=s.match(/^(\d{4})-(\d{2})$/))return +m[2]>=1&&+m[2]<=12?s:null;const d=pDate(v);return d?d.slice(0,7):null}
function pNum(v){if(typeof v==='number')return v;let s=s_(v).replace(/[₪\s]|ש"ח|שח/g,'');if(!s)return null;let neg=/^\(.*\)$/.test(s);s=s.replace(/[()]/g,'');const c=s.lastIndexOf(','),d=s.lastIndexOf('.');if(c>-1&&d>-1)s=c>d?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else if(c>-1)s=/,\d{1,2}$/.test(s)?s.replace(',','.'):s.replace(/,/g,'');if(!/^-?\d+(\.\d+)?$/.test(s))return null;return neg?-parseFloat(s):parseFloat(s)}
/* --- תאריך עברי --- */
const HFP=new Intl.DateTimeFormat('he-u-ca-hebrew-nu-latn',{day:'numeric',month:'long',year:'numeric'});
const hp=d=>{const o={};HFP.formatToParts(new Date(d+'T12:00:00')).forEach(p=>{o[p.type]=p.value});return o};
function gem(n){const T=['','י','כ','ל','מ','נ','ס','ע','פ','צ'],O=['','א','ב','ג','ד','ה','ו','ז','ח','ט'];let s='',h=Math.floor(n/100);while(h>4){s+='ת';h-=4}s+=['','ק','ר','ש','ת'][h];const r=n%100;s+=r===15?'טו':r===16?'טז':T[Math.floor(r/10)]+O[r%10];return s.length===1?s+'׳':s.slice(0,-1)+'״'+s.slice(-1)}
const hYear=y=>{y=+y;return gem(y%1000)};
const heb=d=>{try{const p=hp(d);return gem(+p.day)+' ב'+p.month+' '+hYear(p.year)}catch(e){return ''}};
/* --- csv --- */
function parseCsv(t){const rows=[],l0=t.split('\n')[0],d=l0.split(';').length>l0.split(',').length?';':(l0.indexOf('\t')>-1&&l0.indexOf(',')<0?'\t':',');let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===d){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}if(c!==''||r.length){r.push(c);rows.push(r)}return rows}
const toCsv=rows=>'﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');

/* ===== מודל נתונים ===== */
/* beh: simple | sup | emp | fixed | free | cc | loan */
const BEH={
 simple:'סכום ותאריך בלבד',
 sup:'ספק: חשבונית, חודש תשלום, תשלומים וכרטסת',

 cc:'כרטיס אשראי: חיובים והתאמה לחשבוניות',
 loan:'הלוואה עם לוח סילוקין'};
const METHODS=['העברה','צ׳ק','מזומן','אשראי'];
const SAL_METHODS=['מזומן','העברה'];
const PEND={inc:'p_inc',exp:'p_exp'};
let S=null;
function defaults(){
 const cats=[],subs=[];
 const C=(id,kind,name,beh,list)=>{cats.push({id,kind,name,beh});(list||[]).forEach(n=>subs.push({id:uid(),cat:id,name:n}))};
 C('i_yh','inc','קופה יהודה הנשיא','simple',['אשראי','מזומן','צ׳קים','העברה']);

 C('i_cyh','inc','כרטיסים יהודה הנשיא','simple',['כארד שופ','כארד כל','נדרים פלוס']);
 C('e_sup','exp','ספקים','sup',[]);
 C('e_bak','exp','ספקים אפייה','sup',[]);
 C('e_sal','exp','משכורות','emp',[]);
 C('e_salb','exp','משכורות אפייה','emp',[]);
 C('e_card','exp','כרטיסים','simple',['כארד שופ','כארד כל','נדרים כארד']);
 C('e_fix','exp','הוצאות קבועות','fixed',['חשמל','ארנונה','שכירות']);
 C('e_cc','exp','אשראי','cc',[]);
 C('e_loan','exp','הלוואות','loan',[]);
 C('e_misc','exp','שונות','free',[]);
 cats.push({id:'p_inc',kind:'inc',name:'ממתין לסיווג',beh:'simple',hid:true},{id:'p_exp',kind:'exp',name:'ממתין לסיווג',beh:'simple',hid:true});
 return{v:3,theme:'paper',fs:1,cats,subs,tx:[],fixTpl:[],fixOk:{},loans:[],ccx:[],imp:null,created:new Date().toISOString()};
}
const cat=id=>S.cats.find(c=>c.id===id),subById=id=>S.subs.find(x=>x.id===id);
const catsOf=k=>S.cats.filter(c=>c.kind===k&&!c.hid);
const heKey=s=>String(s||'').replace(/["'׳״`’]/g,'').trim();
function heCmp(a,b){a=heKey(a);b=heKey(b);if(!a||!b)return a?-1:b?1:0;const c=x=>/^[א-ת]/.test(x)?0:/^[A-Za-z]/.test(x)?1:2,d=c(a)-c(b);return d||a.localeCompare(b,'he')}
const subsOf=cid=>S.subs.filter(x=>x.cat===cid&&!x.off).sort((x,y)=>heCmp(x.name,y.name));
const txOfSub=sid=>S.tx.filter(t=>t.sub===sid);
const live=()=>S.tx.filter(t=>!t.x);
const subName=t=>t.sub?(subById(t.sub)||{}).name||'—':(t.desc||'—');
const beh=t=>(cat(t.cat)||{}).beh||'simple';
const hasPay=t=>t.t==='exp'&&['sup','fixed'].includes(beh(t))&&(t.kind||'inv')==='inv'&&t.amt>0;
const paid=t=>rnd(sum(t.pays||[],p=>p.a));
const bal=t=>hasPay(t)?Math.max(0,rnd(t.amt-paid(t))):0;
const pmon=t=>t.plan||(t.date||'').slice(0,7);
const stOf=t=>paid(t)>=t.amt-0.004?3:paid(t)>0?2:1;
const STN={1:'ממתין לתשלום',2:'שולם חלקית',3:'שולם'};
function ensure(d){
 d=d||{};['cats','subs','tx','fixTpl','loans','ccx','inbox'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
 if(!d.fixOk||typeof d.fixOk!=='object'||Array.isArray(d.fixOk))d.fixOk={};
 if(d.pmOff==null)d.pmOff=2;if(!d.theme)d.theme='paper';if(!d.fs)d.fs=1;d.v=3;
 ['p_inc','p_exp'].forEach(id=>{if(!d.cats.find(c=>c.id===id))d.cats.push({id,kind:id==='p_inc'?'inc':'exp',name:'ממתין לסיווג',beh:'simple',hid:true})});
 return d}
function save(){try{if(isW())return}catch(e){}try{const nw=new Date().toISOString();if(!S.tsFrom){S.tsFrom=nw;S.tx.forEach(t=>{if(t.ts==null)t.ts=''})}S.tx.forEach(t=>{if(t.ts==null)t.ts=nw})}catch(e){}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('השמירה במכשיר נכשלה – יצא גיבוי עכשיו')}}

/* ===== המרה מהאפליקציה הישנה ===== */
const IMAP={'מזומן נחל לכיש':['i_nl','מזומן'],'אשראי נחל לכיש':['i_nl','אשראי'],'הקפה נחל לכיש':['i_nl','הקפה'],'מזומן יהודה הנשיא':['i_yh','מזומן'],'אשראי יהודה הנשיא':['i_yh','אשראי']};
const EMAP={'ספקים':'e_sup','ספקים אפייה':'e_bak','משכורות':'e_sal','משכורות אפייה':'e_salb','הוצאות קבועות':'e_fix','אשראי':'e_cc','הלוואות':'e_loan','שונות':'e_misc'};
function convertLegacy(old){
 const N=defaults(),rep={inc:{n:0,sum:0},exp:{n:0,sum:0},paid:0,pend:[],notes:[]};
 const sub=(c,name)=>{name=s_(name)||'ללא שם';let s=N.subs.find(x=>x.cat===c&&x.name===name);if(!s){s={id:uid(),cat:c,name};N.subs.push(s)}return s};
 const arr=k=>Array.isArray(old[k])?old[k]:[];
 arr('inc').forEach(x=>{
  const m=IMAP[x.cat],t={id:x.id||uid(),t:'inc',date:x.date,amt:num(x.amt),note:[x.desc,x.notes].filter(Boolean).join(' · ')};
  if(m){t.cat=m[0];t.sub=sub(m[0],m[1]).id}else{t.cat='p_inc';t.sub=null;t.oldCat=x.cat;t.note=(t.note?t.note+' · ':'')+'קטגוריה בגרסה הישנה: '+x.cat;rep.pend.push(t)}
  N.tx.push(t);rep.inc.n++;rep.inc.sum+=t.amt});
 const loanSub={};
 arr('loans').forEach(l=>{const s=sub('e_loan',l.name);loanSub[l.id]=s.id});
 arr('exp').forEach(x=>{
  const c=EMAP[x.cat]||'p_exp',b=(N.cats.find(y=>y.id===c)||{}).beh,t={id:x.id||uid(),t:'exp',cat:c,date:x.date,amt:num(x.amt),kind:x.kind||'inv',plan:x.plan||(x.date||'').slice(0,7),inv:x.inv||'',note:x.notes||'',desc:x.desc||'',pays:(x.pays||[]).map(p=>({id:p.id||uid(),d:p.d,a:num(p.a),m:p.m||'לא צוין'}))};
  if(x.kind==='refund'){t.amt=0;t.rf=num(x.ref)}
  if(x.file)t.file=x.file;if(x.fx)t.fx=x.fx;if(x.ln)t.ln=x.ln;if(x.cc)t.cc=x.cc;
  if(c==='p_exp'){t.sub=null;t.oldCat=x.cat;t.desc=[x.sup,x.desc].filter(Boolean).join(' · ');t.note=(t.note?t.note+' · ':'')+'קטגוריה בגרסה הישנה: '+x.cat;rep.pend.push(t)}
  else if(c==='e_misc'){t.sub=null;t.desc=[x.sup,x.desc].filter(Boolean).join(' · ')||'שונות'}
  else if(b==='emp'){t.sub=sub(c,x.emp||x.sup||x.desc).id;t.pays=t.pays.map(p=>({...p,m:p.m==='לא צוין'?'לא צוין':p.m}))}
  else if(c==='e_loan'&&x.ln&&loanSub[x.ln.id||x.ln.l])t.sub=loanSub[x.ln.id||x.ln.l];
  else t.sub=sub(c,x.sup||x.desc).id;
  if(c==='e_sup'||c==='e_bak'||c==='e_fix'){/* שם הספק נשמר ככרטיס; התיאור נשאר בהערה */if(t.desc&&t.sub&&subById0(N,t.sub).name!==t.desc)t.note=[t.desc,t.note].filter(Boolean).join(' · ')}
  N.tx.push(t);rep.exp.n++;rep.exp.sum+=t.amt;rep.paid+=sum(t.pays,p=>p.a)});
 /* עובדים */
 arr('emp').forEach(e=>{const c=e.cat==='משכורות אפייה'?'e_salb':'e_sal',s=sub(c,e.name);s.ext={role:e.role||'',phone:e.phone||'',start:e.start||'',notes:e.notes||''};if(e.act===false)s.off=true});
 /* ספקים שאין להם חשבוניות */
 arr('sup').forEach(s=>{const c=EMAP[s.cat];if(c==='e_sup'||c==='e_bak')sub(c,s.name)});
 /* הוצאות קבועות */
 arr('fix').forEach(f=>{const c=EMAP[f.cat]||'e_fix',s=sub(c,f.sup||f.name);N.fixTpl.push({id:f.id,sub:s.id,cat:c,name:f.name,amt:num(f.amt),day:f.day||1,start:f.start||'',end:f.end||'',act:f.act!==false,notes:f.notes||''})});
 N.fixOk={...(old.fixOk||{})};
 /* הלוואות וכרטיסי אשראי */
 arr('loans').forEach(l=>N.loans.push({...l,sub:loanSub[l.id]}));
 arr('cards').forEach(c=>{const s=sub('e_cc',c.name);s.ext={last4:c.last4||'',oldId:c.id};c.__sub=s.id});
 arr('ccx').forEach(c=>{const card=arr('cards').find(k=>k.id===c.card);N.ccx.push({...c,sub:card?card.__sub:null})});
 if(old.theme==='contrast')N.theme='contrast';else if(old.theme==='gold')N.theme='night';else if(old.theme==='blue')N.theme='sea';

 return{S:ensure(N),rep}}
const subById0=(D,id)=>D.subs.find(x=>x.id===id)||{};
function legacyTotals(old){const a=k=>Array.isArray(old[k])?old[k]:[];return{inc:{n:a('inc').length,sum:rnd(sum(a('inc'),x=>num(x.amt)))},exp:{n:a('exp').length,sum:rnd(sum(a('exp'),x=>num(x.amt)))},paid:rnd(sum(a('exp'),e=>sum(e.pays||[],p=>num(p.a))))}}
function newTotals(D){const L=D.tx;return{inc:{n:L.filter(t=>t.t==='inc').length,sum:rnd(sum(L.filter(t=>t.t==='inc'),t=>t.amt))},exp:{n:L.filter(t=>t.t==='exp').length,sum:rnd(sum(L.filter(t=>t.t==='exp'),t=>t.amt))},paid:rnd(sum(L,t=>sum(t.pays||[],p=>p.a)))}}
function compare(old,D){const a=legacyTotals(old),b=newTotals(D);const rows=[['מספר הכנסות',a.inc.n,b.inc.n],['סך ההכנסות',a.inc.sum,b.inc.sum],['מספר הוצאות',a.exp.n,b.exp.n],['סך ההוצאות',a.exp.sum,b.exp.sum],['סך התשלומים שנרשמו',a.paid,b.paid]];return{rows,ok:rows.every(r=>Math.abs(r[1]-r[2])<0.005)}}

/* ===== גיבוי ===== */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('lp-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function fput(id,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function fget(id){const d=await idb();return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const stamp=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'_'+p2(d.getHours())+p2(d.getMinutes())};
function parseBackup(t){const o=JSON.parse(t),d=o.app==='large-pami'?o.data:o;if(!d)throw new Error('קובץ לא מוכר');
 if(Array.isArray(d.tx)&&Array.isArray(d.cats))return{legacy:false,d:ensure(d),files:o.files||{},date:o.date||null,schema:o.schema||3,fb:o.fb||null,shelf:o.shelf||null};
 if(Array.isArray(d.sup)&&Array.isArray(d.inc)&&Array.isArray(d.exp))return{legacy:true,old:d,files:o.files||{},date:o.date||null,schema:o.schema||1};

function readTx(f,c,sub,t0){
 const b=c.beh,errs=[],amt=pNum(f.amt);
 if(amt==null||amt===0)errs.push('הסכום חסר או לא תקין');
 if(amt!=null&&amt<0&&b!=='sup')errs.push('מינוס מותר רק בחשבונית זיכוי של ספק');
 if(!f.date)errs.push('חסר תאריך');
 if(b==='free'&&!s_(f.desc))errs.push('כתוב מה זה בדיוק');
 if(b==='emp'&&!f.m)errs.push('בחר מזומן או העברה');
 if((b==='sup'||b==='fixed')&&!pMonth(f.plan))errs.push('חסר חודש לתשלום');
 if(b==='sup'&&!s_(f.inv)&&!f.dn&&!(t0&&!t0.inv&&!t0.dn))errs.push('חסר מספר חשבונית (או סמן תעודת משלוח)');
 if(errs.length)return{errs};
 const t=t0?{...t0}:{id:uid(),t:c.kind,cat:c.id,sub:sub||null,pays:[]};
 t.date=f.date;t.amt=rnd(amt);t.note=s_(f.note);
 if(b==='free')t.desc=s_(f.desc);
 if(b==='sup'||b==='fixed'){t.plan=f.plan;t.inv=s_(f.inv);if(b==='sup'){if(f.dn&&!t.inv)t.dn=true;else delete t.dn}t.kind=amt<0?'credit':'inv';if(t0&&t0.kind==='refund'){t.kind='refund';t.amt=0;t.rf=Math.abs(amt)}}
 if(b==='emp'){t.plan=f.plan;t.pays=[{id:(t.pays[0]||{}).id||uid(),d:f.date,a:t.amt,m:f.m}]}
 if((b==='sup'||b==='fixed')&&!t0&&f.paynow){const pa=f.pa?pNum(f.pa):t.amt;if(pa==null||pa<=0||pa>t.amt+0.004)return{errs:['סכום ששולם לא תקין']};if(!f.m)return{errs:['בחר אמצעי תשלום']};if(!f.pd)return{errs:['חסר תאריך תשלום']};t.pays=[{id:uid(),d:f.pd,a:rnd(pa),m:f.m}]}
 if(b==='cc'&&!t0&&f.link){const inv=S.tx.find(x=>x.id===f.link);if(inv){if(t.amt>bal(inv)+0.004)return{errs:['החיוב גדול מיתרת החשבונית ('+ils(bal(inv))+')']};inv.pays=inv.pays||[];inv.pays.push({id:uid(),d:t.date,a:t.amt,m:'אשראי',cc:t.id});t.x=1;t.link=inv.id}}
 return{t}}
FRM.addsave=(form,ev)=>{const f=fd(form),go=ev.submitter&&ev.submitter.value;const c=cat(A.cat);
 const r=readTx(f,c,A.sub,A.edit?S.tx.find(t=>t.id===A.edit):null);
 if(r.errs){toast(r.errs[0]);return}
 if(c.beh==='sup'&&!form.dataset.dupok){const dd=dupOf({id:r.t.id,sub:r.t.sub,amt:r.t.amt,date:r.t.date,inv:r.t.inv}),mm=dupMsg(dd);if(mm.length){ask('נראה שההוצאה כבר קיימת: '+mm.join('; ')+'. לשמור בכל זאת?',()=>{form.dataset.dupok='1';FRM.addsave(form,ev)},'שמור בכל זאת');return}}
 if(!A.edit&&A.fid&&c.beh==='sup')r.t.file=A.fid;
 if(!A.edit)S.tx.push(r.t);else{const i=S.tx.findIndex(t=>t.id===A.edit);S.tx[i]=r.t}
 save();const subn=A.sub?subById(A.sub).name:r.t.desc;toast('נשמר: '+ils(r.t.amt)+' · '+(subn||c.name));
 if(go==='more'&&!A.edit){const keep={type:A.type,cat:A.cat,sub:A.sub};A={step:'det',...keep};sheetDraw();rerender();return}
 sheetClose();rerender()};

const rdU=f=>new Promise(r=>{const a=new FileReader();a.onload=()=>r(a.result);a.readAsDataURL(f)});
async function shrinkDU(f){const u=await rdU(f);if(!f.type.startsWith('image/'))return u;return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85))};i.onerror=()=>r(u);i.src=u})}
const du2b=u=>{const[h,b]=u.split(','),bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.match(/:(.*?);/)[1]})};

 rows.slice(hi+1).forEach(r=>{if(!r.some(x=>String(x??'').trim()))return;const d=pDate(r[ix.date]),a=pNum(r[ix.amt]),t=String(r[ix.desc]??'').trim();if(!d||a==null||a===0||!t){bad++;return}const k=card+'|'+d+'|'+t+'|'+a;cur[k]=(cur[k]||0)+1;if(cur[k]<=(have[k]||0)){dup++;return}ok.push({id:uid(),sub:card,date:d,desc:t,amt:a,match:'',exp:''})});
 return{ok,dup,bad}}

/* ===== PDF (טקסט מצויר כתמונה) ===== */
function pdfPages(sp){const W=1754,H=1240,M=60,RH=40,F='"Heebo","Noto Sans Hebrew","Segoe UI",Arial,sans-serif',pages=[],cols=sp.cols,sc=(W-2*M)/cols.reduce((a,c)=>a+c.w,0);
const fit=(x,t,w)=>{t=String(t??'');if(x.measureText(t).width<=w)return t;while(t.length>1&&x.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'};
const nw=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.direction='rtl';x.textBaseline='middle';pages.push(x);return[c,x]};
let[c,x]=nw(),y=M;
const th=()=>{x.fillStyle='#1c5a49';x.fillRect(M,y,W-2*M,RH+4);x.fillStyle='#fff';x.font='bold 21px '+F;let xr=W-M;cols.forEach(k=>{const w=k.w*sc;x.textAlign=k.a==='l'?'left':'right';x.fillText(fit(x,k.h,w-16),k.a==='l'?xr-w+8:xr-8,y+RH/2+2);xr-=w});y+=RH+4};
x.fillStyle='#111';x.textAlign='right';x.font='bold 40px '+F;x.fillText(sp.title,W-M,y+20);y+=56;x.font='22px '+F;sp.meta.forEach(([k,v])=>{x.fillStyle='#555';x.fillText(k+': ',W-M,y);const kw=x.measureText(k+': ').width;x.fillStyle='#111';x.fillText(String(v),W-M-kw,y);y+=32});y+=10;th();
sp.rows.forEach((r,i)=>{if(y+RH>H-M-50){[c,x]=nw();y=M;th()}if(i%2){x.fillStyle='#eef1ea';x.fillRect(M,y,W-2*M,RH)}x.fillStyle='#111';x.font='20px '+F;let xr=W-M;cols.forEach((k,j)=>{const w=k.w*sc;x.textAlign=k.a==='l'?'left':'right';x.fillText(fit(x,r[j],w-16),k.a==='l'?xr-w+8:xr-8,y+RH/2);xr-=w});x.strokeStyle='#d5dfe1';x.beginPath();x.moveTo(M,y+RH);x.lineTo(W-M,y+RH);x.stroke();y+=RH});
if(!sp.rows.length){x.fillStyle='#777';x.textAlign='center';x.font='22px '+F;x.fillText('אין תנועות בתקופה',W/2,y+RH/2);y+=RH}
y+=16;if(y+sp.sum.length*36+20>H-M-40){[c,x]=nw();y=M}
sp.sum.forEach(([k,v],i)=>{const last=i===sp.sum.length-1;x.font=(last?'bold ':'')+'24px '+F;x.fillStyle=last?'#1c5a49':'#111';x.textAlign='right';x.fillText(k,W-M,y+14);x.textAlign='left';x.fillText(String(v),W-M-420,y+14);y+=36});
return pages.map((p,i)=>{p.fillStyle='#777';p.font='18px '+F;p.textAlign='center';p.fillText('הופק ב־'+dfmt(today())+' · עמוד '+(i+1)+' מתוך '+pages.length,W/2,H-30);return p.canvas.toDataURL('image/jpeg',.9)})}
function mkPdf(imgs){const enc=new TextEncoder(),parts=[],offs=[];let len=0;const push=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length},obj=(n,f)=>{offs[n]=len;push(n+' 0 obj\n');f();push('\nendobj\n')},N=imgs.length;
push('%PDF-1.4\n');obj(1,()=>push('<</Type/Catalog/Pages 2 0 R>>'));obj(2,()=>push('<</Type/Pages/Count '+N+'/Kids['+imgs.map((_,i)=>(3+i*3)+' 0 R').join(' ')+']>>'));
imgs.forEach((im,i)=>{const p=3+i*3,jpg=Uint8Array.from(atob(im.split(',')[1]),c=>c.charCodeAt(0)),cs='q 842 0 0 595 0 0 cm /Im0 Do Q';
obj(p,()=>push('<</Type/Page/Parent 2 0 R/MediaBox[0 0 842 595]/Resources<</XObject<</Im0 '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>'));
obj(p+1,()=>push('<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream'));
obj(p+2,()=>{push('<</Type/XObject/Subtype/Image/Width 1754/Height 1240/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jpg.length+'>>\nstream\n');push(jpg);push('\nendstream')})});
const xr=len,T=3+N*3;push('xref\n0 '+T+'\n0000000000 65535 f \n');for(let n=1;n<T;n++)push(String(offs[n]).padStart(10,'0')+' 00000 n \n');push('trailer\n<</Size '+T+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
const out=new Uint8Array(len);let o=0;parts.forEach(b=>{out.set(b,o);o+=b.length});return out}
function exportPdf(sp,name){try{saveFile(name,mkPdf(pdfPages(sp)),'application/pdf')}catch(e){toast('יצירת ה־PDF נכשלה: '+(e.message||e))}}

const OCAI_P='בתמונות עמודים של חשבונית מס או תעודת משלוח של ספק בישראל. החזר JSON בלבד בצורה: {"document_type":"invoice" או "delivery_note","supplier":"שם הספק או העסק שהנפיק את המסמך (לא הלקוח)","number":"מספר החשבונית או תעודת המשלוח, ספרות בלבד אם אפשר","date":"תאריך המסמך בפורמט YYYY-MM-DD","total_before_vat":מספר או null,"vat_amount":מספר או null,"total_with_vat":מספר או null}. total_with_vat הוא הסכום הסופי לתשלום כולל מע"מ, בדרך כלל בסוף המסמך. אם רשום מחיר אחרי הנחה, זה total_before_vat. התעלם מכתב יד, חתימות וקשקושים. שדה שלא נראה בבירור: null. אל תנחש.';
function ocrDown(du,max){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*r);c.height=Math.round(im.naturalHeight*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85))};im.onerror=()=>no(new Error('תמונה'));im.src=du})}
async function ocrAI(pages,subs){const k=typeof shKey==='function'?shKey():'';if(!k||!pages.length)return null;
 const parts=[{text:OCAI_P}];for(const p of pages)parts.push({inline_data:{mime_type:'image/jpeg',data:(await ocrDown(p,1800)).split(',')[1]}});
 const t=await shAIcall({contents:[{parts}],generationConfig:{responseMimeType:'application/json',temperature:0}},k,0,false,'invoice');
 const o=JSON.parse(String(t).replace(/```json|```/g,'').trim());
 const nm=v=>{if(v==null||v==='')return null;const n=pNum(String(v));return n!=null&&n>0&&n<5e6?n:null},f2=x=>Math.round(x*100)/100;
 const tot=nm(o.total_with_vat),net=nm(o.total_before_vat),vat=nm(o.vat_amount);let amt=null;
 if(tot){amt={v:tot,sure:true};if(net&&vat&&Math.abs(net+vat-tot)>0.06)amt.sure=false}
 else if(net&&vat)amt={v:f2(net+vat),sure:true,calc:true};else if(net)amt={v:f2(net*1.18),sure:false,calc:true};
 const date=/^\d{4}-\d{2}-\d{2}$/.test(String(o.date||''))?o.date:null;
 let inv=String(o.number||'').replace(/[^0-9A-Za-z\-]/g,'');if(inv.length<2)inv=null;
 const dn=o.document_type==='delivery_note';
 if(!amt&&!inv&&!date&&!o.supplier)return null;
 return{raw:o,res:{inv,date,amt,sup:ocrSupplier(String(o.supplier||''),subs),dn,hasInv:!dn}}}

async function viewImg(fid,name){let du;try{du=await fget(fid)}catch(e){}if(!du)return toast('הקובץ לא נמצא במכשיר');
 let pgs=null;if(du.startsWith('PAGES:')){try{pgs=JSON.parse(du.slice(6))}catch(e){}}else if(/^data:image\//.test(du))pgs=[du];

function shrinkMore(u){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{let k=Math.min(1,1100/Math.max(i.width,i.height)),q=.7,out;const c=document.createElement('canvas');
 for(let n=0;n<5;n++){c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<900000)return res(out);k*=.8;q-=.08}rej(new Error('big'))};i.onerror=rej;i.src=u})}

/* PDF מתמונות סרוקות: עמוד לכל תמונה, בגודל התמונה */
async function mkScanPdf(imgs){const enc=new TextEncoder(),parts=[],offs=[];let len=0;const push=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length},obj=(n,f)=>{offs[n]=len;push(n+' 0 obj\n');f();push('\nendobj\n')},N=imgs.length;
 const dm=[];for(const u of imgs){const i=await ldImg(u);dm.push([i.width,i.height])}
 push('%PDF-1.4\n');obj(1,()=>push('<</Type/Catalog/Pages 2 0 R>>'));obj(2,()=>push('<</Type/Pages/Count '+N+'/Kids['+imgs.map((_,i)=>(3+i*3)+' 0 R').join(' ')+']>>'));
 imgs.forEach((im,i)=>{const p=3+i*3,[w,h]=dm[i],PW=595,PH=Math.round(595*h/w),jpg=Uint8Array.from(atob(im.split(',')[1]),c=>c.charCodeAt(0)),cs='q '+PW+' 0 0 '+PH+' 0 0 cm /Im0 Do Q';
  obj(p,()=>push('<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+PW+' '+PH+']/Resources<</XObject<</Im0 '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>'));
  obj(p+1,()=>push('<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream'));
  obj(p+2,()=>{push('<</Type/XObject/Subtype/Image/Width '+w+'/Height '+h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jpg.length+'>>\nstream\n');push(jpg);push('\nendstream')})});
 const xr=len,T=3+N*3;push('xref\n0 '+T+'\n0000000000 65535 f \n');for(let n=1;n<T;n++)push(String(offs[n]).padStart(10,'0')+' 00000 n \n');push('trailer\n<</Size '+T+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
 const out=new Uint8Array(len);let o=0;parts.forEach(b=>{out.set(b,o);o+=b.length});return out}

/* ===== פרשת השבוע (לוח ישראל) ===== */
const PR_N=['בראשית','נח','לך לך','וירא','חיי שרה','תולדות','ויצא','וישלח','וישב','מקץ','ויגש','ויחי','שמות','וארא','בא','בשלח','יתרו','משפטים','תרומה','תצוה','כי תשא','ויקהל','פקודי','ויקרא','צו','שמיני','תזריע','מצורע','אחרי מות','קדושים','אמור','בהר','בחוקותי','במדבר','נשא','בהעלותך','שלח','קורח','חוקת','בלק','פינחס','מטות','מסעי','דברים','ואתחנן','עקב','ראה','שופטים','כי תצא','כי תבוא','נצבים','וילך','האזינו'];
const prLeap=y=>(7*y+1)%19<7;
const prEl=y=>{const m=Math.floor((235*y-234)/19),p=12084+13753*m,d=29*m+Math.floor(p/25920);return (3*(d+1))%7<3?d+1:d};
const prNY=y=>{const a=prEl(y-1),b=prEl(y),c=prEl(y+1);return -1373427+b+(c-b===356?2:b-a===382?1:0)};
const prLen=y=>prNY(y+1)-prNY(y);
/* יום בשבוע של RD: 0=ראשון .. 6=שבת */
const prDow=rd=>((rd%7)+7+0)%7;
function prMonths(y){const L=prLen(y)%10,h=L===5?30:29,k=L===3?29:30;return prLeap(y)?[30,h,k,29,30,30,29,30,29,30,29,30,29]:[30,h,k,29,30,29,30,29,30,29,30,29]}
/* שמות החודשים לפי אינדקס (מתשרי) */
function prRd(y,mi,d){const M=prMonths(y);let r=prNY(y);for(let i=0;i<mi;i++)r+=M[i];return r+d-1}
const prNis=y=>prLeap(y)?7:6, prSiv=y=>prNis(y)+2, prAv=y=>prNis(y)+4;
function prYear(rd){let y=Math.floor((rd+1373427)/365.2468)+1;while(prNY(y+1)<=rd)y++;while(prNY(y)>rd)y--;return y}
const prRdOf=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');if(!m)return null;return Math.floor(Date.UTC(+m[1],+m[2]-1,+m[3])/864e5)+719163};
/* ההפרש 719163: RD של 1970-01-01. RD מודד ימים מ-0001-01-01 הלועזי = 1 */
function prCycle(Y){
 const ny=prNY(Y),nn=prNY(Y+1),leap=prLeap(Y),rhD=prDow(ny),pes=prRd(Y,prNis(Y),15),pesD=prDow(pes);
 /* Y+1: מספר השבתות הרגילות בין ר״ה לסוכות */
 const rh2=prNY(Y+1);let k=0;for(let r=rh2+1;r<rh2+14;r++)if(prDow(r)===6&&r!==rh2+9)k++;
 const isThu=prDow(ny)===5?1:0;
 const ex={VP:!leap&&!(rhD===4&&pesD===0),TM:!leap,AK:!leap,BB:!leap&&pesD!==6,CB:false,MM:!(leap&&(rhD===4||pesD===6))};
 return{ny,nn,leap,k,ex,pes}}
/* rhD: 0=ראשון... בדיקה: ר״ה ביום חמישי = 4 */
const prCache={};
function prSlots(Y){if(prCache[Y])return prCache[Y];
 const c=prCycle(Y),t22=prRd(Y,0,22);let b=t22+1;while(prDow(b)!==6)b++;
 const sp=new Set();const nis=prNis(Y);for(let d=15;d<=21;d++)sp.add(prRd(Y,nis,d));sp.add(prRd(Y,prSiv(Y),6));
 const days=[];for(let r=b;r<c.nn;r+=7)if(!sp.has(r))days.push(r);
 const items=[];const merge=(a)=>a;
 const pairs={21:'VP',26:'TM',28:'AK',31:'BB',38:'CB',41:'MM'};
 for(let i=0;i<=50;i++){if(pairs[i]&&c.ex[pairs[i]]){items.push([i,i+1]);i++}else if(i===50&&c.k===1)items.push([50,51]);else items.push([i])}
 const ok=items.length===days.length;
 return prCache[Y]={days,items,ok,b,c}}
/* מחזיר שם פרשה לשבת (RD) או שם חג; null אם לא ניתן */
function prShabbat(s){const Y=prYear(s),ny=prNY(Y),o=s-ny;
 const nis=prNis(Y),pes=prRd(Y,nis,15);
 if(o===0)return'ראש השנה';if(o===9)return'יום כיפור';
 if(o>=14&&o<=20)return'שבת חול המועד סוכות';if(o===21)return'שמחת תורה';
 if(s>=pes&&s<=pes+6)return s===pes?'פסח':s===pes+6?'שביעי של פסח':'שבת חול המועד פסח';
 if(s===prRd(Y,prSiv(Y),6))return'שבועות';
 /* תחילת השנה: לפני בראשית, שייך למחזור הקודם */
 const t22=prRd(Y,0,22);
 if(s<=t22){const rh=ny;const sats=[];for(let r=rh+1;r<rh+14;r++)if(prDow(r)===6&&r!==rh+9)sats.push(r);const i=sats.indexOf(s);if(i<0)return null;return sats.length===1?'האזינו':i===0?'וילך':'האזינו'}
 const S=prSlots(Y);if(!S.ok)return null;const i=S.days.indexOf(s);if(i<0)return null;return S.items[i].map(x=>PR_N[x]).join('-')}
/* ISO -> {sh:'פרשת ...', ...} לשבת הקרובה (או היום אם שבת) */
function prOfDate(iso){const rd=prRdOf(iso);if(rd==null)return'';let s=rd;while(prDow(s)!==6)s++;const n=prShabbat(s);if(!n)return'';return /^(שבת|ראש|יום|שמחת|פסח|שביעי|שבועות)/.test(n)?n:'פרשת '+n}

const FB_P=`אתה מקבל צילום של "טופס משוב לקוחות" של חנות, שהלקוח מילא בכתב יד בעברית (בדרך כלל בעט כחול או שחור). הטקסט המודפס בטופס הוא בוורוד ובשחור: התעלם ממנו וקרא רק את מה שנכתב ביד.
מבנה הטופס מלמעלה למטה:
1. שורה עם "מספר חשבונית:" (מימין) ו"סכום קנייה:" (משמאל, ליד סמל ₪).
2. טבלת שביעות רצון: שש שורות, ובכל שורה עיגולים מודפסים עם המספרים 1 עד 10 (1 בצד שמאל, 10 בצד ימין). מימין לכל שורה יש סמל קטן ושם הנושא, ובצד ימין של הדף עמודת "הערות".
3. שתי תיבות: "מה הכי אהבתם אצלנו?" (מימין) ו"מה לדעתכם ניתן לשפר?" (משמאל).
4. "פרטי התקשרות": "שם:" (מימין), "טלפון:" (באמצע), "כתובת (לא חובה):" (משמאל).
אחרי הדף המלא מצורפות תמונות מוגדלות של חלקי הדף. השתמש בהן כדי לקרוא כל אות וכל ספרה בדיוק.
כללים:
- ציונים: הלקוח מסמן מספר בעיגול סביבו, בווי (✓), בקו אלכסוני, ב-X או בקשקוש עליו. לפעמים הסימון גולש מחוץ לעיגול, מתחתיו או מעליו: בחר את המספר שהסימון נוגע בו או מצביע עליו. סימון על הסמל או על שם הנושא שבצד ימין אינו ציון. שורה בלי סימון: null. שים לב במיוחד להבדל בין 9 ל-10 הסמוכים.
- מספר חשבונית: ספרות בלבד, בדרך כלל 7 ספרות (למשל 8247460). קרא כל ספרה בנפרד.
- סכום קנייה: מספר. פסיק או נקודה הם נקודה עשרונית ("9,9" הוא 9.9, "58.86" הוא 58.86).
- טלפון: ספרות בלבד, בדרך כלל מספר נייד ישראלי בן 10 ספרות שמתחיל ב-05. אם המספר לא נכנס בשורה והמשכו נכתב מעל השורה או מתחתיה, חבר את החלקים לפי הסדר (למשל "054123" ומעליו "4567" הם 0541234567).
- שם: לרוב שם משפחה בלבד, לפעמים בכתב יד רהוט (כתב עברי מחובר). דוגמאות לשמות נפוצים: אונגר, רבינוביץ, גרוסמן, כהן, לוי, פרידמן, וייס, שטרן, גולדברג. העתק את מה שכתוב בפועל.
- כתובת: רחוב ומספר, כולל לוכסן אם יש (למשל "הרצל 12/3").
- "מה הכי אהבתם" ו"מה לשפר": העתק את כל הטקסט מכל השורות, עם סימני הפיסוק (למשל "שעות פתיחה, מבחר יפה!").
- בכתב יד עברי היזהר מבלבול בין אותיות דומות (ד/ר, ה/ח/ת, ו/ז/ן, ב/כ, ס/ם, ט/מ, ע/צ) והכרע לפי מילה או שם הגיוניים.
- אל תמציא ואל תשלים. שדה שלא כתוב בו כלום: מחרוזת ריקה. אם אינך בטוח בקריאה, תן את הקריאה הסבירה ביותר ורשום את שם השדה ב-uncertain.
החזר JSON בלבד בצורה: {"invoice_number":"","purchase_amount":"","liked":"","improve":"","name":"","phone":"","address":"","ratings":{"availability":null,"service":null,"cleanliness":null,"prices":null,"bakery":null,"overall":null},"uncertain":[]}
השורות ב-ratings: availability = זמינות מוצרים ומלאי, service = השירות שקיבלתם מהעובדים, cleanliness = ניקיון וסדר בחנות, prices = מחירים ומבצעים, bakery = מחלקת האפייה, overall = חוויית הקנייה הכללית.`;

function fbFit(c,maxS){const k=Math.min(1,maxS/Math.max(c.width,c.height));if(k===1)return c;const o=cvOf(c.width*k,c.height*k);o.getContext('2d').drawImage(c,0,0,o.width,o.height);return o}
async function fbCv(du){const img=await ldImg(du),c=cvOf(img.naturalWidth,img.naturalHeight);c.getContext('2d').drawImage(img,0,0);return c}
async function fbPage(du,maxS){const img=await ldImg(du);let c=srcCanvas(img,0,3300),q=null;try{q=findQuad(c)}catch(e){}c=q?warp(c,q,maxS):fbFit(c,maxS);return{c,found:!!q}}

function fbCrop(c,y0,y1,w){const sy=Math.round(c.height*y0),sh=Math.max(1,Math.round(c.height*(y1-y0))),o=cvOf(w,sh*w/c.width);o.getContext('2d').drawImage(c,0,sy,c.width,sh,0,0,o.width,o.height);return o}
async function fbAI(p){const k=shKey();if(!k)throw new Error('אין מפתח זיהוי חכם. מלא את הטופס ידנית');

 if(found)parts=parts.concat(im('תמונה 2: הגדלה של שורת מספר החשבונית וסכום הקנייה',fbCrop(c,.1,.32,1800)),im('תמונה 3: הגדלה של טבלת הציונים',fbCrop(c,.27,.6,1800)),im('תמונה 4: הגדלה של התיבות "מה הכי אהבתם" ו"מה לשפר" ושל פרטי ההתקשרות (שם, טלפון, כתובת)',fbCrop(c,.52,.88,1800)));

 const o=JSON.parse(String(t).replace(/```json|```/g,'').trim()),f=fbEmpty(),R=o.ratings||{};
 f.inv=String(o.invoice_number||'').replace(/\s+/g,'');f.amt=String(o.purchase_amount||'').replace(/[^\d.,]/g,'').replace(',','.');f.love=String(o.liked||'').trim();f.imp=String(o.improve||'').trim();
 f.name=String(o.name||'').trim();f.phone=String(o.phone||'').replace(/\D/g,'');if(/^5\d{8}$/.test(f.phone))f.phone='0'+f.phone;f.addr=String(o.address||'').trim();
 f.r=FB_RK.map(x=>{const n=Math.round(+R[x]);return n>=1&&n<=10?n:0});
 const mp={invoice_number:'inv',purchase_amount:'amt',liked:'love',improve:'imp',name:'name',phone:'phone',address:'addr'};
 f.chk=(Array.isArray(o.uncertain)?o.uncertain:[]).map(x=>mp[x]||(FB_RK.includes(x)?'r'+FB_RK.indexOf(x):'')).filter(Boolean);return f}
/* דפים שעוד לא אושרו עוברים זיהוי מחדש פעם אחת בגרסה המשופרת; הערכים הקודמים נשמרים להשוואה */
function fbMig(){if((FBL.v||0)>=2)return;FBL.pend.forEach(p=>{if(p.man)return;if(!fbIsEmpty(p.f))p.prev=JSON.parse(JSON.stringify(p.f));p.st='q';p.err='';p.tries=0;p.nx=0;p.ed=p.ed||[]});FBL.v=2;fbSave()}
let FBRUN=false,FBT=null;

async function fbRun(){if(FBRUN)return;FBRUN=true;fbMig();
 try{for(;;){const now=Date.now(),p=FBL.pend.find(x=>x.st==='q'&&(!x.nx||x.nx<=now));if(!p)break;p.st='ai';fbSave();if(['fb','fbRev'].includes(cur().v))fbRef();
  try{const r=await fbAI(p),here=cur().v==='fbRev'&&cur().a===p.id;if(here)fbKeep();const ed=p.ed||[],chk=r.chk.filter(x=>!ed.includes(x));

async function fbPush(){if(!fbRole())return;if(fbPush.b)return;fbPush.b=1;let sent=0;
 try{for(const r of FBL.out.slice()){try{if(r.upd)await fsx('/fb/'+r.id+'?updateMask.fieldPaths=data&updateMask.fieldPaths=st',{method:'PATCH',body:JSON.stringify({fields:{data:sv(fbRecJ(r)),st:sv('ok')}})});
  else{const img=r.hi?(await fget('fb:'+r.id))||'':'';
  if(r.hi&&!fbAdmin()&&!r.hp){let hu='';try{hu=await fget('fbhi:'+r.id)||''}catch(e){}const n=Math.ceil(hu.length/CH);if(n&&n<=6){for(let k=0;k<n;k++){try{await fsx('/chunks?documentId='+encodeURIComponent('fbhi_'+r.id+'_'+k),{method:'POST',body:JSON.stringify({fields:{owner:sv(SY.uid),data:sv(hu.slice(k*CH,(k+1)*CH))}})})}catch(e){if(e.code!==409)throw e}}r.hp=n}}
  await fsx('/fb/'+r.id,{method:'PATCH',body:JSON.stringify({fields:{data:sv(fbRecJ(r)),img:sv(img),owner:sv(SY.uid),at:sv(r.at),st:sv(r.st||'ok')}})})}
  FBL.out=FBL.out.filter(x=>x.id!==r.id);r.err='';if(fbAdmin()&&(r.st||'ok')==='ok'){FBL.cache=FBL.cache.filter(x=>x.id!==r.id);FBL.cache.push({id:r.id,f:r.f,by:r.by,at:r.at,hi:r.hi})}if(!r.upd)fbDel(r.id);sent++;fbSave()}

function fbPZ(img){const box=img.parentElement,P=new Map(),iw=img.naturalWidth,ih=img.naturalHeight;let s=1,x=0,y=0,s0=1,pd=0,pm=null,lt=0,down=null,moved=false;
 const ap=()=>{const bw=box.clientWidth,bh=box.clientHeight,W=iw*s,H=ih*s;x=W<=bw?(bw-W)/2:Math.min(0,Math.max(bw-W,x));y=H<=bh?(bh-H)/2:Math.min(0,Math.max(bh-H,y));img.style.transform=`translate(${x}px,${y}px) scale(${s})`};
 const fit=()=>{s0=box.clientWidth/iw;s=s0;x=0;y=0;ap()};
 const zm=(f,cx,cy)=>{const mn=Math.min(box.clientWidth/iw,box.clientHeight/ih),ns=Math.min(s0*10,Math.max(mn,s*f));x=cx-(cx-x)*ns/s;y=cy-(cy-y)*ns/s;s=ns;ap()};

 box.onpointerdown=e=>{if(e.target.closest('.fbzc'))return;try{box.setPointerCapture(e.pointerId)}catch(z){}const q=pt(e);P.set(e.pointerId,q);if(P.size===1){down=q;moved=false}else{moved=true;const[a,b]=[...P.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1]);pm=[(a[0]+b[0])/2,(a[1]+b[1])/2]}};
 box.onpointermove=e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId),n=pt(e);P.set(e.pointerId,n);
  if(P.size===1){if(down&&Math.hypot(n[0]-down[0],n[1]-down[1])>8)moved=true;x+=n[0]-o[0];y+=n[1]-o[1];ap()}
  else if(P.size===2){const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),m=[(a[0]+b[0])/2,(a[1]+b[1])/2];if(pd&&pm){x+=m[0]-pm[0];y+=m[1]-pm[1];zm(d/pd,m[0],m[1])}pd=d;pm=m}};
 const up=e=>{if(!P.has(e.pointerId))return;P.delete(e.pointerId);pd=0;pm=null;
  if(e.type==='pointerup'&&!P.size&&!moved){const t=Date.now(),q=pt(e);if(t-lt<320){if(s>s0*1.5)fit();else zm(2.5*s0/s,q[0],q[1]);lt=0}else lt=t}};
 box.onpointerup=box.onpointercancel=up;
 box.onwheel=e=>{e.preventDefault();const q=pt(e);zm(e.deltaY<0?1.2:1/1.2,q[0],q[1])};
 box.querySelector('.fbzc').onclick=e=>{const b=e.target.closest('[data-z]');if(!b)return;if(b.dataset.z==='fit')fit();else zm(b.dataset.z==='in'?1.5:1/1.5,box.clientWidth/2,box.clientHeight/2)};

const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function mkZip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 const dt=new Date(),dd=((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate(),tm=(dt.getHours()<<11)|(dt.getMinutes()<<5)|(dt.getSeconds()>>1);
 for(const f of files){const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
  const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,tm,true);lh.setUint16(12,dd,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
  parts.push(new Uint8Array(lh.buffer),nm,f.data);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,tm,true);ch.setUint16(14,dd,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
  cen.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+sz}
 let cl=0;cen.forEach(c=>cl+=c.length);
 const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cl,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/zip'})}
const u8b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const isNat=()=>{const C=window.Capacitor;return !!(C&&C.isNativePlatform&&C.isNativePlatform())};
const safeN=s=>String(s||'').replace(/[\\\/:*?"<>|\u0000-\u001f]/g,'-').replace(/\s+/g,' ').trim().slice(0,60);
const invFn=t=>safeN([subName(t),t.date,t.inv||t.id].join('_'));

 const base=name||invFn(t);let pgs=null;
 if(du.startsWith('PAGES:')){try{pgs=JSON.parse(du.slice(6))}catch(e){}}else if(/^data:image\/(jpeg|jpg)/.test(du))pgs=[du];
 if(pgs&&pgs.length===1)return{name:base+'.jpg',data:new Uint8Array(await du2b(pgs[0]).arrayBuffer()),mime:'image/jpeg'};
 if(pgs&&pgs.length)return{name:base+'.pdf',data:await mkScanPdf(pgs),mime:'application/pdf'};
 const b=du2b(du);return{name:base+(MEXT[b.type]||'.bin'),data:new Uint8Array(await b.arrayBuffer()),mime:b.type}}

function bqHead(){const h=document.querySelector('[data-bqhead]');if(h){const c=bqCnt();h.textContent=c.n+' חשבוניות · '+c.done+' זוהו'}}
function bqCard(it){const f=it.f,subs=bqSubs(it),ready=it.st==='ok'||it.st==='fail';
 if(!ready)return `<div class="card" data-bq="${it.id}"><div class="row"><img src="${it.pg[0]}" alt="חשבונית" style="width:56px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)"><div class="grow"><b>${bqTag(it)}</b><p class="note" style="margin:4px 0 0">${it.pg.length>1?it.pg.length+' עמודים · ':''}הזיהוי ברקע</p></div><button class="btn s g" data-a="bqDel" data-id="${it.id}">הסר</button></div></div>`;
 return `<div class="card" data-bq="${it.id}" ${it.err?'style="border-color:var(--bad)"':''}><div class="row" style="margin-bottom:8px"><img src="${it.pg[0]}" alt="חשבונית" data-a="bqView" data-id="${it.id}" style="width:56px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in"><div class="grow"><b>${bqTag(it)}</b>${it.pg.length>1?'<span class="note"> · '+it.pg.length+' עמודים</span>':''}${f.dn?'<div class="note">תעודת משלוח</div>':''}</div><button class="btn s g" data-a="bqDel" data-id="${it.id}">הסר</button></div>
 ${it.err?`<p class="note" style="color:var(--bad);font-weight:700;margin:0 0 6px">${esc(it.err)}</p>`:''}
 <label class="f"><span>ספק</span><select data-c="bqf" data-id="${it.id}" data-k="sub"><option value="" ${f.sub?'':'selected'}>${it.res&&it.res.sup?'':'לא זוהה – בחר'}</option>${subs.map(x=>`<option value="${x.id}" ${x.id===f.sub?'selected':''}>${esc(x.name)}</option>`).join('')}<option value="__new" ${f.sub==='__new'?'selected':''}>＋ ספק חדש…</option></select></label>
 <div data-bqnew="${it.id}" ${f.sub==='__new'?'':'hidden'}><label class="f"><span>שם הספק החדש</span><input data-c="bqf" data-id="${it.id}" data-k="newname" value="${esc(f.newname)}" autocomplete="off"></label></div>
 <div class="row"><label class="f grow"><span>${f.dn?'מס׳ תעודת משלוח':'מספר חשבונית'}</span><input data-c="bqf" data-id="${it.id}" data-k="${f.dn?'dnum':'inv'}" value="${esc(f.dn?f.dnum:f.inv)}" autocomplete="off"></label><label class="f grow"><span>סכום</span><input class="amt" inputmode="decimal" data-c="bqf" data-id="${it.id}" data-k="amt" value="${esc(f.amt)}"></label></div>
 <div class="row"><label class="f grow"><span>תאריך</span><input type="date" data-c="bqf" data-id="${it.id}" data-k="date" value="${esc(f.date)}"></label><label class="f grow"><span>חודש לתשלום</span><input type="month" data-bqplan="${it.id}" data-c="bqf" data-id="${it.id}" data-k="plan" value="${esc(f.plan)}"></label></div>
 ${it.err&&it.dupok===0?`<button class="btn g w" data-a="bqDup" data-id="${it.id}">שמור בכל זאת</button>`:''}</div>`}
function bqDraw(){const c=bqCnt();
 dlg(`<h3>בדיקת חשבוניות</h3><p class="note" data-bqhead style="margin:4px 0 10px">${c.n} חשבוניות · ${c.done} זוהו</p>${BQ.length?BQ.map(bqCard).join(''):'<p class="empty">אין חשבוניות בתור.</p>'}
 <div class="row" style="position:sticky;bottom:0;background:var(--card);padding:8px 0"><button class="btn grow" data-a="bqAll" ${BQ.some(x=>x.st==='ok'||x.st==='fail')?'':'disabled'}>אישור הכול</button><button class="btn g grow" data-a="closeDlg">סגור</button></div>`)}
ACT.bqReview=()=>{BQ.forEach(x=>{if(x.dupok==null)x.dupok=undefined});bqDraw()};
CHG.bqf=el=>{const it=BQ.find(x=>x.id===el.dataset.id);if(!it)return;const k=el.dataset.k;it.f[k]=el.value;it.err='';
 if(k==='sub'){const n=document.querySelector('[data-bqnew="'+it.id+'"]');if(n)n.hidden=el.value!=='__new'}
 if((k==='sub'||k==='date')&&!it.f.pt){it.f.plan=payDef(it.f.sub==='__new'?'':it.f.sub,it.f.date||today());const p=document.querySelector('[data-bqplan="'+it.id+'"]');if(p)p.value=it.f.plan}
 if(k==='plan')it.f.pt=1};
ACT.bqDel=el=>{BQ=BQ.filter(x=>x.id!==el.dataset.id);bqDraw()};
ACT.bqView=el=>{const it=BQ.find(x=>x.id===el.dataset.id);if(it)viewImg(it.fid,'LargePami_'+it.id)};
ACT.bqDup=el=>{const it=BQ.find(x=>x.id===el.dataset.id);if(!it)return;it.dupok=1;it.err='';bqSaveOne(it)&&(BQ=BQ.filter(x=>x!==it));save();bqDraw();rerender()};
function bqSaveOne(it){const c=cat(it.cat),f={...it.f};let sid=f.sub;
 if(!sid){it.err='בחר ספק';return false}
 if(f.dn&&!s_(f.inv))f.note=s_(f.note)||('ת. משלוח '+s_(f.dnum));
 let nsub=null;
 if(sid==='__new'){const nm=s_(f.newname);if(!nm){it.err='כתוב שם לספק';return false}nsub=nm}
 const probeSub=nsub?null:sid;
 const r=readTx({inv:f.inv,date:f.date,amt:f.amt,plan:f.plan,note:f.note,dn:f.dn},c,probeSub||'__x',null);
 if(r.errs){it.err=r.errs[0];return false}
 if(!it.dupok&&probeSub){const mm=dupMsg(dupOf({id:r.t.id,sub:probeSub,amt:r.t.amt,date:r.t.date,inv:r.t.inv}));if(mm.length){it.err='נראה שכבר קיימת: '+mm.join('; ');it.dupok=0;return false}}
 if(nsub){let ex=S.subs.find(x=>x.cat===c.id&&x.name===nsub);if(!ex){ex={id:uid(),cat:c.id,name:nsub};S.subs.push(ex)}else if(ex.off)ex.off=false;sid=ex.id}
 r.t.sub=sid;r.t.file=it.fid;S.tx.push(r.t);return true}
ACT.bqAll=()=>{let ok=0,bad=0;const keep=[];
 for(const it of BQ){if(it.st!=='ok'&&it.st!=='fail'){keep.push(it);continue}
  document.querySelectorAll('[data-bq="'+it.id+'"] [data-k]').forEach(i=>{const k=i.dataset.k;if(k in it.f)it.f[k]=i.value});
  if(bqSaveOne(it))ok++;else{bad++;keep.push(it)}}
 BQ=keep;if(ok)save();bqDraw();rerender();
 toast(ok?(ok+' חשבוניות נשמרו'+(bad?'; '+bad+' דורשות תיקון':'')):'אין חשבונית תקינה לשמירה')};
/* ===== מדף: צילום מוצרים ברצף, זיהוי ברקע ואישור הכול ===== */
let SHQ=[],SHQact=0;
async function shqOne(it){let ai=null,err='';
 for(let k=0;k<3&&!ai;k++){try{ai=await shAI(it.img);if(!ai&&!shKey()){err='אין מפתח לזיהוי חכם';break}break}catch(e){err=e&&e.message||String(e);if(/מפתח|key/i.test(err))break;await new Promise(r=>setTimeout(r,k?12000:4000))}}
 if(ai&&(ai.n||ai.d)){if(!it.tn)it.n=ai.n||'';if(!it.td)it.d=ai.d||'';it.st='ok'}else{it.st='fail';it.err=err||'לא זוהה, אפשר להקליד'}}
function shqPump(){while(SHQact<2){const it=SHQ.find(x=>x.st==='q');if(!it)break;SHQact++;it.st='run';shqUI();shqOne(it).catch(()=>{it.st='fail'}).finally(()=>{SHQact--;shqPump();shqUI()})}}
function shqUI(){if(cur().v==='shAdd'&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.closest('.shq')))rerender()}
async function shqAdd(files){for(const f of files){try{const img=await shImg(f,1800);SHQ.push({id:uid(),img,st:'q',n:'',d:'',p:''});shqPump();shqUI()}catch(e){toast('התמונה לא נקראה')}}}
CHG.shqpick=async el=>{const fs=[...el.files];el.value='';if(fs.length){await shqAdd(fs);toast('נוסף לתור. אפשר לצלם את המוצר הבא')}};
const shqHtml=()=>{if(!SHQ.length)return '';
 return `<div class="sec"><h3>מוצרים בתור (${SHQ.length})</h3></div>`+SHQ.map(it=>`<div class="card shq" data-sq="${it.id}"><div class="row" style="margin-bottom:6px"><img src="${it.img}" alt="מוצר" style="width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line)"><div class="grow"><span class="tag ${it.st==='ok'?'':'t1'}">${it.st==='ok'?'זוהה':it.st==='run'?'מזהה…':it.st==='q'?'ממתין':'להקלדה'}</span>${it.err?`<div class="note">${esc(it.err)}</div>`:''}</div><button class="btn s g" data-a="shqDel" data-id="${it.id}">הסר</button></div>
 <label class="f"><span>שם המוצר</span><input data-c="shqf" data-id="${it.id}" data-k="n" value="${esc(it.n)}" autocomplete="off"></label>
 <div class="row"><label class="f grow"><span>פירוט</span><input data-c="shqf" data-id="${it.id}" data-k="d" value="${esc(it.d)}" autocomplete="off"></label><label class="f" style="width:110px"><span>מחיר ₪</span><input inputmode="decimal" data-c="shqf" data-id="${it.id}" data-k="p" value="${esc(it.p)}" autocomplete="off"></label></div></div>`).join('')+
 `<button class="btn w" data-a="shqAll" ${SHQ.some(x=>x.st==='ok'||x.st==='fail')?'':'disabled'}>אישור הכול והוספה לדף</button>`};
CHG.shqf=el=>{const it=SHQ.find(x=>x.id===el.dataset.id);if(!it)return;const k=el.dataset.k;it[k]=el.value;if(k==='n')it.tn=1;if(k==='d')it.td=1};
ACT.shqDel=el=>{SHQ=SHQ.filter(x=>x.id!==el.dataset.id);rerender()};
ACT.shqAll=()=>{document.querySelectorAll('.shq [data-k]').forEach(i=>{const it=SHQ.find(x=>x.id===i.dataset.id);if(it)it[i.dataset.k]=i.value});
 const ready=SHQ.filter(x=>x.st==='ok'||x.st==='fail'),good=ready.filter(x=>s_(x.n)&&shPrice(x.p));
 if(!good.length)return toast('אין מוצר עם שם ומחיר תקינים');
 const go=()=>{good.forEach(it=>shAdd('price',{n:s_(it.n),d:s_(it.d),p:shPrice(it.p)},-1));SHQ=SHQ.filter(x=>!good.includes(x));toast('✓ נוספו '+good.length+' פתקים'+(SHQ.length?'; '+SHQ.length+' דורשים שם ומחיר':''));rerender()};
 if(shCount('price')+good.length>SHC.price.cap)ask('הדף יתמלא ופתקים ישנים יוחלפו. להמשיך?',go,'המשך');else go()};

/* ===== גיבוי מלא: חשבוניות סרוקות, משוב ומדף + גיבוי יומי ל-Firebase ===== */
const bkFileIds=()=>{const ids=new Set();S.tx.forEach(t=>{if(t.file)ids.add(t.file)});(FBL.cache||[]).forEach(r=>{if(r.hi)ids.add('fb:'+r.id)});(FBL.pend||[]).forEach(p=>ids.add('fb:'+p.id));(FBL.out||[]).forEach(o=>{if(o.hi)ids.add('fb:'+o.id)});return[...ids]};
const shClean=()=>{const o={...SH};delete o.dirty;return o};
async function bkCollect(prog,cloudImgs){const files={},ids=bkFileIds();let i=0;
 for(const id of ids){if(prog)prog(++i,ids.length);let f=null;try{f=await fget(id)}catch(e){}
  if(!f&&cloudImgs&&id.startsWith('fb:')&&(typeof isA==='function'&&isA())){try{f=await fbImg(id.slice(3));if(f)await fput(id,f)}catch(e){}}
  if(f)files[id]=f}
 return{data:S,files,fb:{cache:FBL.cache,pend:FBL.pend,out:FBL.out},shelf:shClean()}}
async function mkBackup(prog){const c=await bkCollect(prog,true);return JSON.stringify({app:'large-pami',schema:4,date:new Date().toISOString(),data:c.data,files:c.files,fb:c.fb,shelf:c.shelf})}
/* ---- ענן (Firebase), אוסף bk: meta, d{a|b}_N (נתונים), f_<id>_N (קבצים) ---- */
const BKC=700000;
let BKS={run:0,msg:''};
const bkSet=m=>{BKS.msg=m;const e=document.getElementById('bkst');if(e)e.textContent=m};
const bkDocId=id=>id.replace(/[^A-Za-z0-9_\-]/g,'_');
const bkAscii=s=>s.replace(/[\u0080-￿]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));
async function bkNames(coll){const r=await fsx(':runQuery',{method:'POST',body:JSON.stringify({structuredQuery:{from:[{collectionId:coll||'bk'}],select:{fields:[{fieldPath:'__name__'}]},limit:20000}})});return(r||[]).filter(x=>x.document).map(x=>idOf(x.document))}
const bkPut=(id,data)=>fsx('/bk/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({fields:{data:sv(data),owner:sv(SY.uid)}})});
async function bkCloud(manual){if(!isA()){if(manual)toast('גיבוי לענן זמין למנהל המחובר');return false}
 if(BKS.run){if(manual)toast('גיבוי כבר רץ');return false}BKS.run=1;S.bkTry=Date.now();save();
 try{
  bkSet('מכין גיבוי…');
  try{await fbLoad()}catch(e){}
  const col=await bkCollect((i,n)=>bkSet('אוסף קבצים '+i+' מתוך '+n),true);
  const gen=S.bkGen==='a'?'b':'a',have=new Set(await bkNames()),fm={},ids=Object.keys(col.files);let i=0,up=0;
  for(const id of ids){const f=col.files[id],dn='f_'+bkDocId(id),np=Math.max(1,Math.ceil(f.length/BKC));fm[id]={d:dn,n:np};
   let all=true;for(let k=0;k<np;k++)if(!have.has(dn+'_'+k)){all=false;break}
   if(!all){for(let k=0;k<np;k++)await bkPut(dn+'_'+k,f.slice(k*BKC,(k+1)*BKC));up++}
   bkSet('מעלה קבצים '+(++i)+' מתוך '+ids.length)}
  const body=bkAscii(JSON.stringify({app:'large-pami',schema:4,date:new Date().toISOString(),data:col.data,fb:col.fb,shelf:col.shelf})),np=Math.max(1,Math.ceil(body.length/BKC));
  for(let k=0;k<np;k++){await bkPut('d'+gen+'_'+k,body.slice(k*BKC,(k+1)*BKC));bkSet('שומר נתונים '+(k+1)+' מתוך '+np)}
  const counts={tx:S.tx.length,files:ids.length,fb:(col.fb.cache||[]).length};
  await bkPut('meta',JSON.stringify({date:new Date().toISOString(),gen,np,files:fm,counts}));
  /* רק אחרי שהחדש הושלם: מוחקים את הישן ושאריות */
  const keep=new Set(['meta']);for(let k=0;k<np;k++)keep.add('d'+gen+'_'+k);ids.forEach(id=>{for(let k=0;k<fm[id].n;k++)keep.add(fm[id].d+'_'+k)});
  let del=0;for(const n of await bkNames()){if(!keep.has(n)){try{await fsx('/bk/'+encodeURIComponent(n),{method:'DELETE'});del++}catch(e){}}}
  S.bkGen=gen;S.lastCloudBackup=new Date().toISOString();S.bkCounts=counts;S.bkErr='';save();
  bkSet('✓ הגיבוי הושלם: '+counts.tx+' תנועות, '+counts.files+' קבצים'+(up?' ('+up+' חדשים)':' (ללא חדשים)'));if(manual)toast('✓ הגיבוי לענן הושלם');
  if(cur().v==='data')rerender();return true
 }catch(e){const m=e&&e.offline?'אין חיבור לאינטרנט':(e&&e.code===403?'אין הרשאה: יש לפרסם את חוקי Firebase החדשים':(e&&e.message||String(e)));S.bkErr=m;save();bkSet('הגיבוי נכשל: '+m);if(manual)toast('הגיבוי נכשל: '+m);return false}
 finally{BKS.run=0}}
const dayOf=iso=>iso?ymdL(new Date(iso)):'';
function bkAuto(){try{if(!isA()||S.autoBk===false||BKS.run||!navigator.onLine)return;if(dayOf(S.lastCloudBackup)===today())return;if(S.bkTry&&Date.now()-S.bkTry<3*3600e3)return;bkCloud(false)}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(bkAuto,3000)});
ACT.bkNow=()=>bkCloud(true);
ACT.bkAutoTg=()=>{S.autoBk=S.autoBk===false;save();rerender()};
async function bkCloudGet(){const mt=await fsx('/bk/meta'),m=JSON.parse(gv(mt,'data')||'{}');if(!m.gen)throw new Error('אין גיבוי בענן');
 let body='';for(let k=0;k<m.np;k++)body+=gv(await fsx('/bk/d'+m.gen+'_'+k),'data');
 const o=JSON.parse(body),files={},ids=Object.keys(m.files||{});let i=0;
 for(const id of ids){bkSet('מוריד קבצים '+(++i)+' מתוך '+ids.length);let f='',okf=true;for(let k=0;k<m.files[id].n;k++){try{f+=gv(await fsx('/bk/'+m.files[id].d+'_'+k),'data')}catch(e){okf=false;break}}if(okf&&f)files[id]=f}
 return{legacy:false,d:ensure(o.data),files,date:o.date||m.date,schema:4,fb:o.fb||null,shelf:o.shelf||null}}
ACT.bkCloudRestore=()=>{if(!isA())return toast('שחזור מהענן זמין למנהל המחובר');
 dlg('<h3>טוען את הגיבוי מהענן…</h3><p class="note" id="bkst2">רגע…</p>');
 (async()=>{try{const r=await bkCloudGet();closeDlg();restoreFlow(r)}catch(e){closeDlg();toast('הטעינה נכשלה: '+(e&&e.message||e))}})()};
/* החזרת משוב ומדף לענן אחרי שחזור */
async function bkRestoreExtras(){
 if(RESTORE&&RESTORE.shelf){const sh=RESTORE.shelf;Object.keys(sh).forEach(k=>{if(k!=='dirty')SH[k]=sh[k]});SH.dirty=SH.dirty||{};SHKEYS.forEach(k=>{SH.dirty[k]=1});shSave();try{if(shOn())for(const k of SHKEYS)await shPush(k)}catch(e){}}
 if(RESTORE&&RESTORE.fb){const b=RESTORE.fb;FBL.cache=b.cache||[];FBL.pend=b.pend||[];FBL.out=b.out||[];
  if(isA()){let have=new Set();try{have=new Set(await bkNames('fb'))}catch(e){}
   (b.cache||[]).forEach(r=>{if(!have.has(r.id)&&!FBL.out.find(o=>o.id===r.id))FBL.out.push({id:r.id,f:r.f,by:r.by,at:r.at,hi:r.hi,st:'ok'})})}
  fbSave();try{fbPush()}catch(e){}}}

/* ===== שלב 5: גיבוי אוטומטי מוצפן לענן (Storage: app_backups/{uid}/), "גיבוי אחרון", ושחזור בהתקנה חדשה ===== */
/* התוכן המוצפן הוא בדיוק קובץ הגיבוי הידני (mkBackup), ולכן השחזור עובר דרך parseBackup ו-doRestore הקיימים.
   ההצפנה בטלפון: AES-GCM 256 עם IV אקראי חדש בכל גיבוי, במפתח מ-getBackupKey. המפתח נשמר רק בזיכרון, כמפתח שאי אפשר לייצא.
   הגיבוי הידני ("שמירת גיבוי במכשיר", "שחזור מקובץ גיבוי") והאוסף bk לא משתנים. מצב הגיבוי בשרת: reportBackupStatus */
const ABK_K='lp-abk',ABK_KEEP=30,ABK_MIN_GAP=15*60e3,ABK_TRY_GAP=30*60e3,ABK_DAY=24*3600e3,ABK_MAGIC=[76,80,66,49];/* "LPB1" */
/* שם ה-bucket של Storage – המקום היחיד בקוד. משמש גם את הגיבוי לענן (app_backups/) וגם את עדכוני ה-APK (app_releases/).
   בבנייה ב-GitHub: אם הוגדר המשתנה FIREBASE_STORAGE_BUCKET, הבנייה כותבת אותו כאן במקום ברירת המחדל (main.yml, "Storage bucket name"),
   ושלב ההעלאה לוקח את השם מכאן, כך שהאפליקציה וההעלאה תמיד משתמשות באותו שם. השורה חייבת להתחיל ב-const ST_BUCKET=.
   ברירת המחדל לא מאומתת: צריך לבדוק בלוח הבקרה של Firebase ← Storage. באמולטור: demo-largpeami */
const ST_BUCKET='largpeami.appspot.com';
const ABK_BUCKET=()=>EMU?FB.projectId:ST_BUCKET;
const STB=()=>(EMU?`http://${EMU}:9199`:'https://firebasestorage.googleapis.com')+'/v0/b/'+encodeURIComponent(ABK_BUCKET())+'/o';
/* עדכוני APK מ-Storage (app_releases/latest/): קובץ גרסה (version.json) ו-APK. מותר רק לעובד פעיל או למנהל מחובר (storage.rules).
   updSt מחזיר true רק כשנמצאה שם גרסה חדשה (ואז מוצג "יש גרסה חדשה"). בכל מקרה אחר – בלי כניסה, בלי התוסף, 403, שגיאה, אין רשת,
   קובץ גרסה לא תקין, או שאין גרסה חדשה יותר – מחזיר false בשקט, ו-checkUpdate ממשיך לבדיקה הישנה מ-GitHub.
   ההורדה עצמה: installSession עם הכניסה ועם ה-SHA-256 מקובץ הגרסה. קובץ שלא תואם נמחק ולא מותקן (AppUpdatePlugin.java) */
const UPD_DIR='app_releases/latest/';
const updStUrl=n=>STB()+'/'+encodeURIComponent(UPD_DIR+n)+'?alt=media';
async function updSt(){const C=window.Capacitor,P=C&&C.Plugins&&C.Plugins.AppUpdate;if(!P||!P.installSession||!SY.refresh)return false;
 try{const t=await tok();const r=await fetch(updStUrl('version.json'),{headers:{Authorization:'Firebase '+t},cache:'no-store'});if(!r.ok)return false;const j=await r.json();
  const vc=String(j&&j.versionCode),sha=String(j&&j.sha256||'').toLowerCase(),file=String(j&&j.file||'');
  if(!/^\d+$/.test(vc)||!/^[0-9a-f]{64}$/.test(sha)||!/^[A-Za-z0-9._-]+\.apk$/.test(file))return false;
  if(+vc<=+APP_VC)return false;
  window.__upd=updStUrl(file);window.__updSt={sha256:sha,vc:+vc};
  dlg(`<h3>יש גרסה חדשה</h3><p>אפשר לעדכן עכשיו. ההורדה נפתחת בדפדפן; אחרי שהיא מסתיימת פותחים את הקובץ ומאשרים התקנה. הנתונים נשמרים.</p><div class="row"><button class="btn grow" data-a="updGo">הורד ועדכן</button><button class="btn g grow" data-a="closeDlg">אחר כך</button></div>`);return true}catch(e){return false}}
let ABK={key:null,uid:'',run:0,max:50*1024*1024};/* max: הגודל המרבי לקובץ, זהה למגבלה בכללי Storage (request.resource.size <= 50 * 1024 * 1024) */
function abkGet(){try{return JSON.parse(localStorage.getItem(ABK_K))||{}}catch(e){return{}}}
function abkPut(o){try{localStorage.setItem(ABK_K,JSON.stringify(Object.assign(abkGet(),o)))}catch(e){}}
const abkSig=()=>{try{return S.tx.length+':'+((S.tx[S.tx.length-1]||{}).id||'')}catch(e){return''}};
/* התאריך עטוף בסימני כיוון (LRI…PDI), עם רווח שלא נשבר, כדי שיוצג נכון בתוך טקסט מימין לשמאל */const abkFmt=iso=>{const d=new Date(iso);return '\u2066'+p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()+',\u00a0'+p2(d.getHours())+':'+p2(d.getMinutes())+'\u2069'};
const abkDev=()=>{const C=window.Capacitor;return C&&C.isNativePlatform&&C.isNativePlatform()?'Android':'דפדפן'};
const abkDir=()=>'app_backups/'+SY.uid+'/';
async function abkCall(fn,data){const t=await tok();let r,j=null;
 try{r=await fetch(FNB()+'/'+fn,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({data:data||{}})})}catch(e){const x=new Error('אין חיבור לאינטרנט');x.offline=true;throw x}
 try{j=await r.json()}catch(e){}
 if(!r.ok||!j||j.error){const e=new Error((j&&j.error&&j.error.message)||('שגיאה '+r.status));e.code=r.status;throw e}return j.result}
async function abkKey(){if(ABK.key&&ABK.uid===SY.uid)return ABK.key;const r=await abkCall('getBackupKey');
 const raw=Uint8Array.from(atob(String(r&&r.key||'')),c=>c.charCodeAt(0));if(raw.length!==32)throw new Error('מפתח הגיבוי שהתקבל מהשרת לא תקין');
 const k=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);raw.fill(0);ABK.key=k;ABK.uid=SY.uid;return k}
const abkAD=()=>new TextEncoder().encode('large-pami:'+SY.uid);
async function abkEnc(txt){const k=await abkKey(),iv=crypto.getRandomValues(new Uint8Array(12));
 const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:abkAD()},k,new TextEncoder().encode(txt)));
 const o=new Uint8Array(16+c.length);o.set(ABK_MAGIC,0);o.set(iv,4);o.set(c,16);return o}
async function abkDec(buf){const b=new Uint8Array(buf);if(b.length<33||ABK_MAGIC.some((x,i)=>b[i]!==x))throw new Error('קובץ הגיבוי בענן לא מוכר');
 const k=await abkKey();return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(4,16),additionalData:abkAD()},k,b.slice(16)))}
async function abkSt(path,opt){const t=await tok();opt=opt||{};opt.headers=Object.assign({Authorization:'Firebase '+t},opt.headers);let r;
 try{r=await fetch(STB()+path,opt)}catch(e){const x=new Error('אין חיבור לאינטרנט');x.offline=true;throw x}
 if(!r.ok){const e=new Error(r.status===403?'אין הרשאה לגיבוי בענן':'שגיאה '+r.status);e.code=r.status;throw e}return r}
async function abkList(){const r=await abkSt('?delimiter=%2F&prefix='+encodeURIComponent(abkDir()));const j=await r.json();
 return(j.items||[]).map(x=>x.name).filter(n=>/\/bk-\d{8}T\d{6}(\.\d{3})?Z-[a-z0-9]+\.lpb$/.test(n)).sort()}
const abkWhen=n=>{const m=/bk-(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)/.exec(n||'');return m?`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}Z`:''};
/* גיבוי אחד: יצירה, הצפנה, העלאה, דיווח לשרת, ומחיקת גרסאות מעבר ל-30. כל כישלון נרשם בשקט, והאפליקציה ממשיכה */
async function abkRun(why){if(!isA()||ABK.run)return false;ABK.run=1;abkPut({tryAt:Date.now()});
 try{if(!S.tx.length)throw new Error('אין עדיין נתונים לגבות');
  const sig=abkSig(),enc=await abkEnc(await mkBackup()),d=new Date(),nm='bk-'+d.toISOString().replace(/[-:]/g,'')+'-'+Math.random().toString(36).slice(2,6)+'.lpb';
  if(enc.length>ABK.max){const x=new Error('הגיבוי גדול מדי לענן ('+(enc.length/1048576).toFixed(1)+' MB). שמרו גיבוי במכשיר');x.big=sig;throw x}/* קובץ גדול מהמגבלה: לא מעלים, ולא מנסים שוב עד תנועה חדשה או יום חדש (abkTick) */
  await abkSt('?uploadType=media&name='+encodeURIComponent(abkDir()+nm),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:enc});
  try{await abkCall('reportBackupStatus',{file:nm,device:abkDev()})}catch(e){}
  try{const L=await abkList();for(const n of L.slice(0,Math.max(0,L.length-ABK_KEEP))){try{await abkSt('/'+encodeURIComponent(n),{method:'DELETE'})}catch(e){}}}catch(e){}
  abkPut({last:d.toISOString(),sig,err:'',big:'',size:enc.length,why:why||''});if(cur().v==='data')rerender();return true}
 catch(e){abkPut({err:e&&e.offline?'אין חיבור לאינטרנט':(e&&e.message||String(e)),big:e&&e.big||''});if(cur().v==='data')rerender();return false}
 finally{ABK.run=0}}
/* מתי מגבים: פעם ביום, ואחרי הוספת תנועה כספית. לא יותר מגיבוי אחד ב-15 דקות, ואחרי כישלון – ניסיון חוזר אחרי 30 דקות */
function abkTick(){try{if(!isA()||ABK.run||!navigator.onLine||!S||!S.tx||!S.tx.length)return;const a=abkGet(),now=Date.now(),last=a.last?Date.parse(a.last):0;
 if(a.tryAt&&now-a.tryAt<(a.err?ABK_TRY_GAP:ABK_MIN_GAP))return;
 if(a.big&&a.big===abkSig()&&dayOf(a.tryAt)===today())return;
 const daily=dayOf(a.last)!==today(),chg=a.sig!==abkSig()&&now-last>=ABK_MIN_GAP;if(daily||chg)abkRun(daily?'daily':'change')}catch(e){}}
setInterval(abkTick,60e3);document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(abkTick,5000)});setTimeout(abkTick,12000);

const eyeI='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
function showGate(msg){
 document.body.classList.add('gate');let g=document.getElementById('gate');if(g)g.remove();
 g=document.createElement('div');g.id='gate';
 g.innerHTML=`<div class="gbg" aria-hidden="true"><i></i><i></i><i></i></div>
 <div class="gwrap"><div class="gcard">
  <div class="glogo"><img src="${GATE_LOGO}" alt="לארג׳ פעמי" width="112" height="112"></div>
  <p class="gk">ברוכים הבאים</p>
  <h1 class="gh">למערכת ניהול<br><b>לארג׳ פעמי</b></h1>
  <form id="gform" autocomplete="on" novalidate>
   <label class="gf"><span>אימייל</span><input name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" dir="ltr" required></label>
   <label class="gf"><span>סיסמה</span><input name="pw" type="password" autocomplete="current-password" dir="ltr" required><button type="button" class="geye" id="geye" aria-label="הצג סיסמה">${eyeI}</button></label>
   <p class="gerr" id="gerr" role="alert">${msg?esc(msg):''}</p>
   <button class="gbtn" id="gbtn"><span>כניסה</span></button>
  </form>
  <p class="gfoot">הגישה למורשים בלבד · החשבון נוצר על ידי מנהל המערכת</p>
 </div></div>`;
 document.body.append(g);
 const f=g.querySelector('#gform'),pw=f.pw,err=g.querySelector('#gerr'),bt=g.querySelector('#gbtn');
 g.querySelector('#geye').onclick=()=>{pw.type=pw.type==='password'?'text':'password'};
 f.onsubmit=async e=>{e.preventDefault();const em=f.email.value.trim(),p=pw.value;err.textContent='';
  if(!em||!p){err.textContent='יש להזין אימייל וסיסמה';return}
  bt.disabled=true;bt.classList.add('ld');bt.firstChild.textContent='מתחבר…';
  try{await syLogin(em,p);g.remove();document.body.classList.remove('gate');enterApp(true)}
  catch(x){err.textContent=loginMsg(x);bt.disabled=false;bt.classList.remove('ld');bt.firstChild.textContent='כניסה'}};
 setTimeout(()=>{try{f.email.focus()}catch(e){}},50)}


boot();
/* ===== עדכון חי (שלב 6): חבילת מסכים חתומה מ-Firebase Hosting =====
 הבדיקה, החתימה, טביעות האצבע, הסירוב לגרסה ישנה והחזרה לגרסה הקודמת – בקוד הנייטיב (LiveUpdatePlugin). כאן רק:
 (1) "עליתי תקין" – רק אם boot() שלמעלה רץ בלי שגיאה; (2) בדיקה ברקע, בכל פתיחה ולכל היותר פעם ב-6 שעות כשחוזרים לאפליקציה. בלי אינטרנט – לא קורה כלום. */
function luP(){const C=window.Capacitor;return C&&C.Plugins&&C.Plugins.LiveUpdate}
const LU={t:0};
async function luCheck(man){const P=luP();if(!P||!navigator.onLine)return;LU.t=Date.now();try{const r=await P.check();LU.r=r&&r.result;if(man&&/^ready/.test(LU.r||''))toast('עדכון מסכים הורד. הוא ייכנס לתוקף בפתיחה הבאה של האפליקציה')}catch(e){}}
function updDone(r){const s=r&&r.status;if(s==='user'||s==='legacy')dlg('<h3>יש עדכון – לחצו להתקנה</h3><p>במסך של אנדרואיד שנפתח לחצו "התקן". העדכון מותקן מעל הגרסה הקיימת, והנתונים נשמרים.</p><button class="btn grow" data-a="closeDlg">הבנתי</button>')}
(async()=>{const P=luP();if(!P)return;try{await P.ready({version:String(APP_VC)})}catch(e){}setTimeout(()=>luCheck(false),5000)})();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&LU.t&&Date.now()-LU.t>216e5)luCheck(false)});
</script>
