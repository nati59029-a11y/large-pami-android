 if(b==='sup'&&f.due!==undefined){if(cfDt(f.due))f.plan=f.due.slice(0,7);else errs.push('חסר תאריך תשלום')}
 if((b==='sup'||b==='fixed')&&!pMonth(f.plan))errs.push('חסר חודש לתשלום');
 if(b==='sup'&&!s_(f.inv)&&!f.dn&&!(t0&&!t0.inv&&!t0.dn))errs.push('חסר מספר חשבונית (או סמן תעודת משלוח)');

 if(f.br&&brMulti()&&brAll().some(x=>x.id===f.br)&&(!t0||t0.br||f.br!==txBr(t0)))t.br=f.br;
 if(b==='free')t.desc=s_(f.desc);

 if((b==='sup'||b==='fixed')&&!t0&&f.paynow){const pa=f.pa?pNum(f.pa):t.amt;if(pa==null||pa<=0||pa>t.amt+0.004)return{errs:['סכום ששולם לא תקין']};if(!f.m)return{errs:['בחר אמצעי תשלום']};if(!f.pd)return{errs:['חסר תאריך תשלום']};t.pays=[pyX({id:uid(),d:f.pd,a:rnd(pa),m:f.m},f)]}
 if(b==='cc'&&!t0&&f.link){const inv=S.tx.find(x=>x.id===f.link);if(inv){if(t.amt>bal(inv)+0.004)return{errs:['החיוב גדול מיתרת החשבונית ('+ils(bal(inv))+')']};inv.pays=inv.pays||[];inv.pays.push({id:uid(),d:t.date,a:t.amt,m:'אשראי',cc:t.id});t.x=1;t.link=inv.id}}
 return{t}}

/* החלטת המשתמש 16:18: עסקה לפני (יום החיוב − 1) = החיוב של אותו חודש; מיום החיוב − 1 ואילך = החודש הבא. יום שלא קיים בחודש = היום האחרון, והסף יום לפניו */

function insOf(t){const m=s_(t).match(/(?:תשלום|תש'?)?\s*(\d{1,2})\s*(?:מתוך|of)\s*(\d{1,2})(?!\d)/i);if(!m)return null;const n=+m[1],of=+m[2];return n>=1&&of>=2&&n<=of?{n,of}:null}
/* חודש החיוב של תשלום 1: דף עם תאריך עסקה – החיוב הראשון אחרי התאריך; דף עם תאריך חיוב בלבד (l.bd) – חודש השורה פחות (n−1) */
const insAm=l=>l.bd?addMon(l.date.slice(0,7),-(l.ins.n-1)):(ccBillDate(l.acc,l.date)||l.date).slice(0,7);

function pdfPages(sp){const W=1754,H=1240,M=60,RH=40,F='"Heebo","Noto Sans Hebrew","Segoe UI",Arial,sans-serif',pages=[],cols=sp.cols,sc=(W-2*M)/cols.reduce((a,c)=>a+c.w,0);
const fit=(x,t,w)=>{t=String(t??'');if(x.measureText(t).width<=w)return t;while(t.length>1&&x.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'};
const nw=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.direction='rtl';x.textBaseline='middle';pages.push(x);return[c,x]};
let[c,x]=nw(),y=M;
const th=()=>{x.fillStyle='#1c5a49';x.fillRect(M,y,W-2*M,RH+4);x.fillStyle='#fff';x.font='bold 21px '+F;let xr=W-M;cols.forEach(k=>{const w=k.w*sc;x.textAlign=k.a==='l'?'left':'right';x.fillText(fit(x,k.h,w-16),k.a==='l'?xr-w+8:xr-8,y+RH/2+2);xr-=w});y+=RH+4};
x.fillStyle='#111';x.textAlign='right';x.font='bold 40px '+F;x.fillText(sp.title,W-M,y+20);y+=56;x.font='22px '+F;sp.meta.forEach(([k,v])=>{x.fillStyle='#555';x.fillText(k+': ',W-M,y);const kw=x.measureText(k+': ').width;x.fillStyle='#111';x.fillText(String(v),W-M-kw,y);y+=32});y+=10;th();
sp.rows.forEach((r,i)=>{if(y+RH>H-M-50){[c,x]=nw();y=M;th()}if(i%2){x.fillStyle='#eef1ea';x.fillRect(M,y,W-2*M,RH)}x.fillStyle='#111';x.font='20px '+F;let xr=W-M;cols.forEach((k,j)=>{const w=k.w*sc;x.textAlign=k.a==='l'?'left':'right';x.fillText(fit(x,r[j],w-16),k.a==='l'?xr-w+8:xr-8,y+RH/2);xr-=w});x.strokeStyle='#d5dfe1';x.beginPath();x.moveTo(M,y+RH);x.lineTo(W-M,y+RH);x.stroke();y+=RH});
if(!sp.rows.length){x.fillStyle='#777';x.textAlign='center';x.font='22px '+F;x.fillText('אין תנועות בתקופה',W/2,y+RH/2);y+=RH}
y+=16;if(y+sp.sum.length*36+20>H-M-40){[c,x]=nw();y=M}
sp.sum.forEach(([k,v],i)=>{const last=i===sp.sum.length-1;x.font=(last?'bold ':'')+'24px '+F;x.fillStyle=last?'#1c5a49':'#111';x.textAlign='right';x.fillText(k,W-M,y+14);x.textAlign='left';x.fillText(String(v),W-M-420,y+14);y+=36});
return pages.map((p,i)=>{p.fillStyle='#777';p.font='18px '+F;p.textAlign='center';p.fillText('הופק ב־'+dfmt(today())+' · עמוד '+(i+1)+' מתוך '+pages.length,W/2,H-30);return p.canvas.toDataURL('image/jpeg',.9)})}
function mkPdf(imgs){const enc=new TextEncoder(),parts=[],offs=[];let len=0;const push=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length},obj=(n,f)=>{offs[n]=len;push(n+' 0 obj\n');f();push('\nendobj\n')},N=imgs.length;
push('%PDF-1.4\n');obj(1,()=>push('<</Type/Catalog/Pages 2 0 R>>'));obj(2,()=>push('<</Type/Pages/Count '+N+'/Kids['+imgs.map((_,i)=>(3+i*3)+' 0 R').join(' ')+']>>'));
imgs.forEach((im,i)=>{const p=3+i*3,jpg=Uint8Array.from(atob(im.split(',')[1]),c=>c.charCodeAt(0)),cs='q 842 0 0 595 0 0 cm /Im0 Do Q';
obj(p,()=>push('<</Type/Page/Parent 2 0 R/MediaBox[0 0 842 595]/Resources<</XObject<</Im0 '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>'));
obj(p+1,()=>push('<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream'));
obj(p+2,()=>{push('<</Type/XObject/Subtype/Image/Width 1754/Height 1240/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jpg.length+'>>\nstream\n');push(jpg);push('\nendstream')})});
const xr=len,T=3+N*3;push('xref\n0 '+T+'\n0000000000 65535 f \n');for(let n=1;n<T;n++)push(String(offs[n]).padStart(10,'0')+' 00000 n \n');push('trailer\n<</Size '+T+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
const out=new Uint8Array(len);let o=0;parts.forEach(b=>{out.set(b,o);o+=b.length});return out}
function exportPdf(sp,name){try{saveFile(name,mkPdf(pdfPages(sp)),'application/pdf')}catch(e){toast('יצירת ה־PDF נכשלה: '+(e.message||e))}}

function impEval(){
 const rows=IMPS.raw;let hi=-1,ix={};
 for(let i=0;i<Math.min(rows.length,10)&&hi<0;i++){const m={};rows[i].forEach((c,j)=>{const t=s_(c);for(const k in IH)if(m[k]==null&&IH[k].test(t)){m[k]=j;break}});if(m.type!=null&&m.cat!=null&&m.amt!=null){hi=i;ix=m}}
 if(hi<0)throw new Error('לא נמצאו עמודות סוג, קטגוריה וסכום בשורת הכותרת');
 const have={},cur={},R=[],newSubs=new Set(),simCats={};
 const key=t=>[t.t,t.cat,t.sub||t._subName||t.desc||'',t.date,rnd(t.amt),t.inv||'',t.note||''].join('|');
 live().forEach(t=>{const k=key(t);have[k]=(have[k]||0)+1});
 const key2=t=>[t.t,t.cat,t.sub||t._subName||t.desc||'',t.date,rnd(t.amt),t.note||''].join('|'),noInv={},claimed=new Set();
 live().forEach(t=>{if(!t.inv&&!t.await&&isSupT(t)){const k=key2(t);(noInv[k]=noInv[k]||[]).push(t)}});
 const methodOf=v=>{v=s_(v);if(/צ.?ק/.test(v))return 'צ׳ק';if(/העבר/.test(v))return 'העברה';if(/מזומן/.test(v))return 'מזומן';if(/אשראי/.test(v))return 'אשראי';return null};
 rows.slice(hi+1).forEach((r,i)=>{if(!r.some(x=>s_(x)))return;
  const g=k=>ix[k]!=null?r[ix[k]]:'',o={type:s_(g('type')),cat:s_(g('cat')),sub:s_(g('sub')||g('desc')),note:s_(g('note')),inv:s_(g('inv'))},errs=[],warns=[],x={n:hi+i+2,o,st:'ok'};
  const tp=/הכנס|income/i.test(o.type)?'inc':/הוצא|expense/i.test(o.type)?'exp':null;
  let c=null;
  if(!tp)errs.push('סוג חייב להיות הכנסה או הוצאה');
  else{c=S.cats.find(z=>nrm(z.name)===nrm(o.cat)&&z.kind===tp&&!z.hid);
   if(!c){if(IMPS.make&&o.cat){const nk=tp+'|'+o.cat;if(!simCats[nk])simCats[nk]={id:'c_'+uid(),kind:tp,name:o.cat,beh:tp==='exp'&&s_(g('plan'))!==''?'sup':'simple'};c=simCats[nk]}else errs.push('קטגוריה לא קיימת: '+(o.cat||'(ריקה)')+' (קיימות: '+S.cats.filter(z=>z.kind===tp&&!z.hid).map(z=>z.name).join(', ')+')')}}
  const amt=pNum(g('amt'));x.amt=amt;if(amt==null||amt===0)errs.push('סכום לא תקין');
  const b=c?c.beh:'simple',d0=pDate(g('date')),plan0=ix.plan!=null?pMonth(g('plan')):null;
  if(ix.plan!=null&&s_(g('plan'))&&!plan0)errs.push('חודש תשלום לא תקין');
  const date=d0||(plan0?plan0+'-01':null);if(!date)errs.push('חסר תאריך');else if(!d0)warns.push('אין תאריך – נקבע לפי חודש התשלום');
  if(c&&amt!=null&&amt<0&&b!=='sup')errs.push('מינוס מותר רק בספקים');
  if(c&&b!=='free'&&!o.sub)errs.push('חסר שם כרטיס');
  if(c&&b==='free'&&!o.sub&&!o.note)errs.push('חסר תיאור בשונות');
  let t=null;
  if(!errs.length){
   t={id:uid(),t:tp,cat:c.id,date,amt:rnd(amt),note:o.note,pays:[]};
   if(b==='free')t.desc=o.sub||o.note;else{const sb=S.subs.find(z=>z.cat===c.id&&nrm(z.name)===nrm(o.sub));if(!sb)newSubs.add(c.id+'|'+nrm(o.sub));t.sub=sb?sb.id:null;t._subName=o.sub}
   if(b==='sup'||b==='fixed'){t.kind=amt<0?'credit':'inv';t.inv=o.inv;t.plan=plan0||date.slice(0,7);if(!plan0)warns.push('חודש התשלום נקבע לפי התאריך');if(b==='sup'&&!o.inv)warns.push('חסר מספר חשבונית');
    const pd=ix.paid!=null?pNum(g('paid')):null;
    if(pd!=null&&pd>0){if(amt<=0||pd>amt+0.004)errs.push('הסכום ששולם גדול מהחשבונית');else{const mt=methodOf(g('method'));if(!mt)warns.push('אמצעי תשלום חסר – נרשם “לא צוין”');t.pays=[{id:uid(),d:pDate(g('pdate'))||date,a:rnd(pd),m:mt||'לא צוין'}]}}}
   else if(b==='emp'){t.plan=plan0||date.slice(0,7);const mt=methodOf(g('method'));const okm=mt==='מזומן'||mt==='העברה'?mt:null;if(!okm)warns.push('מזומן/העברה לא צוין – נרשם “לא צוין”');t.pays=[{id:uid(),d:date,a:t.amt,m:okm||'לא צוין'}]}
  }

  if(t&&t.sub&&t.inv){const dd=dupOf({id:'-',sub:t.sub,amt:t.amt,date:t.date,inv:t.inv});if(dd.inv)warns.push('מספר החשבונית כבר קיים אצל הספק')}
  if(t){t._cat=c;const k=key(t);cur[k]=(cur[k]||0)+1;let fl=null;if(!(cur[k]<=(have[k]||0))&&t.inv&&t.sub){const L=(noInv[key2(t)]||[]).filter(z=>!claimed.has(z.id));if(L.length)fl=L[0]}
   if(fl){claimed.add(fl.id);x.st='fill';x.fill=fl.id;x.t=t;warns.push('הוצאה קיימת בלי מספר חשבונית: יתווסף המספר '+t.inv)}
   else if(cur[k]<=(have[k]||0)){x.st='dup';warns.push('כבר קיימת')}else{x.t=t;if(cur[k]>1)warns.push('שורה זהה לשורה קודמת בקובץ – יובאה בכל זאת')}}
  if(x.t&&x.st==='ok'&&x.t.sub&&(x.t.kind||'inv')==='inv'&&x.t.amt>0&&!(x.t.pays||[]).length&&['sup','fixed'].includes((cat(x.t.cat)||{}).beh)){const AW=awFor(x.t.sub),aw0=AW.map(e=>e.date||'').filter(Boolean).sort()[0]||'';if(AW.length&&(!aw0||!x.t.date||x.t.date>=addDays(aw0,-31))){x.st='aw';x.t=null;warns.push('לכרטיס יש תשלום ששולם וממתין לחשבונית – השורה לא יובאה, כדי שלא תיספר פעמיים. הוסיפו אותה ידנית בלי לסמן ששולמה (ידני או סריקה), והאפליקציה תציע לחבר אותה לתשלום')}}
  x.msg=errs.concat(warns);R.push(x)});

 Object.values(IMPS.simCats||{}).forEach(c=>{if(R.some(r=>r.t._cat===c)){const cc={id:c.id,kind:c.kind,name:c.name,beh:c.beh};S.cats.push(cc);nc.push(cc.id)}});

  obj(p+1,()=>push('<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream'));

/* ===== פרשת השבוע (לוח ישראל) ===== */
const PR_N=['בראשית','נח','לך לך','וירא','חיי שרה','תולדות','ויצא','וישלח','וישב','מקץ','ויגש','ויחי','שמות','וארא','בא','בשלח','יתרו','משפטים','תרומה','תצוה','כי תשא','ויקהל','פקודי','ויקרא','צו','שמיני','תזריע','מצורע','אחרי מות','קדושים','אמור','בהר','בחוקותי','במדבר','נשא','בהעלותך','שלח','קורח','חוקת','בלק','פינחס','מטות','מסעי','דברים','ואתחנן','עקב','ראה','שופטים','כי תצא','כי תבוא','נצבים','וילך','האזינו'];
const prLeap=y=>(7*y+1)%19<7;
const prEl=y=>{const m=Math.floor((235*y-234)/19),p=12084+13753*m,d=29*m+Math.floor(p/25920);return (3*(d+1))%7<3?d+1:d};
const prNY=y=>{const a=prEl(y-1),b=prEl(y),c=prEl(y+1);return -1373427+b+(c-b===356?2:b-a===382?1:0)};
const prLen=y=>prNY(y+1)-prNY(y);
/* יום בשבוע של RD: 0=ראשון .. 6=שבת */
const prDow=rd=>((rd%7)+7+0)%7;
function prMonths(y){const L=prLen(y)%10,h=L===5?30:29,k=L===3?29:30;return prLeap(y)?[30,h,k,29,30,30,29,30,29,30,29,30,29]:[30,h,k,29,30,29,30,29,30,29,30,29]}
/* שמות החודשים לפי אינדקס (מתשרי) */
function prRd(y,mi,d){const M=prMonths(y);let r=prNY(y);for(let i=0;i<mi;i++)r+=M[i];return r+d-1}
const prNis=y=>prLeap(y)?7:6, prSiv=y=>prNis(y)+2, prAv=y=>prNis(y)+4;
function prYear(rd){let y=Math.floor((rd+1373427)/365.2468)+1;while(prNY(y+1)<=rd)y++;while(prNY(y)>rd)y--;return y}
const prRdOf=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');if(!m)return null;return Math.floor(Date.UTC(+m[1],+m[2]-1,+m[3])/864e5)+719163};
/* ההפרש 719163: RD של 1970-01-01. RD מודד ימים מ-0001-01-01 הלועזי = 1 */
function prCycle(Y){
 const ny=prNY(Y),nn=prNY(Y+1),leap=prLeap(Y),rhD=prDow(ny),pes=prRd(Y,prNis(Y),15),pesD=prDow(pes);
 /* Y+1: מספר השבתות הרגילות בין ר״ה לסוכות */
 const rh2=prNY(Y+1);let k=0;for(let r=rh2+1;r<rh2+14;r++)if(prDow(r)===6&&r!==rh2+9)k++;
 const isThu=prDow(ny)===5?1:0;
 const ex={VP:!leap&&!(rhD===4&&pesD===0),TM:!leap,AK:!leap,BB:!leap&&pesD!==6,CB:false,MM:!(leap&&(rhD===4||pesD===6))};
 return{ny,nn,leap,k,ex,pes}}
/* rhD: 0=ראשון... בדיקה: ר״ה ביום חמישי = 4 */
const prCache={};
function prSlots(Y){if(prCache[Y])return prCache[Y];
 const c=prCycle(Y),t22=prRd(Y,0,22);let b=t22+1;while(prDow(b)!==6)b++;
 const sp=new Set();const nis=prNis(Y);for(let d=15;d<=21;d++)sp.add(prRd(Y,nis,d));sp.add(prRd(Y,prSiv(Y),6));
 const days=[];for(let r=b;r<c.nn;r+=7)if(!sp.has(r))days.push(r);
 const items=[];const merge=(a)=>a;
 const pairs={21:'VP',26:'TM',28:'AK',31:'BB',38:'CB',41:'MM'};
 for(let i=0;i<=50;i++){if(pairs[i]&&c.ex[pairs[i]]){items.push([i,i+1]);i++}else if(i===50&&c.k===1)items.push([50,51]);else items.push([i])}
 const ok=items.length===days.length;
 return prCache[Y]={days,items,ok,b,c}}
/* מחזיר שם פרשה לשבת (RD) או שם חג; null אם לא ניתן */
function prShabbat(s){const Y=prYear(s),ny=prNY(Y),o=s-ny;
 const nis=prNis(Y),pes=prRd(Y,nis,15);
 if(o===0)return'ראש השנה';if(o===9)return'יום כיפור';
 if(o>=14&&o<=20)return'שבת חול המועד סוכות';if(o===21)return'שמחת תורה';
 if(s>=pes&&s<=pes+6)return s===pes?'פסח':s===pes+6?'שביעי של פסח':'שבת חול המועד פסח';
 if(s===prRd(Y,prSiv(Y),6))return'שבועות';
 /* תחילת השנה: לפני בראשית, שייך למחזור הקודם */
 const t22=prRd(Y,0,22);
 if(s<=t22){const rh=ny;const sats=[];for(let r=rh+1;r<rh+14;r++)if(prDow(r)===6&&r!==rh+9)sats.push(r);const i=sats.indexOf(s);if(i<0)return null;return sats.length===1?'האזינו':i===0?'וילך':'האזינו'}
 const S=prSlots(Y);if(!S.ok)return null;const i=S.days.indexOf(s);if(i<0)return null;return S.items[i].map(x=>PR_N[x]).join('-')}
/* ISO -> {sh:'פרשת ...', ...} לשבת הקרובה (או היום אם שבת) */
function prOfDate(iso){const rd=prRdOf(iso);if(rd==null)return'';let s=rd;while(prDow(s)!==6)s++;const n=prShabbat(s);if(!n)return'';return /^(שבת|ראש|יום|שמחת|פסח|שביעי|שבועות)/.test(n)?n:'פרשת '+n}

const FB_P=`אתה מקבל צילום של "טופס משוב לקוחות" של חנות, שהלקוח מילא בכתב יד בעברית (בדרך כלל בעט כחול או שחור). הטקסט המודפס בטופס הוא בוורוד ובשחור: התעלם ממנו וקרא רק את מה שנכתב ביד.
מבנה הטופס מלמעלה למטה:
1. שורה עם "מספר חשבונית:" (מימין) ו"סכום קנייה:" (משמאל, ליד סמל ₪).
2. טבלת שביעות רצון: שש שורות, ובכל שורה עיגולים מודפסים עם המספרים 1 עד 10 (1 בצד שמאל, 10 בצד ימין). מימין לכל שורה יש סמל קטן ושם הנושא, ובצד ימין של הדף עמודת "הערות".
3. שתי תיבות: "מה הכי אהבתם אצלנו?" (מימין) ו"מה לדעתכם ניתן לשפר?" (משמאל).
4. "פרטי התקשרות": "שם:" (מימין), "טלפון:" (באמצע), "כתובת (לא חובה):" (משמאל).
אחרי הדף המלא מצורפות תמונות מוגדלות של חלקי הדף. השתמש בהן כדי לקרוא כל אות וכל ספרה בדיוק.
כללים:
- ציונים: הלקוח מסמן מספר בעיגול סביבו, בווי (✓), בקו אלכסוני, ב-X או בקשקוש עליו. לפעמים הסימון גולש מחוץ לעיגול, מתחתיו או מעליו: בחר את המספר שהסימון נוגע בו או מצביע עליו. סימון על הסמל או על שם הנושא שבצד ימין אינו ציון. שורה בלי סימון: null. שים לב במיוחד להבדל בין 9 ל-10 הסמוכים.
- מספר חשבונית: ספרות בלבד, בדרך כלל 7 ספרות (למשל 8247460). קרא כל ספרה בנפרד.
- סכום קנייה: מספר. פסיק או נקודה הם נקודה עשרונית ("9,9" הוא 9.9, "58.86" הוא 58.86).
- טלפון: ספרות בלבד, בדרך כלל מספר נייד ישראלי בן 10 ספרות שמתחיל ב-05. אם המספר לא נכנס בשורה והמשכו נכתב מעל השורה או מתחתיה, חבר את החלקים לפי הסדר (למשל "054123" ומעליו "4567" הם 0541234567).
- שם: לרוב שם משפחה בלבד, לפעמים בכתב יד רהוט (כתב עברי מחובר). דוגמאות לשמות נפוצים: אונגר, רבינוביץ, גרוסמן, כהן, לוי, פרידמן, וייס, שטרן, גולדברג. העתק את מה שכתוב בפועל.
- כתובת: רחוב ומספר, כולל לוכסן אם יש (למשל "הרצל 12/3").
- "מה הכי אהבתם" ו"מה לשפר": העתק את כל הטקסט מכל השורות, עם סימני הפיסוק (למשל "שעות פתיחה, מבחר יפה!").

function tkBiz(d){const k=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();if(k in TKBC)return TKBC[k];let b=d.getDay()<=4;
 if(b){try{const p=TKHF.formatToParts(new Date(d.getFullYear(),d.getMonth(),d.getDate(),12)),m=(p.find(x=>x.type==='month')||{}).value,dd=+((p.find(x=>x.type==='day')||{}).value);if((TK_OFF[m]||[]).includes(dd))b=false;/* פורים (י"ד אדר, בשנה מעוברת אדר ב') ותשעה באב (ונדחה לי' באב כשחל בשבת) */if(((m==='Adar'||m==='Adar II')&&dd===14)||(m==='Av'&&(dd===9||(dd===10&&d.getDay()===0))))b=false}catch(e){}}
 return TKBC[k]=b}

/* ===== שלב 5: גיבוי אוטומטי מוצפן לענן (Storage: app_backups/{uid}/), "גיבוי אחרון", ושחזור בהתקנה חדשה ===== */
/* התוכן המוצפן הוא בדיוק קובץ הגיבוי הידני (mkBackup), ולכן השחזור עובר דרך parseBackup ו-doRestore הקיימים.
   ההצפנה בטלפון: AES-GCM 256 עם IV אקראי חדש בכל גיבוי, במפתח מ-getBackupKey. המפתח נשמר רק בזיכרון, כמפתח שאי אפשר לייצא.
   הגיבוי הידני ("שמירת גיבוי במכשיר", "שחזור מקובץ גיבוי") והאוסף bk לא משתנים. מצב הגיבוי בשרת: reportBackupStatus */
const ABK_K=LK('lp-abk'),ABK_KEEP=30,ABK_MIN_GAP=15*60e3,ABK_TRY_GAP=30*60e3,ABK_DAY=24*3600e3,ABK_MAGIC=[76,80,66,49];/* "LPB1" */
/* שם ה-bucket של Storage – המקום היחיד בקוד. משמש גם את הגיבוי לענן (app_backups/) וגם את עדכוני ה-APK (app_releases/).
   בבנייה ב-GitHub: אם הוגדר המשתנה FIREBASE_STORAGE_BUCKET, הבנייה כותבת אותו כאן במקום ברירת המחדל (main.yml, "Storage bucket name"),
   ושלב ההעלאה לוקח את השם מכאן, כך שהאפליקציה וההעלאה תמיד משתמשות באותו שם. השורה חייבת להתחיל ב-const ST_BUCKET=.
   ברירת המחדל לא מאומתת: צריך לבדוק בלוח הבקרה של Firebase ← Storage. באמולטור: demo-largpeami */
const ST_BUCKET='largpeami.firebasestorage.app';
const ABK_BUCKET=()=>EMU?FB.projectId:ST_BUCKET;
const STB=()=>(EMU?`http://${EMU}:9199`:'https://firebasestorage.googleapis.com')+'/v0/b/'+encodeURIComponent(ABK_BUCKET())+'/o';
/* עדכוני APK מ-Storage (app_releases/latest/): קובץ גרסה (version.json) ו-APK. מותר רק לעובד פעיל או למנהל מחובר (storage.rules).
   updSt מחזיר true רק כשנמצאה שם גרסה חדשה (ואז מוצג "יש גרסה חדשה"). בכל מקרה אחר – בלי כניסה, בלי התוסף, 403, שגיאה, אין רשת,
   קובץ גרסה לא תקין, או שאין גרסה חדשה יותר – מחזיר false בשקט, ו-checkUpdate ממשיך לבדיקה הישנה מ-GitHub.
   ההורדה עצמה: installSession עם הכניסה ועם ה-SHA-256 מקובץ הגרסה. קובץ שלא תואם נמחק ולא מותקן (AppUpdatePlugin.java) */
const UPD_DIR='app_releases/latest/';
const updStUrl=n=>STB()+'/'+encodeURIComponent(UPD_DIR+n)+'?alt=media';
async function updSt(){const C=window.Capacitor,P=C&&C.Plugins&&C.Plugins.AppUpdate;if(!P||!P.installSession||!SY.refresh)return false;
 try{const t=await tok();const r=await fetch(updStUrl('version.json'),{headers:{Authorization:'Firebase '+t},cache:'no-store'});if(!r.ok)return false;const j=await r.json();
  const vc=String(j&&j.versionCode),sha=String(j&&j.sha256||'').toLowerCase(),file=String(j&&j.file||'');
  if(!/^\d+$/.test(vc)||!/^[0-9a-f]{64}$/.test(sha)||!/^[A-Za-z0-9._-]+\.apk$/.test(file))return false;
  if(+vc<=+APP_VC)return false;
  window.__upd=updStUrl(file);window.__updSt={sha256:sha,vc:+vc};
  dlg(`<h3>יש גרסה חדשה</h3><p>אפשר לעדכן עכשיו. ההורדה נפתחת בדפדפן; אחרי שהיא מסתיימת פותחים את הקובץ ומאשרים התקנה. הנתונים נשמרים.</p><div class="row"><button class="btn grow" data-a="updGo">הורד ועדכן</button><button class="btn g grow" data-a="closeDlg">אחר כך</button></div>`);return true}catch(e){return false}}
let ABK={key:null,uid:'',run:0,max:50*1024*1024};/* max: הגודל המרבי לקובץ, זהה למגבלה בכללי Storage (request.resource.size <= 50 * 1024 * 1024) */
function abkGet(){try{return JSON.parse(localStorage.getItem(ABK_K))||{}}catch(e){return{}}}
function abkPut(o){try{localStorage.setItem(ABK_K,JSON.stringify(Object.assign(abkGet(),o)))}catch(e){}}
const abkSig=()=>{try{return S.tx.length+':'+((S.tx[S.tx.length-1]||{}).id||'')}catch(e){return''}};
/* התאריך עטוף בסימני כיוון (LRI…PDI), עם רווח שלא נשבר, כדי שיוצג נכון בתוך טקסט מימין לשמאל */const abkFmt=iso=>{const d=new Date(iso);return '\u2066'+p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear()+',\u00a0'+p2(d.getHours())+':'+p2(d.getMinutes())+'\u2069'};
const abkDev=()=>{const C=window.Capacitor;return C&&C.isNativePlatform&&C.isNativePlatform()?'Android':'דפדפן'};
const abkDir=()=>(bzB()?'b/'+SY.bizId+'/':'')+'app_backups/'+SY.uid+'/';
async function abkCall(fn,data){const t=await tok();let r,j=null;
 try{r=await fetch(FNB()+'/'+fn,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({data:data||{}})})}catch(e){const x=new Error('אין חיבור לאינטרנט');x.offline=true;throw x}
 try{j=await r.json()}catch(e){}
 if(!r.ok||!j||j.error){const e=new Error((j&&j.error&&j.error.message)||('שגיאה '+r.status));e.code=r.status;throw e}return j.result}
async function abkKey(){if(ABK.key&&ABK.uid===SY.uid)return ABK.key;const r=await abkCall('getBackupKey');
 const raw=Uint8Array.from(atob(String(r&&r.key||'')),c=>c.charCodeAt(0));if(raw.length!==32)throw new Error('מפתח הגיבוי שהתקבל מהשרת לא תקין');
 const k=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);raw.fill(0);ABK.key=k;ABK.uid=SY.uid;return k}
const abkAD=()=>new TextEncoder().encode('large-pami:'+SY.uid);
async function abkEnc(txt){const k=await abkKey(),iv=crypto.getRandomValues(new Uint8Array(12));
 const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:abkAD()},k,new TextEncoder().encode(txt)));
 const o=new Uint8Array(16+c.length);o.set(ABK_MAGIC,0);o.set(iv,4);o.set(c,16);return o}
async function abkDec(buf){const b=new Uint8Array(buf);if(b.length<33||ABK_MAGIC.some((x,i)=>b[i]!==x))throw new Error('קובץ הגיבוי בענן לא מוכר');
 const k=await abkKey();return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(4,16),additionalData:abkAD()},k,b.slice(16)))}
async function abkSt(path,opt){const t=await tok();opt=opt||{};opt.headers=Object.assign({Authorization:'Firebase '+t},opt.headers);let r;
 try{r=await fetch(STB()+path,opt)}catch(e){const x=new Error('אין חיבור לאינטרנט');x.offline=true;throw x}
 if(!r.ok){const e=new Error(r.status===403?'אין הרשאה לגיבוי בענן':'שגיאה '+r.status);e.code=r.status;throw e}return r}
async function abkList(){const r=await abkSt('?delimiter=%2F&prefix='+encodeURIComponent(abkDir()));const j=await r.json();
 return(j.items||[]).map(x=>x.name).filter(n=>/\/bk-\d{8}T\d{6}(\.\d{3})?Z-[a-z0-9]+\.lpb$/.test(n)).sort()}
const abkWhen=n=>{const m=/bk-(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)/.exec(n||'');return m?`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}Z`:''};
/* גיבוי אחד: יצירה, הצפנה, העלאה, דיווח לשרת, ומחיקת גרסאות מעבר ל-30. כל כישלון נרשם בשקט, והאפליקציה ממשיכה */
async function abkRun(why){if(!isA()||ABK.run)return false;ABK.run=1;abkPut({tryAt:Date.now()});
 try{if(!S.tx.length)throw new Error('אין עדיין נתונים לגבות');
  const sig=abkSig(),enc=await abkEnc(await mkBackup()),d=new Date(),nm='bk-'+d.toISOString().replace(/[-:]/g,'')+'-'+Math.random().toString(36).slice(2,6)+'.lpb';
  if(enc.length>ABK.max){const x=new Error('הגיבוי גדול מדי לענן ('+(enc.length/1048576).toFixed(1)+' MB). שמרו גיבוי במכשיר');x.big=sig;throw x}/* קובץ גדול מהמגבלה: לא מעלים, ולא מנסים שוב עד תנועה חדשה או יום חדש (abkTick) */
  await abkSt('?uploadType=media&name='+encodeURIComponent(abkDir()+nm),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:enc});
  try{await abkCall('reportBackupStatus',{file:nm,device:abkDev()})}catch(e){}
  try{const L=await abkList();for(const n of L.slice(0,Math.max(0,L.length-ABK_KEEP))){try{await abkSt('/'+encodeURIComponent(n),{method:'DELETE'})}catch(e){}}}catch(e){}
  abkPut({last:d.toISOString(),sig,err:'',big:'',size:enc.length,why:why||''});if(cur().v==='data')rerender();return true}
 catch(e){abkPut({err:e&&e.offline?'אין חיבור לאינטרנט':(e&&e.message||String(e)),big:e&&e.big||''});if(cur().v==='data')rerender();return false}
 finally{ABK.run=0}}
/* מתי מגבים: פעם ביום, ואחרי הוספת תנועה כספית. לא יותר מגיבוי אחד ב-15 דקות, ואחרי כישלון – ניסיון חוזר אחרי 30 דקות */
function abkTick(){try{if(!isA()||ABK.run||!navigator.onLine||!S||!S.tx||!S.tx.length)return;const a=abkGet(),now=Date.now(),last=a.last?Date.parse(a.last):0;
 if(a.tryAt&&now-a.tryAt<(a.err?ABK_TRY_GAP:ABK_MIN_GAP))return;
 if(a.big&&a.big===abkSig()&&dayOf(a.tryAt)===today())return;
 const daily=dayOf(a.last)!==today(),chg=a.sig!==abkSig()&&now-last>=ABK_MIN_GAP;if(daily||chg)abkRun(daily?'daily':'change')}catch(e){}}
setInterval(abkTick,60e3);document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(abkTick,5000)});setTimeout(abkTick,12000);

function showGate(msg){
 document.body.classList.add('gate');let g=document.getElementById('gate');if(g)g.remove();
 g=document.createElement('div');g.id='gate';
 g.innerHTML=`<div class="gbg" aria-hidden="true"><i></i><i></i><i></i></div>
 <div class="gwrap"><div class="gcard">
  <div class="glogo"><img src="${bzLast()}" alt="${esc(bzLastN())}" width="112" height="112"></div>
  <p class="gk">ברוכים הבאים</p>
  <h1 class="gh">למערכת ניהול<br><b>${esc(bzLastN())}</b></h1>
  <form id="gform" autocomplete="on" novalidate>
   <label class="gf"><span>אימייל</span><input name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" dir="ltr" required></label>
   <label class="gf"><span>סיסמה</span><input name="pw" type="password" autocomplete="current-password" dir="ltr" required><button type="button" class="geye" id="geye" aria-label="הצג סיסמה">${eyeI}</button></label>
   <p class="gerr" id="gerr" role="alert">${msg?esc(msg):''}</p>
   <button class="gbtn" id="gbtn"><span>כניסה</span></button>
  </form>
  <p class="gk" style="margin:10px 0 0"><button type="button" class="glink" id="gfgt">שכחתי סיסמה / קביעת סיסמה</button></p><p class="gfoot">הגישה למורשים בלבד · החשבון נוצר על ידי מנהל המערכת</p>
 </div></div>`;
 document.body.append(g);
 const f=g.querySelector('#gform'),pw=f.pw,err=g.querySelector('#gerr'),bt=g.querySelector('#gbtn');
 g.querySelector('#geye').onclick=()=>{pw.type=pw.type==='password'?'text':'password'};g.querySelector('#gfgt').onclick=e=>pwForgot(f.email.value.trim(),err,e.currentTarget);
 f.onsubmit=async e=>{e.preventDefault();const em=f.email.value.trim(),p=pw.value;err.textContent='';
  if(!em||!p){err.textContent='יש להזין אימייל וסיסמה';return}
  bt.disabled=true;bt.classList.add('ld');bt.firstChild.textContent='מתחבר…';
  try{await syLogin(em,p);g.remove();document.body.classList.remove('gate');enterApp(true)}
