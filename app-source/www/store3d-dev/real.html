<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>בדיקת תלת מימד מציאותי – דוגמה</title>
<!-- דף בדיקה למפתחים בלבד (שלב 9). לא מחובר לאפליקציה. כל הטקסטורות והתמונות כאן נוצרות בקוד הדף (קנבס) ומסומנות "דוגמה" – לא נתוני העסק ולא צילומים אמיתיים.
     ?n=300 – מספר גופים · ?mode=walk · ?mini=1 – מצב מיני בתוך עמוד גלילה (נטען רק כשהחלון נראה) · ?keep=1500 – זמן עד שחרור הזיכרון במיני (מ"ש) -->
<style>
 html,body{margin:0;background:#121216;color:#eee;font-family:sans-serif}
 #bar{position:fixed;top:0;left:0;right:0;height:46px;box-sizing:border-box;display:flex;gap:6px;align-items:center;padding:6px 8px;background:#1b1b21;border-bottom:1px solid #3a3320;z-index:5}
 #bar b{color:#d4af37;font-size:14px}
 button,input{background:#24242c;color:#e8d9a8;border:1px solid #d4af37;border-radius:8px;padding:6px 8px;font-size:13px}
 button.on{background:#d4af37;color:#141414}
 #view{position:fixed;top:46px;bottom:0;left:0;right:0}
 #info{position:fixed;top:46px;left:0;right:0;padding:2px 8px;font-size:11px;color:#bfae7a;z-index:4;pointer-events:none}
 .page{padding:56px 12px 12px}
 .card{background:#1b1b21;border:1px solid #3a3320;border-radius:14px;padding:10px 12px;margin:10px 0}
 .card b{color:#f1d77a}
 #mini{height:170px;border-radius:12px;overflow:hidden;margin-top:8px;position:relative;background:#23262c}
 .spacer{height:900px;color:#666;font-size:12px}
</style>
</head>
<body>
<script src="../store3d-geo.js"></script>
<script src="../store3d-view.js"></script>
<script>
(function(){
'use strict';
const q=new URLSearchParams(location.search),N=+(q.get('n')||300),MINI=q.get('mini')==='1';
/* ---------- נתוני דוגמה (רק לבדיקה) ---------- */
const map=S3G.sampleMap(N),P='b/demo/store3d/main/';
map.tx=[{id:'t1',path:P+'tex/s-main/t1_1.jpg',w:1024,h:512},{id:'t2',path:P+'tex/s-main/t2_1.jpg',w:512,h:512},{id:'t3',path:P+'tex/s-main/t3_1.jpg',w:512,h:512},{id:'t4',path:P+'tex/s-main/t4_1.jpg',w:512,h:512}];
map.rooms[0].tex={w:'t1',f:'t2',c:'t3'};map.rooms[1].tex={w:'t1',f:'t4'};
const model=S3G.buildModel(map),ST=['ok','ok','ok','ok','ok','ok','iss','iss','miss','rev','out',''],sum={b:{},upd:1763100000000};
model.bays.forEach((b,i)=>{const s=ST[(i*7+3)%ST.length];if(!s)return;const e={s,r:'demo_20261114',t:1763100000000,n:s==='iss'?2:0};if(s==='ok'||s==='iss'||s==='rev')e.th=P+'run/demo_20261114/'+b.id+'_a_1_t.jpg';sum.b[b.id]=e});
window.__sum=sum;window.__map=map;window.__loads=[];
/* ---------- טקסטורות מצוירות בקוד ---------- */
function rnd(seed){let h=seed>>>0||1;return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return(h>>>0)/4294967296}}
function paint(path){const c=document.createElement('canvas'),g=c.getContext('2d');let m;
 if(/t1_1/.test(path)){c.width=1024;c.height=512;g.fillStyle='#f3eee6';g.fillRect(0,0,1024,512);const r=rnd(7);
  for(let i=0;i<70;i++){const x=r()*1024,y=r()*380;g.fillStyle=['#e9c8cf','#cfe0c8','#f0dcb6'][i%3];for(let k=0;k<5;k++){g.beginPath();g.arc(x+Math.cos(k*1.26)*9,y+Math.sin(k*1.26)*9,7,0,7);g.fill()}g.fillStyle='#e0b04a';g.beginPath();g.arc(x,y,4,0,7);g.fill()}
  g.fillStyle='#4f8f4a';g.fillRect(0,390,1024,122);g.fillStyle='#3f7a3b';for(let y=398;y<512;y+=14)g.fillRect(0,y,1024,3);
  g.fillStyle='#8a7a5a';g.font='bold 34px sans-serif';g.fillText('דוגמה – קיר',30,60)}
 else if(/t2_1/.test(path)){c.width=c.height=512;const r=rnd(11);for(let y=0;y<512;y+=64)for(let x=-((y/64)%2)*128;x<512;x+=256){const v=200+r()*25|0;g.fillStyle=`rgb(${v},${v-6},${v-16})`;g.fillRect(x,y,256,64);g.strokeStyle='#a99f8f';g.strokeRect(x+.5,y+.5,256,64)}}
 else if(/t3_1/.test(path)){c.width=c.height=512;g.fillStyle='#f6f6f3';g.fillRect(0,0,512,512);g.strokeStyle='#d6d6d0';for(let i=0;i<=512;i+=128){g.beginPath();g.moveTo(i,0);g.lineTo(i,512);g.moveTo(0,i);g.lineTo(512,i);g.stroke()}g.fillStyle='#fffef5';g.fillRect(40,236,432,40)}
 else if(/t4_1/.test(path)){c.width=c.height=512;g.fillStyle='#9d9e9b';g.fillRect(0,0,512,512);const r=rnd(5);for(let i=0;i<4000;i++){const v=130+r()*60|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(r()*512,r()*512,2,2)}}
 else if((m=/\/(f\d+-[ab]-\d+)_a_1_t\.jpg$/.exec(path))){c.width=320;c.height=400;const r=rnd(m[1].split('').reduce((a,ch)=>a*31+ch.charCodeAt(0),7));
  g.fillStyle='#f4f5f6';g.fillRect(0,0,320,400);
  for(let j=0;j<5;j++){const y=30+j*74;for(let x=8;x<312;){const w=18+r()*36;g.fillStyle=`hsl(${r()*360|0},${45+r()*35|0}%,${40+r()*30|0}%)`;g.fillRect(x,y,w-3,56-r()*18);x+=w}
   g.fillStyle='#d0d4d8';g.fillRect(0,y+58,320,8);g.fillStyle='#f08a24';for(let x=20;x<300;x+=70)g.fillRect(x,y+57,26,10)}
  g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,320,26);g.fillStyle='#fff';g.font='bold 18px sans-serif';g.textAlign='center';g.fillText('דוגמה '+m[1],160,19);
  g.font='bold 40px sans-serif';g.fillStyle='#c00';g.textAlign='left';g.fillText('L',6,390);g.textAlign='right';g.fillText('R',314,390)}
 else return null;
 return new Promise(res=>c.toBlob(res,'image/jpeg',.82))}
const load=p=>{window.__loads.push(p);return new Promise(r=>setTimeout(r,2+Math.random()*8)).then(()=>paint(p)).then(b=>{if(!b)throw new Error('404');return b})};
window.__load=load;
const $=id=>document.getElementById(id);
/* עיצוב האפליקציה: טוענים את כללי ה-CSS האמיתיים מ-index.html (טוקני ds וכפתורים) לפני כללי הדף, כדי שהמקרא ייראה כמו באפליקציה. ?ds=b|c לערכה אחרת */
document.documentElement.dataset.ds=/^[abc]$/.test(q.get('ds')||'')?q.get('ds'):'a';
window.__dsReady=fetch('../index.html').then(r=>r.text()).then(t=>{const st=document.createElement('style');st.id='app-css';
 st.textContent=(t.match(/<style[^>]*>[\s\S]*?<\/style>/gi)||[]).map(x=>x.replace(/^<style[^>]*>|<\/style>$/gi,'')).join('\n').replace(/url\((['"]?)(?![a-z]+:|\/|\.\.)/gi,'url($1../');
 document.head.insertBefore(st,document.head.firstChild);return true}).catch(()=>false);
if(!MINI){
 document.body.insertAdjacentHTML('afterbegin','<div id="bar"><b>דוגמה</b><button id="top">מלמעלה</button><button id="walk">הליכה</button><input id="q" size="5" placeholder="חיפוש"><button id="go">חפש</button></div><div id="view"></div><div id="info"></div>');
 Store3D.open($('view'),map,{sample:true,sum,load,mode:q.get('mode')==='walk'?'walk':'top',onPick:b=>{$('info').textContent=b?('נבחר '+b.id+' · מצב '+(b.st||'-')):''}}).then(h=>{
  window.__h=h;const md=()=>{$('top').classList.toggle('on',h.getMode()==='top');$('walk').classList.toggle('on',h.getMode()==='walk')};md();
  for(const m of['top','walk'])$(m).onclick=()=>{h.setMode(m);md()};
  $('go').onclick=()=>{const r=h.search($('q').value);$('info').textContent=r.length?('נמצאו '+r.length+': '+r.map(x=>x.num).join(', ')):'לא נמצא'};
 });
}else{
 document.body.insertAdjacentHTML('afterbegin','<div class="page"><div class="card"><b>הכנסות היום</b><div>(דוגמה)</div></div><div class="spacer">גלילה למטה…</div><div class="card" id="card"><b>מצב החנות</b><div id="mini"></div></div><div class="spacer"></div></div>');
 window.__m=Store3D.mini($('mini'),map,sum,{load,sample:true,keepMs:+(q.get('keep')||15000)});
}
})();
</script>
</body>
</html>
