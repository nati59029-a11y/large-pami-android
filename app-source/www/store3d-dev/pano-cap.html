<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>בדיקת צילום 360 בטלפון – דוגמה</title>
<!-- דף בדיקה למפתחים בלבד (שלב 18ו). לא מחובר לאפליקציה.
     מצב "מדומה" (ברירת מחדל): המצלמה והחיישן מזויפים – הסצנה נוצרת בקוד הדף (לא צילום אמיתי, לא נתוני העסק), והטלפון "מסתובב" לבד אל כל נקודת יעד.
     ?real=1 – מצלמה וחיישן אמיתיים (לבדיקה בטלפון דרך דפדפן) · ?noise=0.3 – רעש חיישן במעלות · ?auto=1 – מתחיל מיד
     מצב סרטון: בוחרים "סרטון" במסך ולוחצים "הקלטה"; הטלפון המדומה מסתובב ברצף (vspeed, ברירת מחדל 40°/ש'); spin – סיבוב קבוע מהיר.
     drift – סטייה איטית של החיישן (מעלות, מתחילה אחרי הפריים הראשון): המצלמה מציירת את הכיוון האמיתי והחיישן מדווח כיוון סוטה (לבדיקת היישור העדין);
     shake – תאוצה ליניארית מדומה (מ'/ש²) אחרי הפריים הראשון (לבדיקת האזהרה "בלי להזיז"); noAlign – בלי יישור. -->
<style>
 html,body{margin:0;background:#121216;color:#eee;font-family:sans-serif}
 .page{padding:12px;max-width:760px;margin:0 auto}
 b.t{color:#d4af37}
 button{background:#24242c;color:#e8d9a8;border:1px solid #d4af37;border-radius:10px;padding:10px 12px;font-size:14px;min-height:44px;margin:4px 0}
 #out{font-size:12px;color:#bfae7a;white-space:pre-wrap;margin-top:8px}
 #img{width:100%;margin-top:8px;border:1px solid #3a3320;border-radius:8px}
</style>
</head>
<body>
<div class="page">
 <b class="t">צילום 360 בטלפון – דף בדיקה (דוגמה)</b>
 <div><button id="go">התחלת צילום</button></div>
 <div id="out"></div>
 <img id="img" alt="" hidden>
</div>
<script src="../store3d-pano-cap.js"></script>
<script>
(function(){
'use strict';
const Q=new URLSearchParams(location.search),REAL=Q.get('real')==='1',NOISE=+(Q.get('noise')||0),D=Math.PI/180,M=S3PanoCap._m;
/* סצנה סינתטית (אותה פונקציה כמו ב-pano-cap.test.js, עם "מדפים" צבעוניים) */
function scene(x,y,z){const lon=Math.atan2(x,y)/D,lat=Math.asin(Math.max(-1,Math.min(1,z)))/D;
 let r=128+60*Math.sin(4*x+1.3*y)+35*Math.sin(9*z+2*x),g=128+60*Math.sin(5*y-2*z)+30*Math.cos(7*x+3*z),b=128+55*Math.cos(3*z+4*y)+30*Math.sin(11*y+5*x);
 const fl=v=>{const t=((v%15)+15)%15;return Math.min(t,15-t)};if(fl(lon)*Math.cos(lat*D)<1.2||fl(lat)<1.2){r*=.35;g*=.35;b*=.35}
 return[r,g,b]}
window.__scene=scene;
/* מצלמה מזויפת: קנבס שמצויר מהסצנה לפי הכיוון; בהירות משתנה מעט עם הכיוון (כמו חשיפה אוטומטית) */
function mockCam(w,h,fovL){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),im=x.createImageData(w,h),f=M.fovOf(fovL,w,h).f;
 return{el:c,w,h,draw(q){const m=M.qToMat(q),d=im.data,yaw=M.yawPitch(q).yaw,gn=1+.1*Math.sin(yaw*D);
  for(let v=0;v<h;v++)for(let u=0;u<w;u++){const cx=(u+.5-w/2)/f,cy=-(v+.5-h/2)/f,dx=m[0]*cx+m[1]*cy-m[2],dy=m[3]*cx+m[4]*cy-m[5],dz=m[6]*cx+m[7]*cy-m[8],n=Math.hypot(dx,dy,dz),s=scene(dx/n,dy/n,dz/n),i=(v*w+u)*4;
   d[i]=s[0]*gn;d[i+1]=s[1]*gn;d[i+2]=s[2]*gn;d[i+3]=255}x.putImageData(im,0,0)}}}
/* חיישן מזויף. מצב נקודות: "המשתמש" מסתובב אל היעד הבא במהירות קבועה ונעצר עליו.
   מצב סרטון (אחרי "הקלטה"): מסתובב ברצף בלי לעצור (vspeed מעלות לשנייה בזמן אמיתי), שורה אחרי שורה לפי סדר היעדים, עם רעידה קטנה של היד */
function mockSensor(cam,opt){opt=opt||{};return(cb,api)=>{window.__api=api;let yaw=opt.yaw0||20,pitch=-8,last='',t=0,tp=performance.now(),vy=1,vp=0,ph=0,t1=0;const sp=opt.speed||240,vsp=opt.vspeed||40,silent=!!opt.silent;
 const id=setInterval(()=>{if(silent)return;const now=performance.now(),dt=Math.min(.25,(now-tp)/1000);tp=now;if(window.__kick){yaw+=window.__kick;window.__kick=0}const s=api.state?api.state():{},tg=window.__hold?null:api.target();if(window.__pset!=null){pitch=window.__pset;window.__pset=null}/* בדיקות: __hold מקפיא את תנועת הטלפון, __pset קובע זווית */
  if(opt.spin)yaw+=opt.spin*dt;/* סיבוב קבוע (מעלות לשנייה), בלי קשר ליעדים – לבדיקת "לאט יותר" */
  else if(s.mode==='video'){if(s.rec&&tg){const dy=M.wrap180(tg.yaw-yaw),dp=tg.pitch-pitch,L=Math.hypot(dy,dp),st=vsp*dt;
    if(L>st){vy=dy/L;vp=dp/L}yaw+=vy*st;pitch=Math.max(-90,Math.min(90,pitch+vp*st));ph+=dt}}
  else if(tg){const dy=M.wrap180(tg.yaw-yaw),dp=tg.pitch-pitch,L=Math.hypot(dy,dp),st=sp*.016;
   if(L>st){yaw+=dy/L*st;pitch+=dp/L*st}else{yaw=tg.yaw;pitch=tg.pitch}}
  const wob=s.mode==='video'?Math.sin(ph*2.1)*.8:0,nz=()=>NOISE?(Math.random()-.5)*2*NOISE:0,a=-yaw+nz(),b=90+pitch+wob+nz(),g=nz(),k=a.toFixed(3)+b.toFixed(3)+g.toFixed(3);
  const q=M.oriToQuat(a,b,g,0);if(k!==last){cam.draw(q);last=k}t++;
  const dr=opt.drift||0;if(dr&&s.n>0&&!t1)t1=now;const tt=t1?(now-t1)/1000:0;
  cb({alpha:a+dr*Math.sin(1.3*tt),beta:b+dr*Math.sin(.9*tt),gamma:g+.5*dr*Math.sin(1.7*tt),angle:0})},16);
 return()=>clearInterval(id)}}
function b64(blob){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(blob)})}
async function size(blob){const b=await createImageBitmap(blob);const r={w:b.width,h:b.height};b.close();return r}
/* שגיאה ממוצעת של התמונה הקטנה מול הסצנה (|lat|<=60) */
async function errOf(blob,yawRef){const b=await createImageBitmap(blob),W=b.width,H=b.height,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(b,0,0);b.close();
 const d=x.getImageData(0,0,W,H).data;let e=0,n=0;for(let y=0;y<H;y+=2){const lat=(.5-(y+.5)/H)*180;if(Math.abs(lat)>60)continue;for(let xx=0;xx<W;xx+=2){const dr=M.eqDir(xx,y,W,H,yawRef),s=scene(dr[0],dr[1],dr[2]),i=(y*W+xx)*4;
  e+=Math.abs(d[i]-s[0])+Math.abs(d[i+1]-s[1])+Math.abs(d[i+2]-s[2]);n+=3}}return e/n}
/* הרצה (גם מ-Playwright): מחזיר סיכום, או null אם בוטל */
window.__run=async function(o){o=o||{};let opts={};
 if(o.mode)try{localStorage.setItem('lp-s3pc-mode',o.mode)}catch(e){}
 /* שלב 21ו: o.hdr '0' | '1' – מצב כפתור HDR בתחילת הריצה; כל ההנחיות שהוצגו נאספות ב-__hints */
 if(o.hdr!=null)try{localStorage.setItem('lp-s3pc-hdr',String(o.hdr))}catch(e){}
 window.__hints=[];clearInterval(window.__hintT);window.__hintT=setInterval(()=>{const h=document.querySelector('.s3pc-hint');if(h&&h.textContent&&window.__hints[window.__hints.length-1]!==h.textContent)window.__hints.push(h.textContent)},20);
 if(!o.real){const cam=mockCam(o.w||360,o.h||480,o.fovL||62);opts.mock={camera:cam,sensor:mockSensor(cam,o)};
  if(o.shake!=null)opts.mock.motion=cb=>{const id=setInterval(()=>{const c=document.querySelector('.s3pc-cnt');if(c&&/צולמו [1-9]|כוסו [1-9]/.test(c.textContent))cb({acceleration:{x:o.shake,y:0,z:0}})},16);return()=>clearInterval(id)}}
 /* תמונה אמיתית מדומה (o.photo): ok | cw | ccw (מסובבת 90°) | fail | failonce | move (הטלפון זז באמצע) | wide (יחס שונה בלי סיבוב). o.caps: full | none | failexp (applyConstraints נכשל לחשיפה) */
 if(!o.real&&o.photo){const cam=opts.mock.camera,kind=o.photo;window.__photoCalls=0;opts.mock.photo=()=>new Promise((res,rej)=>{const n=++window.__photoCalls;
   if(kind==='fail'||(kind==='failonce'&&n===1))return setTimeout(()=>rej(new Error('photo')),50);
   if(kind==='move'&&n===1)setTimeout(()=>{window.__kick=12},100);
   /* שלב 21ו: החשיפה הנוכחית (מ-applyConstraints) משנה את הבהירות; o.blurAt – מספרי קריאות שבהן התמונה מטושטשת */
   const ex=window.__exp||{t:166,c:0},gain=o.caps==='comp'?Math.pow(2,ex.c):ex.t/166,blur=(o.blurAt||[]).includes(n);(window.__shots=window.__shots||[]).push({n,t:ex.t,c:ex.c,blur});
   setTimeout(()=>{const sw=cam.el.width,sh=cam.el.height,rot=kind==='cw'?1:kind==='ccw'?-1:0,c=document.createElement('canvas');c.width=rot?sh*2:sw*2;c.height=rot?sw*2:sh*2;const g=c.getContext('2d');
    g.filter=(gain!==1?'brightness('+gain+')':'')+(blur?' blur(5px)':'')||'none';
    if(rot>0){g.translate(c.width,0);g.rotate(Math.PI/2);g.drawImage(cam.el,0,0,c.height,c.width)}else if(rot<0){g.translate(0,c.height);g.rotate(-Math.PI/2);g.drawImage(cam.el,0,0,c.height,c.width)}else g.drawImage(cam.el,0,0,c.width,c.height);
   c.toBlob(b=>res(b),'image/jpeg',.9)},kind==='move'?300:120)})}
 if(!o.real&&o.caps){window.__applied=[];const cp=o.caps==='none'?{}:{exposureMode:['continuous','manual'],whiteBalanceMode:['continuous','manual'],focusMode:['continuous','manual'],exposureTime:{min:1,max:1e4},iso:{min:50,max:800}};
  /* שלב 21ו: comp – רק פיצוי חשיפה (בלי נעילה ידנית); failhdr – הנעילה מצליחה, כל שינוי חשיפה אחר נכשל */
  if(o.caps==='comp'){for(const k of['exposureMode','exposureTime','iso'])delete cp[k];cp.exposureCompensation={min:-3,max:3,step:1/3}}
  window.__exp={t:166,c:0};
  opts.mock.caps={caps:cp,settings:o.caps==='none'?{}:o.caps==='comp'?{colorTemperature:5200,focusDistance:0.4,exposureCompensation:0}:{exposureTime:166,colorTemperature:5200,focusDistance:0.4,iso:100},apply:c=>{window.__applied.push(c);const a=c.advanced[0];
   if(o.caps==='failexp'&&a.exposureMode)return Promise.reject(new Error('x'));if(o.caps==='failhdr'&&a.exposureTime!=null&&a.exposureTime!==166)return Promise.reject(new Error('x'));
   if(a.exposureTime!=null)window.__exp.t=a.exposureTime;if(a.exposureCompensation!=null)window.__exp.c=a.exposureCompensation;return Promise.resolve()}}}
 /* שלב 21ה: שלב הרצפה בסוף. o.floor: skip (ברירת מחדל – לוחץ "דלג" מיד, כדי שבדיקות ישנות לא ייתקעו) | shoot (לוחץ "צלם" עד שהצילום מתקבל) | manual (לא עושה כלום, הבדיקה לוחצת בעצמה) */
 if(!o.real&&o.floor!=='manual'){const fm=o.floor||'skip';window.__floorTimer=setInterval(()=>{const b=document.querySelector('.s3pc-fb:not([hidden]) [data-k='+(fm==='shoot'?'fs':'fk')+']');if(b)b.click()},fm==='shoot'?200:30)}
 if(o.noAlign)opts.noAlign=true;if(o.width)opts.width=o.width;
 if(o.fov)opts.fov=o.fov;
 window.__fovKeys=null;const t0=performance.now(),r=await S3PanoCap.start(document.body,opts);clearInterval(window.__floorTimer);if(!r)return null;
 const fs=await size(r.full),ss=await size(r.sm),out={w:r.w,h:r.h,full:fs,sm:ss,fullBytes:r.full.size,smBytes:r.sm.size,meta:r.meta,ms:Math.round(performance.now()-t0),
  type:r.full.type,err:o.real?null:+(await errOf(r.sm,r.meta.yawRef)).toFixed(2)};
 if(o.b64)out.fullB64=await b64(r.full);
 const img=document.getElementById('img');img.src=URL.createObjectURL(r.full);img.hidden=false;
 return out};
/* בדיקת lastRaw: מפרק את ה-zip (חתימות, מספר רשומות, שמות) ומחזיר את meta.json */
window.__raw=async function(){const t0=performance.now(),b=await S3PanoCap.lastRaw();if(!b)return null;const ms=Math.round(performance.now()-t0),u=new Uint8Array(await b.arrayBuffer()),V=new DataView(u.buffer),eo=u.length-22,dec=new TextDecoder();
 const out={type:b.type,bytes:u.length,ms,pk:V.getUint32(0,true)===0x04034b50,eocd:V.getUint32(eo,true)===0x06054b50,count:V.getUint16(eo+10,true),names:[],jpg:0};let o=V.getUint32(eo+16,true);
 for(let i=0;i<out.count;i++){if(V.getUint32(o,true)!==0x02014b50){out.bad=true;break}const nl=V.getUint16(o+28,true),sz=V.getUint32(o+20,true),off=V.getUint32(o+42,true),nm=dec.decode(u.subarray(o+46,o+46+nl));out.names.push(nm);
  const ln=V.getUint16(off+26,true),d=u.subarray(off+30+ln,off+30+ln+sz);if(V.getUint32(off,true)!==0x04034b50)out.bad=true;
  if(/\.jpg$/.test(nm)&&d[0]===0xff&&d[1]===0xd8)out.jpg++;if(nm==='meta.json')out.meta=JSON.parse(dec.decode(d));o+=46+nl}
 return out};
document.getElementById('go').onclick=async()=>{const o=document.getElementById('out');o.textContent='…';
 const r=await window.__run({real:REAL});o.textContent=r?JSON.stringify(r,null,1):'בוטל'};
if(Q.get('auto')==='1')document.getElementById('go').click();
})();
</script>
</body>
</html>
